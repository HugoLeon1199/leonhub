name: Gamma exposure

# The option surface moves with spot, so this is the job that most rewards
# frequency. But every run commits a JSON file, and a 30-minute cron would add
# ~48 commits a day to a repo with a ~1GB soft cap — the freshness would cost
# more than it is worth. Hourly during waking hours is the compromise: the GEX
# levels that matter (flip, max pain, the concentrated strikes) move on the
# scale of hours, not minutes.
#
# The reference product refreshes at 45 seconds behind a real server. That is
# the part a static site deliberately does not try to match.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: gex
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A namespace of its own, not the shared warehouse- prefix the three
      # market-data workflows use: this job runs hourly and would otherwise
      # restore-then-overwrite whichever of their caches saved most recently,
      # silently discarding the slower one's appends (a multi-hour BDS crawl
      # losing to an hourly GEX run is the case that motivated the split).
      # gex.*'s own metric_ts rows still round-trip within this lineage.
      - name: Restore warehouse
        uses: actions/cache/restore@v4
        with:
          path: warehouse/leonhub.duckdb
          key: gex-warehouse-${{ github.run_id }}
          restore-keys: gex-warehouse-

      - name: Compute gamma exposure
        run: |
          python -m pipeline.sources.deribit_gex --symbol BTC
          python -m pipeline.sources.deribit_gex --symbol ETH
          python -m pipeline.transform.gex_build

      - name: Validate before publishing
        run: python -m pipeline.core.validate gex_btc.json gex_eth.json

      - name: Save warehouse
        uses: actions/cache/save@v4
        if: always()
        with:
          path: warehouse/leonhub.duckdb
          key: gex-warehouse-${{ github.run_id }}

      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "data: gamma exposure $(date -u +%Y-%m-%dT%H:%MZ)"
            # Another scheduled job may have pushed while this one worked.
            # Each job writes different files under data/, so that is a
            # fast-forward rather than a conflict: rebase and retry instead of
            # throwing away a completed crawl at the very last step.
            for attempt in 1 2 3; do
              git push && break
              echo "push rejected (attempt $attempt); rebasing onto origin"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            done
          fi
