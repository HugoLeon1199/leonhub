name: Crypto context
on:
  schedule:
    - cron: "25 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crypto-context
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.sources.crypto_context
      - name: Require dated sentiment and valid publication
        run: |
          python -c "import json; d=json.load(open('data/crypto/context.json')); assert d.get('fng',{}).get('as_of'), 'Missing sentiment observation date'"
          python -m pipeline.core.validate
      - name: Publish context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto/context.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: refresh crypto context"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin master || exit 1
          done
          exit 1
