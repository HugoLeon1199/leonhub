name: VN daily data

# Two jobs, sequenced rather than parallel: DuckDB allows a single writer, so a
# collector and a build that overlap would simply fail to open the warehouse.
#
# Timing note: Actions cron drifts 5-30 minutes and is occasionally skipped
# under load, so this runs well after the VN close (14:45 ICT = 07:45 UTC)
# rather than at it, and every step is safe to re-run.

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 16:30 ICT, ~1h45m after close, weekdays
  workflow_dispatch:
    inputs:
      fundamentals:
        description: "Also refresh the quarterly fundamentals panel"
        type: boolean
        default: false

# Shared with daily-bds and flows, not a workflow-local name: all three read
# and write the same warehouse-* cache entry, and GitHub concurrency groups
# only serialize jobs within the same group. A workflow-local group let a BDS
# crawl and a VN daily run overlap and race to save the cache last, silently
# dropping whichever run's appends lost. GEX is on its own gex-warehouse-
# namespace (see gex.yml) and does not need to join this group.
concurrency:
  group: warehouse-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The warehouse is not committed (repo size cap), so CI restores the last
      # snapshot, appends to it, and saves it back as a cache entry. Real
      # history lives in the monthly committed .gz.
      - name: Restore warehouse
        uses: actions/cache/restore@v4
        with:
          path: warehouse/leonhub.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Collect price board and foreign flow
        run: python -m pipeline.sources.vn_equity --what board

      # Second source: adds book depth and foreign ownership room, and
      # cross-checks the first — the two agreed to 0.0007% on market-wide
      # foreign net when this was set up.
      - name: Collect SSI board
        run: python -m pipeline.sources.ssi_board --with-depth
        continue-on-error: true

      # Fills any ticker whose price history is still thin. Skips those already
      # covered, so after the first full pass this is a no-op most days. Not
      # continue-on-error: if this starts failing the rolling windows quietly
      # stop extending, which is exactly the silent gap the run log exists to
      # surface.
      - name: Backfill missing price history
        run: python -m pipeline.sources.vn_history --delay 0.3

      - name: Collect quarterly fundamentals
        if: inputs.fundamentals || github.event_name == 'schedule'
        run: python -m pipeline.sources.vci_direct --skip-existing --delay 0.3

      - name: Build stocks.json
        run: python -m pipeline.transform.stocks_build

      # Breadth reads the same eq_quote the screener does, so it runs in the
      # same job right after it rather than re-opening the warehouse.
      - name: Build market breadth
        run: python -m pipeline.transform.breadth_build

      - name: Build lazy per-ticker ratio history
        run: python -m pipeline.transform.ticker_details_build

      # Runs after the history backfill: signals are evaluated bar by bar over
      # the point-in-time warehouse, so they need the prices to be in first.
      - name: Rebuild signals and their track record
        run: python -m pipeline.transform.signals_build

      - name: Validate before publishing
        run: python -m pipeline.core.validate stocks.json breadth.json signals.json ticker/manifest.json

      - name: Save warehouse
        uses: actions/cache/save@v4
        if: always()
        with:
          path: warehouse/leonhub.duckdb
          key: warehouse-${{ github.run_id }}

      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "data: VN daily refresh $(date -u +%Y-%m-%d)"
            # Another scheduled job may have pushed while this one worked.
            # Each job writes different files under data/, so that is a
            # fast-forward rather than a conflict: rebase and retry instead of
            # throwing away a completed crawl at the very last step.
            for attempt in 1 2 3; do
              git push && break
              echo "push rejected (attempt $attempt); rebasing onto origin"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            done
          fi
