name: US market and FX snapshot

# Delayed daily OHLCV for a curated liquid universe, plus the FX and macro
# reference rates. Both read the same Yahoo endpoint after the same close, so
# they share one job rather than competing for the warehouse writer lock.

on:
  schedule:
    - cron: "15 22 * * 1-5"   # after the US close for most of the year
  workflow_dispatch:

# Shared with daily-vn, daily-bds and flows -- see the comment in daily-vn.yml.
concurrency:
  group: warehouse-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore warehouse
        uses: actions/cache/restore@v4
        with:
          path: warehouse/leonhub.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Collect delayed US OHLCV
        run: python -m pipeline.sources.us_equity --delay 0.35

      # FX carries USD/VND and the dollar index, which is why it runs even
      # though the tab it feeds is about US equities: both are context for the
      # VN market, and neither justifies its own workflow.
      - name: Collect FX and macro rates
        run: python -m pipeline.sources.fx_rates --delay 0.35
        continue-on-error: true

      - name: Validate before publishing
        run: python -m pipeline.core.validate us.json fx.json

      - name: Save warehouse
        uses: actions/cache/save@v4
        if: always()
        with:
          path: warehouse/leonhub.duckdb
          key: warehouse-${{ github.run_id }}

      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us.json data/fx.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "data: US market and FX refresh $(date -u +%Y-%m-%d)"
            # Another scheduled job may have pushed while this one worked.
            # Each job writes different files under data/, so that is a
            # fast-forward rather than a conflict: rebase and retry instead of
            # throwing away a completed crawl at the very last step.
            for attempt in 1 2 3; do
              git push && break
              echo "push rejected (attempt $attempt); rebasing onto origin"
              git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            done
          fi
