<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LEON Hub</title>
<!-- The hub lives at /hub/; this only exists so the bare domain lands there.
     A meta refresh rather than a redirect rule because GitHub Pages serves
     static files and has no server-side routing. The link below is the
     fallback for anything that ignores the refresh. -->
<meta http-equiv="refresh" content="0; url=./hub/">
<link rel="canonical" href="https://leonquant.com/hub/">
<script>location.replace("./hub/" + location.search + location.hash);</script>
<style>
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
    background:#0d1117;color:#c9d1d9;
    font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  a{color:#2dd4bf}
</style>
</head>
<body>
  <p>Đang mở LEON Hub… <a href="./hub/">bấm vào đây nếu trang không tự chuyển</a>.</p>
</body>
</html>
