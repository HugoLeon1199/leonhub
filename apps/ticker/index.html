<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Chi tiết mã — LEON Hub</title>
<meta name="description" content="Hồ sơ cổ phiếu Việt Nam: giá, biểu đồ 5 năm, định giá lịch sử, so sánh ngành, chỉ số cơ bản, dòng tiền, sổ lệnh và tin tức.">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("leon_theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root{--bg:#0d1117;--panel:#151b23;--panel-2:#1b232d;--line:#283442;--text:#e7edf3;--muted:#91a0b0;--accent:#31c9a0;--accent-soft:#13342f;--up:#38d39f;--down:#f0655a;--warn:#e0a83c;--blue:#58a6ff}
:root[data-theme="light"]{--bg:#f4f6f8;--panel:#fff;--panel-2:#edf1f5;--line:#d4dee7;--text:#141b22;--muted:#5d6b7a;--accent:#087c5b;--accent-soft:#d8f2e9;--up:#087c5b;--down:#c2402f;--warn:#8a6412;--blue:#1769aa}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}.page{max-width:1220px;margin:auto;padding:14px 16px 50px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.back{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(280px,1fr) auto auto;align-items:end;gap:18px;margin:14px 0}.symbol{font-size:32px;line-height:1;font-weight:800;letter-spacing:.4px}.name{color:var(--muted);margin-top:6px}.tags,.actions,.segmented{display:flex;gap:6px;flex-wrap:wrap}.tag{padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px}.quote{text-align:right}.price{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums}.change{font-weight:650}.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}.dim{color:var(--muted)}.source{font-size:11px;color:var(--muted);max-width:46ch}
.button,button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 10px;font:inherit;font-size:12px;color:var(--text);cursor:pointer}.button:hover,button:hover{border-color:var(--accent);text-decoration:none}.segmented button{padding:4px 9px}.segmented button.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.jump{width:96px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 9px;color:var(--text);font:12px inherit;text-transform:uppercase}.watch-select{max-width:120px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 7px;color:var(--text);font:12px inherit}
.quote-strip{display:grid;grid-template-columns:repeat(8,minmax(95px,1fr));margin:4px 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.quote-cell{padding:9px 10px;border-right:1px solid var(--line);min-width:0}.quote-cell:last-child{border:0}.quote-cell span{display:block;color:var(--muted);font-size:10px}.quote-cell b{display:block;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;margin-top:2px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow:auto;margin-bottom:10px;padding:7px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.nav a{white-space:nowrap;padding:5px 9px;color:var(--muted);font-size:11px;border-radius:6px}.nav a:hover{background:var(--panel);color:var(--text);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.card{grid-column:span 6;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}.wide{grid-column:1/-1}.span4{grid-column:span 4}h2{font-size:14px;margin:0 0 3px}h3{font-size:12px;margin:0}.cap{margin:0 0 12px;color:var(--muted);font-size:11.5px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px}.metric{background:var(--panel-2);border-radius:7px;padding:9px}.metric .k{display:block;color:var(--muted);font-size:10.5px}.metric .v{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}.bar{display:block;height:4px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.metric small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.chart-box{position:relative;min-height:310px;background:var(--panel-2);border-radius:8px;overflow:hidden}.chart-box svg{display:block;width:100%;height:310px}.chart-loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}.chart-tooltip{position:absolute;pointer-events:none;display:none;background:#0a1017e8;border:1px solid #3b4b5d;border-radius:6px;padding:6px 8px;font-size:11px;color:#eef4fa;box-shadow:0 5px 18px #0008;white-space:nowrap}.legend{display:flex;gap:13px;color:var(--muted);font-size:10px;margin-top:7px}.dot{display:inline-block;width:8px;height:3px;vertical-align:middle;margin-right:4px;background:var(--accent)}
.history-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.mini{background:var(--panel-2);border:1px solid transparent;border-radius:8px;padding:10px;min-width:0}.mini:hover{border-color:var(--line)}.mini-head{display:flex;justify-content:space-between;gap:8px}.mini-value{font-weight:700;font-variant-numeric:tabular-nums}.mini svg{display:block;width:100%;height:78px;margin-top:6px}.mini-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:9.5px}.hidden-metric{display:none}.show-all .hidden-metric{display:block}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:6px}td{padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}.num{text-align:right}.rank{display:flex;align-items:center;gap:8px}.rank .bar{flex:1;min-width:48px}.rank b{min-width:34px;text-align:right;font-size:11px}.peer-name{display:block;max-width:290px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:10px}.you{background:var(--accent-soft)}
.book{display:grid;grid-template-columns:1fr 1fr;gap:12px}.book h3{font-size:11px;color:var(--muted);margin:0 0 4px}.book .bid td:first-child{color:var(--up)}.book .ask td:first-child{color:var(--down)}
.valuation-note{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:11px;border-left:3px solid var(--warn);background:var(--panel-2);border-radius:5px}.valuation-note strong{color:var(--warn)}.news{display:grid;gap:8px}.article{display:block;padding:9px 10px;background:var(--panel-2);border-radius:7px;color:var(--text)}.article:hover{text-decoration:none;outline:1px solid var(--accent)}.article b{display:block;font-size:13px}.meta{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}.empty{color:var(--muted);padding:12px 0}.msg{text-align:center;padding:70px 16px;color:var(--muted)}footer{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.profile-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(230px,1fr);gap:16px}.prose{margin:0;color:var(--text);line-height:1.72}.fact-list{display:grid;gap:7px}.fact{display:flex;justify-content:space-between;gap:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}.fact span{color:var(--muted);font-size:11px}.fact b{text-align:right;font-size:12px}.list{display:grid;gap:6px}.list-item{display:flex;justify-content:space-between;gap:10px;padding:7px 8px;background:var(--panel-2);border-radius:6px}.list-item span{min-width:0}.list-item small{display:block;color:var(--muted)}.event-list{display:grid;gap:0}.event{display:grid;grid-template-columns:90px 56px 1fr;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event time,.event code{color:var(--muted);font-size:10px}.event code{color:var(--accent)}
@media(max-width:900px){.history-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quote-strip{grid-template-columns:repeat(4,1fr)}.quote-cell:nth-child(4n){border-right:0}.hero{grid-template-columns:1fr auto}.actions{grid-column:1/-1}.span4{grid-column:span 6}}
@media(max-width:650px){.card,.span4{grid-column:1/-1}.quote{text-align:left}.hero{display:flex;align-items:flex-start;flex-direction:column}.history-grid{grid-template-columns:1fr}.quote-strip{grid-template-columns:repeat(2,1fr)}.quote-cell:nth-child(2n){border-right:0}.book,.profile-grid{grid-template-columns:1fr}.page{padding:12px 10px 36px}.chart-box,.chart-box svg{min-height:250px;height:250px}.section-head{align-items:flex-start;flex-direction:column}.event{grid-template-columns:72px 48px 1fr}}
</style>
</head>
<body><div class="page">
  <a class="back" href="../../hub/?tab=stocks" target="_top">← Quay lại bộ lọc cổ phiếu</a>
  <div id="root"><div class="msg">Đang tải hồ sơ mã…</div></div>
  <footer id="footer"></footer>
</div>
<script>
"use strict";
const symbol=(new URLSearchParams(location.search).get("s")||"SSI").trim().toUpperCase();
const root=document.getElementById("root");
let activeRow=null;
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,d=2)=>v==null||!isFinite(v)?"—":(+v).toLocaleString("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const compact=v=>v==null||!isFinite(v)?"—":Intl.NumberFormat("vi-VN",{notation:"compact",maximumFractionDigits:2}).format(v);
const signed=(v,suffix="")=>v==null?"—":`${v>=0?"+":""}${fmt(v,2)}${suffix}`;
const optional=url=>fetch(url,{cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null);

Promise.all([
  fetch("../../data/stocks.json",{cache:"no-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),
  optional("../../data/signals.json"),optional("../../data/news_ticker.json"),
  optional(`../../data/ticker/${encodeURIComponent(symbol)}.json`),
]).then(([stocks,signals,news,detail])=>render(stocks,signals||{},news||{},detail)).catch(error=>{
  console.error("Ticker page failed",error);
  root.innerHTML=`<div class="msg">Không đọc được dữ liệu cổ phiếu. Hãy chạy lại pipeline build.<br><small>${esc(error?.message||"Lỗi không xác định")}</small></div>`;
});

function provenance(r,asOf){
  if(r.pr)return '<span class="warn">Giá tham chiếu của sàn — mã chưa có giao dịch khớp trong dữ liệu.</span>';
  if(r.pd)return `<span class="warn">Giá khớp gần nhất ngày ${esc(r.pd)}, không phải giá phiên mới nhất.</span>`;
  return `Giá khớp phiên ${esc(asOf||"gần nhất")}.`;
}

const VALUATIONS=[["P/E","pe","pe_p",false],["P/B","pb","pb_p",false],["P/S","ps","ps_p",false],["EV/EBITDA","ev","ev_p",false],["ROE","roe","roe_p",true],["Cổ tức","dy","dy_p",true]];
function valuationCards(r){return VALUATIONS.map(([label,key,pkey,higher])=>{
  const v=r[key],pct=r[pkey];if(v==null)return"";const shown=fmt(v,2)+(higher?"%":"x");const strength=pct==null?null:(higher?pct:100-pct);
  const note=pct==null?(key==="dy"&&v===0?"Chưa ghi nhận cổ tức":"Chưa đủ 8 quý để xếp hạng"):higher?`Cao hơn ${fmt(pct,0)}% lịch sử`:`Rẻ hơn ${fmt(100-pct,0)}% lịch sử`;
  return `<div class="metric" title="${esc(note)}"><span class="k">${label}</span><span class="v">${shown}</span>${strength==null?"":`<span class="bar"><i style="width:${Math.max(2,strength)}%"></i></span>`}<small>${esc(note)}</small></div>`;
}).join("")}

function flowCards(r){return [["Khối ngoại · 1 phiên","f1","tỷ VND"],["Khối ngoại · 5 phiên","f5","tỷ VND"],["Khối ngoại · 20 phiên","f20","tỷ VND"],["Room ngoại còn lại","fr","% cổ phiếu"]].map(([label,key,unit])=>{
  const v=r[key],tone=key==="fr"?(v!=null&&v<1?"down":""):(v>=0?"up":"down");return `<div class="metric"><span class="k">${label}</span><span class="v ${tone}">${key==="fr"?fmt(v,1):signed(v)}</span><small>${unit}</small></div>`;
}).join("")}
function momentumCards(r){return [["1 tháng","m1","%"],["3 tháng","m3","%"],["6 tháng","m6","%"],["Vị trí 52 tuần","pos52","%"],["Biến động chuẩn hóa","z","σ"]].map(([label,key,unit])=>{const v=r[key],tone=v==null?"dim":v>=0?"up":"down";return `<div class="metric"><span class="k">${label}</span><span class="v ${tone}">${key==="pos52"?fmt(v,0):signed(v)}</span><small>${unit}</small></div>`}).join("")}

function quoteStrip(r){const cells=[
  ["Mở cửa",fmt(r.o,0),"quoteOpen"],["Cao / thấp",`${fmt(r.h,0)} / ${fmt(r.l,0)}`,"quoteRange"],["KL khớp",compact(r.v),"quoteVolume"],["52 tuần",`${fmt(r.h52,0)} / ${fmt(r.l52,0)}`],
  ["Vốn hóa",r.mc==null?"—":`${fmt(r.mc,1)} tỷ`,"quoteMarketCap"],["CP niêm yết",compact(r.sh)],["P/E · P/B",`${fmt(r.pe,2)} · ${fmt(r.pb,2)}`],["Số phiên",fmt(r.days,0)]
];return `<div class="quote-strip">${cells.map(([k,v,id])=>`<div class="quote-cell"><span>${k}</span><b${id?` id="${id}"`:""}>${v}</b></div>`).join("")}</div>`}

const METRIC_META={
 pe:["P/E","x"],pb:["P/B","x"],ps:["P/S","x"],ev:["EV/EBITDA","x"],pcf:["P/CF","x"],dy:["Lợi suất cổ tức","%"],roe:["ROE","%"],roa:["ROA","%"],roic:["ROIC","%"],gpm:["Biên lãi gộp","%"],ebitm:["Biên EBIT","%"],npm:["Biên lãi ròng","%"],de:["Nợ / vốn chủ","x"],cr:["Thanh toán hiện hành","x"],qr:["Thanh toán nhanh","x"],lev:["Đòn bẩy","x"],at:["Vòng quay tài sản","x"],cash:["Tỷ lệ tiền mặt","x"],cycle:["Chu kỳ tiền mặt","ngày"],mc:["Vốn hóa","tỷ"],ebitda:["EBITDA","tỷ"],nim:["NIM","%"],npl:["Nợ xấu","%"],car:["CAR","%"],casa:["CASA","%"],ldr:["LDR","%"],cir:["CIR","%"],dg:["Tăng tiền gửi","%"],lg:["Tăng cho vay","%"]
};
const ORDER={bank:["nim","npl","casa","car","ldr","cir","lg","dg","roe","roa","pb","pe"],common:["roe","roic","roa","gpm","ebitm","npm","de","cr","qr","at","cycle","pe","pb","ps","ev","pcf","dy","ebitda","mc"]};
function metricOrder(industry,metrics){const bank=(industry||"").toLowerCase().includes("ngân hàng"),wanted=bank?ORDER.bank:ORDER.common;return [...wanted,...Object.keys(metrics||{})].filter((x,i,a)=>metrics&&metrics[x]&&a.indexOf(x)===i)}
function cleanSeries(points){const valid=(points||[]).filter(x=>x&&isFinite(+x[1]));if(!valid.length)return[];const nonzero=valid.filter(x=>+x[1]!==0);return nonzero.length&&nonzero.length<valid.length/3?nonzero:valid}
function spark(points,color="var(--accent)"){const data=cleanSeries(points);if(data.length<2)return'<div class="empty">Chưa đủ chuỗi</div>';const vals=data.map(x=>+x[1]),lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo||1)*.12,W=260,H=78;const y=v=>H-6-(v-(lo-pad))/(hi-lo+pad*2)*(H-12),x=i=>6+i*(W-12)/(data.length-1);const zero=lo<0&&hi>0?`<line x1="5" x2="255" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`:"";const path=data.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(+p[1]).toFixed(1)}`).join(" ");return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${zero}<path d="${path}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function historyPanel(detail,period){
  if(!detail||!detail.m)return'<div class="empty">Mã này chưa có chuỗi chỉ số cơ bản trong kho dữ liệu.</div>';
  const keys=metricOrder(detail.i,detail.m);let visible=0;
  return `<div class="history-grid">${keys.map(key=>{const points=cleanSeries(detail.m[key][period]);if(points.length<2)return"";const meta=METRIC_META[key]||[key.toUpperCase(),""];const last=points.at(-1),first=points[0],delta=+last[1]-+first[1],cls=visible++>=9?" hidden-metric":"";return `<article class="mini${cls}" title="Nguồn: ${esc(detail.src||"—")}"><div class="mini-head"><h3>${esc(meta[0])}</h3><span class="mini-value ${delta>=0?"up":"down"}">${fmt(last[1],Math.abs(last[1])>=100?1:2)}${esc(meta[1])}</span></div>${spark(points)}<div class="mini-foot"><span>${esc(first[0])}: ${fmt(first[1],1)}</span><span>${esc(last[0])}: ${delta>=0?"+":""}${fmt(delta,1)}</span></div></article>`}).join("")}</div>${visible>9?'<button id="showMetrics" style="margin-top:10px">Xem toàn bộ chỉ số</button>':""}`;
}

const PEER_FIELDS=[["P/E","pe",false,"x"],["P/B","pb",false,"x"],["ROE","roe",true,"%"],["ROIC","roic",true,"%"],["Biên ròng","npm",true,"%"],["Động lượng 3T","m3",true,"%"]];
function median(a){const x=[...a].sort((a,b)=>a-b),n=x.length;return n?x[Math.floor((n-1)/2)]:null}
function peerTable(r,rows){const peers=rows.filter(x=>x.i===r.i&&x.p!=null&&x.mc!=null);const fields=PEER_FIELDS.map(([label,key,higher,unit])=>{
  let valid=peers.filter(x=>x[key]!=null&&isFinite(+x[key])&&(key!=="pe"||+x[key]>0));if(r[key]==null||valid.length<3)return"";const sorted=valid.slice().sort((a,b)=>+a[key]-+b[key]),at=sorted.findIndex(x=>x.s===r.s),pct=at<0?null:Math.round(at/(sorted.length-1)*100),quality=pct==null?null:(higher?pct:100-pct),med=median(valid.map(x=>+x[key]));return `<tr><td><b>${label}</b><span class="peer-name">${valid.length} doanh nghiệp có dữ liệu</span></td><td class="num">${fmt(r[key],2)}${unit}</td><td class="num">${fmt(med,2)}${unit}</td><td><div class="rank"><span class="bar"><i style="width:${quality==null?0:Math.max(2,quality)}%"></i></span><b>${quality==null?"—":quality+"%"}</b></div></td></tr>`
}).join("");if(!fields)return'<div class="empty">Chưa đủ doanh nghiệp cùng ngành có dữ liệu để so sánh.</div>';return `<table><thead><tr><th>Chỉ số</th><th class="num">${esc(r.s)}</th><th class="num">Trung vị ngành</th><th>Xếp hạng thuận lợi</th></tr></thead><tbody>${fields}</tbody></table>`}

function valuationGuard(r){const ind=(r.i||"").toLowerCase();let model="DCF";let need="báo cáo lưu chuyển tiền tệ, dòng tiền tự do chuẩn hóa và giả định WACC/tăng trưởng";if(ind.includes("ngân hàng")||ind.includes("bảo hiểm")||ind.includes("chứng khoán")){model="Residual Income / P/B";need="BVPS, ROE chuẩn hóa, chi phí vốn và chất lượng tài sản"}else if(ind.includes("bất động sản")){model="NAV / SOTP";need="danh mục dự án, tiến độ pháp lý, nợ ròng và giá trị từng tài sản"}return `<div class="valuation-note"><strong>${model}</strong><span>Chưa xuất giá trị hợp lý vì kho hiện thiếu ${need}. Hệ thống chủ động từ chối tạo con số giả. P/E/P/B ở trên là vị trí lịch sử và so ngành, không phải giá mục tiêu.</span></div>`}

function companyPanel(detail){const c=detail?.co;if(!c)return'<div class="empty">Hồ sơ doanh nghiệp chưa được collector tải cho mã này.</div>';const pct=v=>v==null?"—":`${fmt(Math.abs(v)<=1?v*100:v,2)}%`,rating={BUY:"Mua",OUTPERFORM:"Khả quan",HOLD:"Nắm giữ",UNDERPERFORM:"Kém khả quan",SELL:"Bán"}[c.rating]||c.rating||"—";return `<div class="profile-grid"><div><p class="prose">${esc(c.profile||"Chưa có mô tả doanh nghiệp.")}</p></div><div class="fact-list"><div class="fact"><span>Tên ngắn</span><b>${esc(c.short||detail.s)}</b></div><div class="fact"><span>Niêm yết</span><b>${esc(c.listed||"—")}</b></div><div class="fact"><span>Sở hữu Nhà nước</span><b>${pct(c.state)}</b></div><div class="fact"><span>Sở hữu nước ngoài</span><b>${pct(c.foreign)}</b></div><div class="fact"><span>Khuyến nghị Vietcap</span><b>${esc(rating)}</b></div><div class="fact"><span>Giá mục tiêu Vietcap</span><b>${fmt(c.target,0)}</b></div><small class="dim">Dữ liệu analyst ngày ${esc(c.rating_as_of||"—")}; đây là ý kiến của nguồn, không phải mô hình hay khuyến nghị của LEON.</small></div></div>`}

function statementPanel(detail,period){const metrics=detail?.st||{},priority=["isa3","isa1","isb27","isa5","isa11","isb40","isb41","isa20","iss42","bsa53","bsa54","bsa78","bsa2","bsb103","bsb113","bsa6","bsa15","cfa18","cfa26","cfa34","cfa35","cfa38"],seen=new Set(),cards=[];for(const key of priority){const item=metrics[key],points=cleanSeries(item?.[period]);if(!item||points.length<2)continue;const normalized=(item.label||key).toLowerCase().replace(/[^a-zà-ỹ0-9]/g,"");if(seen.has(normalized))continue;seen.add(normalized);const last=points.at(-1),first=points[0],delta=+last[1]-+first[1];cards.push(`<article class="mini"><div class="mini-head"><h3>${esc(item.label||key.toUpperCase())}</h3><span class="mini-value ${delta>=0?"up":"down"}">${compact(last[1])} tỷ</span></div>${spark(points,"var(--blue)")}<div class="mini-foot"><span>${esc(first[0])}: ${compact(first[1])}</span><span>${esc(last[0])}: ${delta>=0?"+":""}${compact(delta)}</span></div></article>`)}return cards.length?`<div class="history-grid">${cards.join("")}</div>`:'<div class="empty">Mã này chưa có báo cáo tài chính đã chuẩn hóa.</div>'}
function peoplePanel(detail,officers=false){const rows=(detail?.owners||[]).filter(x=>officers?x.p:!x.p).slice(0,12);if(!rows.length)return'<div class="empty">Chưa có dữ liệu phù hợp.</div>';return `<div class="list">${rows.map(x=>`<div class="list-item"><span><b>${esc(x.n)}</b><small>${esc(x.p||(x.t==="CORPORATE"?"Tổ chức":"Cổ đông"))}${x.d?` · cập nhật ${esc(x.d)}`:""}</small></span><b>${x.pct==null?"—":fmt(x.pct,2)+"%"}</b></div>`).join("")}</div>`}
function relationshipPanel(detail){const rows=(detail?.rel||[]).slice(0,14);if(!rows.length)return'<div class="empty">Chưa có công ty con/liên kết.</div>';return `<div class="list">${rows.map(x=>`<div class="list-item"><span><b>${esc(x.n)}</b><small>${x.t==="subsidiary"?"Công ty con":"Công ty liên kết"}${x.c?` · ${esc(x.c)}`:""}</small></span><b>${x.pct==null?"—":fmt(x.pct,1)+"%"}</b></div>`).join("")}</div>${detail.rel_count>rows.length?`<small class="dim">Đang hiển thị ${rows.length}/${detail.rel_count} quan hệ sở hữu.</small>`:""}`}
function eventsPanel(detail){const rows=(detail?.events||[]).slice(0,15);if(!rows.length)return'<div class="empty">Chưa có sự kiện doanh nghiệp.</div>';return `<div class="event-list">${rows.map(x=>`<div class="event"><time>${esc(x.d||"—")}</time><code>${esc(x.c||"OTHER")}</code><span>${esc(x.t||"Sự kiện doanh nghiệp")}${x.ex&&x.ex!==x.d?`<small class="meta">Ngày GDKHQ: ${esc(x.ex)}</small>`:""}</span></div>`).join("")}</div>`}

/* SSI serves only level 1 once the session has closed, so levels 2-3 are
   usually absent rather than zero. Render the levels that exist instead of two
   permanently blank rows -- see docs/source-gotchas.md. */
function orderBook(r){const side=(prefix,cls)=>[1,2,3].filter(i=>r[`${prefix}${i}`]!=null).map(i=>`<tr class="${cls}"><td>${fmt(r[`${prefix}${i}`],0)}</td><td class="num">${fmt(r[`${prefix}${i}v`],0)}</td></tr>`).join("");const bids=side("b","bid"),asks=side("a","ask");if(!bids&&!asks)return'<div class="empty">Chưa có ảnh chụp sổ lệnh SSI cho mã này.</div>';return `<div class="book"><div><h3>Dư mua</h3><table><thead><tr><th>Giá</th><th class="num">Khối lượng</th></tr></thead><tbody>${bids||'<tr><td colspan="2" class="dim">Không có lệnh mua</td></tr>'}</tbody></table></div><div><h3>Dư bán</h3><table><thead><tr><th>Giá</th><th class="num">Khối lượng</th></tr></thead><tbody>${asks||'<tr><td colspan="2" class="dim">Không có lệnh bán</td></tr>'}</tbody></table></div></div>`}
function signalTable(signals){const open=(signals.open||[]).filter(x=>x.s===symbol).map(x=>({...x,state:"Đang mở"})),closed=(signals.closed||[]).filter(x=>x.s===symbol).map(x=>({...x,state:x.why==="target"?"Chốt lời":x.why==="stop"?"Dừng lỗ":"Hết hạn"})),rows=[...open,...closed].slice(0,20);if(!rows.length)return'<div class="empty">Chưa có lệnh nào của quy tắc SMA20 × SMA50 cho mã này.</div>';return `<table><thead><tr><th>Vào</th><th>Trạng thái / ra</th><th class="num">Giá vào</th><th class="num">Giá ra</th><th class="num">R</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.state)}${x.x?` · ${esc(x.x)}`:""}</td><td class="num">${fmt(x.entry,0)}</td><td class="num">${fmt(x.exit,0)}</td><td class="num ${x.r==null?"dim":x.r>=0?"up":"down"}">${x.r==null?"—":signed(x.r,"R")}</td></tr>`).join("")}</tbody></table>`}
function newsList(payload){const map=payload.tickers||payload,rows=Array.isArray(map[symbol])?map[symbol]:[];if(!rows.length)return'<div class="empty">Chưa có tin gần đây được khớp chắc chắn với mã này.</div>';const reason={name:"khớp theo tên công ty",alias:"khớp theo tên thương hiệu",symbol:"khớp theo mã chứng khoán"};return `<div class="news">${rows.map(x=>`<a class="article" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer"><b>${esc(x.t)}</b><span class="meta">${esc(x.src||"Nguồn tin")} · ${esc(x.d||"")} · ${esc(reason[x.m]||x.m||"")}</span></a>`).join("")}</div>`}

async function loadPriceChart(){const box=document.getElementById("priceChart");if(!box)return;const now=Math.floor(Date.now()/1000),from=now-5*365*86400,url=`https://histdatafeed.vps.com.vn/tradingview/history?symbol=${encodeURIComponent(symbol)}&resolution=D&from=${from}&to=${now}`;try{const d=await fetch(url).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});if(d.s!=="ok"||!d.t||d.t.length<2)throw Error("no_data");const pts=d.t.map((t,i)=>({t:t*1000,c:+d.c[i]*1000,o:+d.o?.[i]*1000,h:+d.h?.[i]*1000,l:+d.l?.[i]*1000,v:+d.v[i]})).filter(x=>isFinite(x.c));applyLiveQuote(pts.at(-1),pts.at(-2));renderPriceSvg(box,pts)}catch(e){box.innerHTML='<div class="chart-loading">Không tải được chuỗi giá trực tiếp từ VPS. Dữ liệu cơ bản phía dưới vẫn dùng bình thường.</div>'}}
function applyLiveQuote(last,prev){if(!last)return;const set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value};const change=prev?.c?(last.c/prev.c-1)*100:null,date=new Date(last.t).toLocaleDateString("vi-VN");set("heroPrice",fmt(last.c,0));set("heroChange",change==null?"":signed(change,"%"));const ch=document.getElementById("heroChange");if(ch){ch.className=`change ${change==null?"":change>=0?"up":"down"}`};set("heroSource",`Giá đóng cửa VPS ngày ${date}; có thể trễ so với thời gian thực.`);set("quoteOpen",fmt(last.o,0));set("quoteRange",`${fmt(last.h,0)} / ${fmt(last.l,0)}`);set("quoteVolume",compact(last.v));if(activeRow?.sh)set("quoteMarketCap",`${fmt(last.c*activeRow.sh/1e9,1)} tỷ`)}
function renderPriceSvg(box,data){const W=1100,H=310,pad={l:16,r:68,t:18,b:42},pw=W-pad.l-pad.r,ph=H-pad.t-pad.b-42;const vals=data.map(x=>x.c),lo=Math.min(...vals),hi=Math.max(...vals),range=hi-lo||1,x=i=>pad.l+i*pw/(data.length-1),y=v=>pad.t+(hi-v)/range*ph;const sma=data.map((p,i)=>i<199?null:data.slice(i-199,i+1).reduce((a,b)=>a+b.c,0)/200);const line=data.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(2)},${y(p.c).toFixed(2)}`).join(" "),ma=sma.map((v,i)=>v==null?"":`${i===199?"M":"L"}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(" ");const maxVol=Math.max(...data.map(x=>x.v||0),1),base=H-pad.b;const step=Math.max(1,Math.floor(data.length/240));let vols="";for(let i=0;i<data.length;i+=step){const h=(data[i].v||0)/maxVol*35;vols+=`<rect x="${x(i)}" y="${base-h}" width="${Math.max(1,pw/data.length*step*.65)}" height="${h}" fill="${i&&data[i].c<data[i-1].c?'var(--down)':'var(--up)'}" opacity=".38"/>`};let grid="";for(let i=0;i<5;i++){const v=hi-i*range/4,yy=y(v);grid+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${W-pad.r+7}" y="${yy+4}" fill="var(--muted)" font-size="10">${Math.round(v).toLocaleString('vi-VN')}</text>`};const years=[];let seen="";data.forEach((p,i)=>{const yr=new Date(p.t).getFullYear();if(String(yr)!==seen){seen=String(yr);years.push(`<text x="${x(i)}" y="${H-10}" fill="var(--muted)" font-size="10">${yr}</text>`)}});box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${vols}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="${ma}" fill="none" stroke="var(--warn)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>${years.join("")}<line id="crossX" y1="${pad.t}" y2="${base}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/></svg><div class="chart-tooltip" id="chartTip"></div>`;const svg=box.querySelector("svg"),cross=box.querySelector("#crossX"),tip=box.querySelector("#chartTip");svg.addEventListener("mousemove",ev=>{const rect=svg.getBoundingClientRect(),px=(ev.clientX-rect.left)/rect.width*W,idx=Math.max(0,Math.min(data.length-1,Math.round((px-pad.l)/pw*(data.length-1)))),p=data[idx];cross.setAttribute("x1",x(idx));cross.setAttribute("x2",x(idx));cross.setAttribute("visibility","visible");tip.style.display="block";tip.style.left=Math.min(rect.width-155,Math.max(5,ev.clientX-rect.left+10))+"px";tip.style.top="8px";tip.innerHTML=`${new Date(p.t).toLocaleDateString('vi-VN')}<br><b>${fmt(p.c,0)}</b> · KL ${compact(p.v)}`});svg.addEventListener("mouseleave",()=>{cross.setAttribute("visibility","hidden");tip.style.display="none"})}

function bindHistory(detail){let period="q";const target=document.getElementById("historyTarget"),buttons=[...document.querySelectorAll("[data-period]")];buttons.forEach(btn=>btn.addEventListener("click",()=>{period=btn.dataset.period;buttons.forEach(x=>x.classList.toggle("active",x===btn));target.classList.remove("show-all");target.innerHTML=historyPanel(detail,period);bindShow()}));function bindShow(){document.getElementById("showMetrics")?.addEventListener("click",ev=>{target.classList.toggle("show-all");ev.currentTarget.textContent=target.classList.contains("show-all")?"Thu gọn":"Xem toàn bộ chỉ số"})}bindShow()}
function bindStatements(detail){const target=document.getElementById("statementTarget"),buttons=[...document.querySelectorAll("[data-stperiod]")];buttons.forEach(btn=>btn.addEventListener("click",()=>{buttons.forEach(x=>x.classList.toggle("active",x===btn));target.innerHTML=statementPanel(detail,btn.dataset.stperiod)}))}
function bindTickerNav(rows){const key="leon_vn_watch_v1",button=document.getElementById("tickerWatch"),select=document.getElementById("tickerWatchList"),jump=document.getElementById("tickerJump");let watch=[];try{watch=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}if(!Array.isArray(watch))watch=[];const refresh=()=>{const on=watch.includes(symbol);button.textContent=on?"★ Đang theo dõi":"☆ Theo dõi";button.setAttribute("aria-pressed",String(on));select.innerHTML='<option value="">Watchlist</option>'+watch.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")};button.addEventListener("click",()=>{const at=watch.indexOf(symbol);if(at>=0)watch.splice(at,1);else watch.unshift(symbol);watch=[...new Set(watch)].slice(0,40);try{localStorage.setItem(key,JSON.stringify(watch))}catch(e){}refresh()});select.addEventListener("change",()=>{if(select.value)location.search="?s="+encodeURIComponent(select.value)});const go=()=>{const next=jump.value.trim().toUpperCase();if(rows.some(x=>x.s===next))location.search="?s="+encodeURIComponent(next)};jump.addEventListener("change",go);jump.addEventListener("keydown",e=>{if(e.key==="Enter")go()});document.getElementById("tickerOptions").replaceChildren(...rows.map(r=>{const o=document.createElement("option");o.value=r.s;o.label=r.n||"";return o}));refresh()}
