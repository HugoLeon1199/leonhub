<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Cổ phiếu Việt Nam — LEON Hub</title>
<meta name="description" content="Bộ lọc cổ phiếu HOSE, HNX, UPCOM theo P/E, P/B, ROE, vốn hóa và dòng tiền khối ngoại. Định giá so với chính lịch sử của mã.">

<script>try{document.documentElement.dataset.theme=localStorage.getItem("leon_theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>

<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1c242e; --line:#26303c;
  --text:#e7edf3; --muted:#8b98a8; --accent:#38d39f;
  --up:#38d39f; --down:#f0655a; --warn:#e0a83c;
}
:root[data-theme="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel-2:#eaeff4; --line:#d5dee6;
  --text:#141b22; --muted:#5d6b7a; --accent:#0c8a63;
  --up:#0c8a63; --down:#c2402f; --warn:#8a6412;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
}

/* ---- Filters ---- */
.bar{
  flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
  padding:8px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
input,select{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:7px; padding:6px 9px; font:inherit; font-size:13px;
}
input:focus,select:focus{outline:2px solid var(--accent); outline-offset:-1px}
#q{width:150px}
.rng{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted)}
.rng input{width:62px; font-variant-numeric:tabular-nums}
.presets{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:0 12px 8px}
.presets::-webkit-scrollbar{display:none}
.preset{
  appearance:none; border:1px solid var(--line); background:var(--panel-2); color:var(--muted);
  font:inherit; font-size:12px; padding:5px 11px; border-radius:99px; cursor:pointer; white-space:nowrap;
}
.preset:hover{color:var(--text); border-color:var(--accent)}
.preset[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#04150f; font-weight:600}
:root[data-theme="light"] .preset[aria-pressed="true"]{color:#fff}
.spacer{flex:1}
.count{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.btn{
  appearance:none; border:1px solid var(--line); background:var(--panel-2); color:var(--muted);
  border-radius:7px; padding:6px 11px; font:inherit; font-size:12.5px; cursor:pointer;
}
.btn:hover{color:var(--text)}

/* ---- Table ---- */
.wrap{flex:1; overflow:auto; min-height:0}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
th,td{padding:6px 10px; white-space:nowrap; border-bottom:1px solid var(--line)}
th{
  position:sticky; top:0; z-index:2; background:var(--panel); text-align:right;
  font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
  font-weight:600; cursor:pointer; user-select:none;
}
th:first-child,td:first-child{text-align:left; position:sticky; left:0; z-index:1; background:var(--bg)}
th:first-child{z-index:3; background:var(--panel)}
th:nth-child(2),td:nth-child(2){text-align:left}
th[aria-sort]{color:var(--accent)}
th .dir::after{content:"";}
th[aria-sort="descending"] .dir::after{content:" ↓"}
th[aria-sort="ascending"] .dir::after{content:" ↑"}
td{text-align:right; font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--panel-2)}
tbody tr:hover td:first-child{background:var(--panel-2)}
.sym{font-weight:700; letter-spacing:.3px}
.name{display:block; color:var(--muted); font-size:12px; width:240px; max-width:240px; white-space:normal; overflow-wrap:break-word; line-height:1.35}
.name:hover{color:var(--accent); text-decoration:underline}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--muted)} .warn{color:var(--warn)}

/* A percentile bar reads faster than the number alone: it says "cheap for this
   company" at a glance, which the raw ratio never does. */
.pct{display:inline-block; width:26px; height:4px; border-radius:2px; background:var(--line);
     position:relative; margin-left:5px; vertical-align:middle}
.pct i{position:absolute; top:0; bottom:0; left:0; border-radius:2px; background:var(--accent)}

.msg{padding:36px 20px; text-align:center; color:var(--muted)}
.msg strong{display:block; color:var(--text); margin-bottom:6px; font-size:15px}

/* Bank ratios are null for ~1,700 non-banks, so they stay out of the way until
   asked for rather than padding every row with dashes. */
.bankcol{display:none}
body.show-bank .bankcol{display:table-cell}

/* The rules block. `flex:0 0 auto` is load-bearing: body is a flex column with
   overflow hidden and .wrap is flex:1, so without it an expanded panel fights
   the table for height instead of pushing it down. */
.guide{flex:0 0 auto; margin:0 12px 8px; border:1px solid var(--line); border-radius:8px;
  background:var(--panel); font-size:12px; max-height:46vh; overflow:auto}
.guide>summary{cursor:pointer; padding:8px 12px; color:var(--muted); list-style:none}
.guide>summary::-webkit-details-marker{display:none}
.guide>summary::before{content:"▸ "; color:var(--accent)}
.guide[open]>summary::before{content:"▾ "}
.guide>summary:hover{color:var(--text)}
.guide .gbody{padding:2px 12px 12px; border-top:1px solid var(--line)}
.guide h4{margin:12px 0 5px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent)}
.guide dl{display:grid; grid-template-columns:minmax(110px,auto) 1fr; gap:3px 12px; margin:0}
.guide dt{color:var(--text); font-weight:600}
.guide dd{margin:0; color:var(--muted)}
.guide .warnrow{margin-top:8px; padding:7px 9px; border-left:3px solid var(--warn);
  background:var(--panel-2); border-radius:4px; color:var(--muted)}
.guide .warnrow b{color:var(--warn)}
footer{
  flex:0 0 auto; padding:5px 12px; background:var(--panel); border-top:1px solid var(--line);
  font-size:11px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap;
}
footer b{color:var(--text); font-weight:600}
</style>
</head>
<body>

<div class="bar">
  <input id="q" type="search" placeholder="Tìm mã / tên…" aria-label="Tìm mã hoặc tên công ty" autocomplete="off">
  <select id="ex" aria-label="Sàn"><option value="">Tất cả sàn</option></select>
  <select id="ind" aria-label="Ngành"><option value="">Tất cả ngành</option></select>
  <span class="rng">P/E <input id="peMin" type="number" placeholder="từ" aria-label="P/E từ"><input id="peMax" type="number" placeholder="đến" aria-label="P/E đến"></span>
  <span class="rng">ROE% <input id="roeMin" type="number" placeholder="từ" aria-label="ROE từ"></span>
  <span class="rng">Vốn hóa ≥ <input id="mcMin" type="number" placeholder="tỷ" aria-label="Vốn hóa tối thiểu"></span>
  <span class="rng">KL ≥ <input id="volMin" type="number" placeholder="CP" aria-label="Khối lượng khớp tối thiểu"></span>
  <span class="rng">P/B <input id="pbMin" type="number" placeholder="từ" aria-label="P/B từ"><input id="pbMax" type="number" placeholder="đến" aria-label="P/B đến"></span>
  <span class="rng">Cổ tức ≥ <input id="dyMin" type="number" placeholder="%" aria-label="Cổ tức tối thiểu"></span>
  <span class="rng">Vị trí 52T <input id="posMin" type="number" placeholder="từ" aria-label="Vị trí 52 tuần từ"><input id="posMax" type="number" placeholder="đến" aria-label="Vị trí 52 tuần đến"></span>
  <label class="rng" title="Hiện NIM, nợ xấu, CIR, CASA, LDR — chỉ có số ở nhóm ngân hàng">
    <input id="bankCols" type="checkbox"> Chỉ số NH</label>
  <span class="spacer"></span>
  <span class="count" id="count">—</span>
  <button class="btn" id="csv" type="button">Tải CSV</button>
  <button class="btn" id="reset" type="button">Xóa lọc</button>
</div>

<div class="presets" id="presets"></div>

<!-- The rules, on the page rather than only in a title attribute. Tooltips are
     invisible on touch and unsearchable, and a screener whose filters cannot be
     read is the opaque dashboard CLAUDE.md warns against. Generated from COLS
     and PRESETS so it cannot drift from what the code actually does. -->
<details class="guide" id="guide">
  <summary>Các điều kiện lọc đang làm gì? — bấm để xem</summary>
  <div class="gbody" id="guideBody"></div>
</details>

<div class="wrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="msg" id="msg"><strong>Đang tải dữ liệu…</strong></div>
</div>

<footer>
  <span>Nguồn: <b>Vietcap</b> qua pipeline LEON</span>
  <span>Cập nhật: <b id="upd">—</b></span>
  <span id="cover"></span>
  <span>Số liệu tham khảo, không phải khuyến nghị đầu tư.</span>
</footer>

<script>
"use strict";

/* Columns: `k` is the JSON key, `p` names its percentile companion where one
   exists. Percent-typed ratios arrive already converted by the pipeline. */
const COLS = [
  {k:"s",   t:"Mã",       kind:"sym"},
  {k:"n",   t:"Tên",      kind:"name"},
  {k:"e",   t:"Sàn",      kind:"text"},
  {k:"p",   t:"Giá",      kind:"price", d:0,
   hint:"* = giá tham chiếu của sàn, mã chưa từng khớp lệnh. † = giá khớp phiên cũ hơn, mã không giao dịch hôm nay."},
  {k:"ch",  t:"±%",       kind:"pct"},
  {k:"mc",  t:"Vốn hóa",  kind:"num", d:0, hint:"Tỷ VND"},
  {k:"pe",  t:"P/E",      kind:"num", d:1, p:"pe_p"},
  {k:"pb",  t:"P/B",      kind:"num", d:2, p:"pb_p"},
  {k:"roe", t:"ROE %",    kind:"num", d:1, p:"roe_p"},
  {k:"roic",t:"ROIC %",   kind:"num", d:1},
  {k:"npm", t:"Biên LN %",kind:"num", d:1},
  {k:"de",  t:"Nợ/VCSH",  kind:"num", d:2},
  {k:"dy",  t:"Cổ tức %", kind:"num", d:2, p:"dy_p"},
  {k:"ps",  t:"P/S",      kind:"num", d:2, p:"ps_p"},
  {k:"ev",  t:"EV/EBITDA",kind:"num", d:1, p:"ev_p"},
  {k:"roa", t:"ROA %",    kind:"num", d:1,
   hint:"Lợi nhuận trên tổng tài sản — dùng được cho cả ngân hàng lẫn doanh nghiệp thường."},
  {k:"gpm", t:"Biên gộp %", kind:"num", d:1},
  {k:"cr",  t:"Thanh toán HH", kind:"num", d:2,
   hint:"Tài sản ngắn hạn chia nợ ngắn hạn. Dưới 1 nghĩa là nợ đến hạn vượt tài sản có thể xoay ngay."},
  {k:"m1",  t:"1 tháng %", kind:"pct", hint:"Thay đổi giá 1 tháng (≈22 phiên)"},
  {k:"m3",  t:"3 tháng %", kind:"pct", hint:"Thay đổi giá 3 tháng (≈64 phiên)"},
  {k:"m6",  t:"6 tháng %", kind:"pct", hint:"Thay đổi giá 6 tháng (≈127 phiên)"},
  {k:"pos52", t:"Vị trí 52T", kind:"pos52",
   hint:"Vị trí trong biên độ 52 tuần: 100 là đang ở đỉnh, 0 là đang ở đáy của chính mã đó."},
  {k:"z",   t:"Z-score", kind:"z",
   hint:"Biến động hôm nay tính theo độ lệch chuẩn của chính mã đó. " +
        "±2 trở lên là bất thường — 3% với mã nhỏ là bình thường nhưng với VCB là sự kiện."},
  {k:"fr",  t:"Room NN %", kind:"room",
   hint:"Tỉ lệ cổ phiếu còn được phép bán cho nhà đầu tư nước ngoài. " +
        "Gần 0% nghĩa là mã đã kín room — dòng tiền ngoại không thể vào thêm dù muốn."},
  {k:"f1",  t:"NN 1p",    kind:"flow", hint:"Khối ngoại mua ròng hôm nay (tỷ VND)"},
  {k:"f5",  t:"NN 5p",    kind:"flow", hint:"Khối ngoại mua ròng 5 phiên (tỷ VND)"},
  {k:"f20", t:"NN 20p",   kind:"flow", hint:"Khối ngoại mua ròng 20 phiên (tỷ VND)"},
  {k:"i",   t:"Ngành",    kind:"text"},
  // Liquidity. A screener that cannot express "only names I could actually
  // buy" surfaces shells whose every trade is a multi-sigma move.
  {k:"v",   t:"KL khớp",  kind:"num", d:0,
   hint:"Khối lượng khớp phiên gần nhất (cổ phiếu). Mã khối lượng thấp có thể không mua/bán được ở mức giá hiển thị."},
  {k:"spread", t:"Chênh mua-bán %", kind:"num", d:2, derived:true,
   hint:"Khoảng cách giữa giá chào bán và giá chào mua tốt nhất, tính theo % giá. Càng rộng càng khó khớp lệnh — đây là chi phí thật khi vào và ra."},
  // Bank ratios. The pipeline maps six of them and the "Ngân hàng tốt" preset
  // filters on two, yet none were ever rendered: the reader could not see the
  // numbers deciding which names qualified. Hidden by default because they are
  // null for the ~1,700 non-banks; the toggle reveals them.
  {k:"nim", t:"NIM %",    kind:"num", d:2, bank:true,
   hint:"Biên lãi ròng — chênh lệch giữa lãi cho vay và lãi huy động."},
  {k:"npl", t:"Nợ xấu %", kind:"num", d:2, bank:true,
   hint:"Tỉ lệ nợ xấu. Càng thấp càng tốt; trên 3% là ngưỡng cảnh báo của NHNN."},
  {k:"cir", t:"CIR %",    kind:"num", d:1, bank:true,
   hint:"Chi phí trên thu nhập. Thấp nghĩa là ngân hàng vận hành hiệu quả."},
  {k:"casa",t:"CASA %",   kind:"num", d:1, bank:true,
   hint:"Tỉ lệ tiền gửi không kỳ hạn — nguồn vốn rẻ. Cao là lợi thế cạnh tranh."},
  {k:"ldr", t:"LDR %",    kind:"num", d:1, bank:true,
   hint:"Dư nợ trên tiền gửi. Cao nghĩa là cho vay nhiều so với vốn huy động."},
  {k:"days",t:"Số phiên", kind:"num", d:0,
   hint:"Số phiên đã quan sát được. Ít phiên thì Vị trí 52T và Z-score chưa đáng tin."},
];

/* One-click strategies. Each is a documented rule, not a black box — the title
   attribute states it so a reader can disagree with the definition. */
const PRESETS = [
  { id:"cheap_quality", label:"Rẻ + sinh lời tốt",
    hint:"P/E ≤ 12, P/B ≤ 2, ROE ≥ 15%",
    fn:r => r.pe > 0 && r.pe <= 12 && r.pb > 0 && r.pb <= 2 && r.roe >= 15 },
  { id:"deep_value", label:"Định giá thấp",
    hint:"P/B ≤ 1, P/E > 0",
    fn:r => r.pb > 0 && r.pb <= 1 && r.pe > 0 },
  { id:"quality", label:"Chất lượng cao",
    hint:"ROE ≥ 20%, ROIC ≥ 15%, Nợ/VCSH ≤ 1",
    fn:r => r.roe >= 20 && r.roic >= 15 && (r.de == null || r.de <= 1) },
  { id:"dividend", label:"Cổ tức cao",
    hint:"Cổ tức ≥ 6%, P/E > 0",
    fn:r => r.dy >= 6 && r.pe > 0 },
  { id:"foreign_buy", label:"Khối ngoại gom",
    hint:"Mua ròng cả 5 và 20 phiên",
    fn:r => r.f5 > 0 && r.f20 > 0 },
  { id:"cheap_vs_self", label:"Rẻ so với chính nó",
    hint:"P/E ở nhóm 25% thấp nhất lịch sử của mã, ROE ≥ 10%",
    fn:r => r.pe_p != null && r.pe_p <= 25 && r.roe >= 10 },
  { id:"quality_dip", label:"Tốt nhưng đang ở đáy",
    hint:"ROE ≥ 15%, P/E > 0, giá nằm ở nhóm 25% thấp nhất biên độ 52 tuần",
    fn:r => r.roe >= 15 && r.pe > 0 && r.pos52 != null && r.pos52 <= 25 },
  { id:"momentum", label:"Đà tăng mạnh",
    hint:"Tăng 3 tháng ≥ 15% và 1 tháng ≥ 0 — xu hướng còn nguyên, không phải nảy kỹ thuật",
    fn:r => r.m3 >= 15 && r.m1 >= 0 },
  { id:"unusual", label:"Biến động bất thường",
    hint:"Z-score hôm nay vượt ±2 độ lệch chuẩn của chính mã đó",
    fn:r => r.z != null && Math.abs(r.z) >= 2 },
  { id:"full_room", label:"Kín room ngoại",
    hint:"Room còn dưới 1% — cầu ngoại bị chặn bởi trần sở hữu, không phải bởi định giá",
    fn:r => r.fr != null && r.fr < 1 },
  { id:"bank", label:"Ngân hàng tốt",
    hint:"Có NIM, NPL ≤ 2%, ROE ≥ 15%",
    fn:r => r.nim != null && r.npl != null && r.npl <= 2 && r.roe >= 15 },
];

const el = id => document.getElementById(id);
let ROWS = [], META = {};
let sortKey = "mc", sortDir = -1;
const activePresets = new Set();

/* ---------- load ---------- */
fetch("../../data/stocks.json", {cache:"no-cache"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(payload => {
    // The file carries provenance alongside the rows; older builds were a bare
    // array, so accept both rather than break on a stale artifact.
    const rows = Array.isArray(payload) ? payload : payload.rows;
    META = Array.isArray(payload) ? {} : payload;
    ROWS = rows;
    // Bid-ask spread as a share of price. Derived here rather than in the
    // pipeline because it is purely a view over two columns already published,
    // and the artifact's short-key budget is paid on every page load.
    for(const r of ROWS){
      if(r.b1 > 0 && r.a1 > 0 && r.a1 >= r.b1){
        const mid = (r.a1 + r.b1) / 2;
        if(mid > 0) r.spread = (r.a1 - r.b1) / mid * 100;
      }
    }
    el("msg").hidden = true;
    // Drop columns nothing populates yet: an all-blank column reads as broken,
    // and the rolling foreign-flow windows stay empty until the warehouse has
    // accumulated enough trading days to fill them.
    for(let i = COLS.length - 1; i >= 0; i--){
      const col = COLS[i];
      if(col.kind === "sym" || col.kind === "name") continue;
      if(!rows.some(r => r[col.k] != null)) COLS.splice(i, 1);
    }
    if(!COLS.some(c => c.k === sortKey)) sortKey = "s";
    buildFacets();
    buildHead();
    buildPresets();
    // After the presets exist (it marks the unusable ones) and before render.
    buildGuide();
    readUrl();
    render();
    // The trading session the data describes, not today's date: a file three
    // days stale would otherwise stamp itself with the moment it was opened.
    const session = META.as_of
      ? new Date(`${META.as_of}T00:00:00+07:00`).toLocaleDateString("vi-VN", {timeZone:"Asia/Ho_Chi_Minh"})
      : "—";
    const built = META.updated_at
      ? new Date(META.updated_at).toLocaleString("vi-VN", {timeZone:"Asia/Ho_Chi_Minh", hour12:false}) + " ICT"
      : "chưa có giờ đóng gói";
    el("upd").textContent = `phiên ${session} · đóng gói ${built}`;
    const withF = rows.filter(r => r.pe != null || r.pb != null).length;
    const priced = rows.filter(r => r.p != null).length;
    // "Có khớp lệnh" (had a matched trade) is only true of rows with neither
    // pr nor pd set -- the price fallback (see stocks_build.py) means `p` no
    // longer implies a trade happened, so the coverage line must not either.
    const traded = rows.filter(r => r.p != null && !r.pr && !r.pd).length;
    el("cover").textContent =
      `${rows.length} mã · ${priced} có giá (${traded} khớp lệnh hôm nay) · ${withF} có chỉ số cơ bản` +
      (META.trading_days ? ` · ${META.trading_days} phiên lịch sử` : "");
  })
  .catch(err => {
    el("msg").innerHTML =
      "<strong>Chưa có dữ liệu</strong>" +
      "Chạy <code>python -m pipeline.transform.stocks_build</code> để tạo " +
      "<code>data/stocks.json</code>.";
  });

function buildFacets(){
  // Delisted tickers carry no price and no fundamentals. They stay selectable
  // -- the row is a real historical record -- but sort last so the filter reads
  // as three live exchanges plus an archive, not four peers.
  const DELISTED = "Đã hủy niêm yết";
  const exchanges = [...new Set(ROWS.map(r => r.e).filter(Boolean))]
    .sort((a, b) => (a === DELISTED) - (b === DELISTED) || a.localeCompare(b, "vi"));
  exchanges.forEach(v => el("ex").add(new Option(v, v)));
  const industries = [...new Set(ROWS.map(r => r.i).filter(Boolean))].sort((a,b) => a.localeCompare(b,"vi"));
  industries.forEach(v => el("ind").add(new Option(v, v)));
}

function buildHead(){
  const tr = el("head");
  COLS.forEach(col => {
    const th = document.createElement("th");
    th.innerHTML = col.t + '<span class="dir"></span>';
    if(col.bank) th.className = "bankcol";
    if(col.hint) th.title = col.hint;
    th.addEventListener("click", () => {
      if(sortKey === col.k) sortDir = -sortDir;
      else { sortKey = col.k; sortDir = col.kind === "sym" || col.kind === "text" ? 1 : -1; }
      render();
    });
    tr.appendChild(th);
  });
}

function buildPresets(){
  PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.className = "preset";
    b.type = "button";
    b.textContent = p.label;
    b.title = p.hint;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => {
      // Presets intersect rather than replace one another: "cheap" and "foreign
      // buying" is a question the single-selection version could not ask.
      if(activePresets.has(p.id)) activePresets.delete(p.id);
      else activePresets.add(p.id);
      [...el("presets").children].forEach((c, i) =>
        c.setAttribute("aria-pressed", String(activePresets.has(PRESETS[i].id))));
      syncUrl();
      render();
    });
    el("presets").appendChild(b);
  });
}

/* Build the rules panel from the same arrays the filters run on. Hand-written
   prose here would be a second source of truth and would rot the first time a
   threshold changed. */
function buildGuide(){
  const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const dl = items => "<dl>" + items.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") + "</dl>";

  // A preset whose inputs the warehouse cannot supply yet matches nothing. Say
  // so, rather than letting the button return an empty table in silence.
  const dead = PRESETS.filter(p => !ROWS.some(r => p.fn(r)));

  let html = "<h4>Nút lọc nhanh</h4>"
    + dl(PRESETS.map(p => [p.label, p.hint]));

  if(dead.length){
    html += `<div class="warnrow"><b>Chưa dùng được:</b> ${dead.map(p => esc(p.label)).join(", ")}. `
      + "Điều kiện cần dữ liệu mà kho chưa tích đủ ngày — nút sẽ không ra mã nào cho tới khi đủ.</div>";
  }

  html += "<h4>Ý nghĩa các cột</h4>"
    + dl(COLS.filter(c => c.hint).map(c => [c.t, c.hint]));

  html += "<h4>Cách đọc con số</h4>" + dl([
    ["Đơn vị", "Giá tính bằng VND. Vốn hóa và dòng tiền khối ngoại tính bằng tỷ VND. Khối lượng tính bằng cổ phiếu."],
    ["Thanh phần trăm", "Ô có thanh nhỏ bên dưới là so với chính lịch sử của mã đó, không phải so với ngành. Cần ít nhất 8 quý mới xếp hạng được."],
    ["Dấu *", "Giá tham chiếu của sàn — mã chưa từng có lệnh khớp trong dữ liệu đã thu."],
    ["Dấu †", "Giá khớp của một phiên cũ hơn, mã không giao dịch phiên gần nhất."],
    ["Ô trống (—)", "Nguồn không cung cấp, không phải bằng 0. Chỉ số ngân hàng để trống ở doanh nghiệp thường là đúng."],
    ["Kết hợp bộ lọc", "Chọn nhiều nút cùng lúc thì mã phải thỏa mãn tất cả các điều kiện."],
    ["Giới hạn hiển thị", "Bảng vẽ tối đa 600 dòng cho nhẹ máy; số đếm và file CSV vẫn tính đủ toàn bộ kết quả lọc."],
  ]);

  html += "<h4>Nguồn và thời điểm</h4>" + dl([
    ["Giá, khối lượng, khối ngoại", "Vietcap; sổ lệnh và room ngoại từ SSI iBoard."],
    ["Chỉ số cơ bản", "Vietcap, theo quý từ 2018 tới nay."],
    ["Phiên dữ liệu", (META.as_of || "—") + " · " + (META.trading_days || "—") + " phiên đã quan sát."],
    ["Lưu ý", "Đây là dữ liệu tham khảo, không phải khuyến nghị đầu tư."],
  ]);

  el("guideBody").innerHTML = html;
}

/* ---------- filtering ---------- */
function filters(){
  const num = id => { const v = parseFloat(el(id).value); return isFinite(v) ? v : null; };
  return {
    q: el("q").value.trim().toLowerCase(),
    ex: el("ex").value,
    ind: el("ind").value,
    peMin: num("peMin"), peMax: num("peMax"),
    roeMin: num("roeMin"), mcMin: num("mcMin"),
    volMin: num("volMin"), pbMin: num("pbMin"), pbMax: num("pbMax"),
    dyMin: num("dyMin"), posMin: num("posMin"), posMax: num("posMax"),
  };
}

function passes(r, f){
  if(f.q && !(r.s || "").toLowerCase().includes(f.q) &&
     !(r.n || "").toLowerCase().includes(f.q)) return false;
  if(f.ex && r.e !== f.ex) return false;
  if(f.ind && r.i !== f.ind) return false;
  if(f.peMin != null && !(r.pe >= f.peMin)) return false;
  if(f.peMax != null && !(r.pe <= f.peMax)) return false;
  if(f.roeMin != null && !(r.roe >= f.roeMin)) return false;
  if(f.mcMin != null && !(r.mc >= f.mcMin)) return false;
  if(f.volMin != null && !(r.v >= f.volMin)) return false;
  if(f.pbMin != null && !(r.pb >= f.pbMin)) return false;
  if(f.pbMax != null && !(r.pb <= f.pbMax)) return false;
  if(f.dyMin != null && !(r.dy >= f.dyMin)) return false;
  if(f.posMin != null && !(r.pos52 >= f.posMin)) return false;
  if(f.posMax != null && !(r.pos52 <= f.posMax)) return false;
  // Every selected preset must hold, so combinations narrow rather than widen.
  for(const id of activePresets){
    const preset = PRESETS.find(p => p.id === id);
    if(preset && !preset.fn(r)) return false;
  }
  return true;
}

/* ---------- render ---------- */
const fmt = (v, d) => v == null || !isFinite(v)
  ? '<span class="dim">—</span>'
  : v.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const html = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function cell(row, col){
  const v = row[col.k];
  switch(col.kind){
    case "sym":  return `<a class="sym" href="../../hub/?tab=ticker&s=${encodeURIComponent(v ?? "")}" target="_top" title="Mở hồ sơ ${html(v)}">${html(v)}</a>`;
    case "name": return `<a class="name" href="../../hub/?tab=ticker&s=${encodeURIComponent(row.s ?? "")}" target="_top" title="Mở hồ sơ ${html(row.s)}">${html(v)}</a>`;
    case "text": return v ? `<span class="dim">${v}</span>` : '<span class="dim">—</span>';
    case "price": {
      // p can come from three places: today's close, an older session this
      // ticker last actually traded (pd = that date), or the exchange's own
      // reference price for a symbol that has never traded (pr = 1). A number
      // with no marker reads as "today's price" — that must stay true, so the
      // other two cases are flagged rather than silently blended in.
      if(v == null) return '<span class="dim">—</span>';
      const out = fmt(v, col.d ?? 0);
      if(row.pr) return `<span class="warn" title="Giá tham chiếu của sàn — mã chưa từng khớp lệnh trong dữ liệu đã thu thập, không phải giá giao dịch">${out}<sup>*</sup></span>`;
      if(row.pd) return `<span class="dim" title="Giá khớp gần nhất ngày ${row.pd} — mã không giao dịch phiên mới nhất">${out}<sup>†</sup></span>`;
      return out;
    }
    case "pct":
      if(v == null) return '<span class="dim">—</span>';
      return `<span class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : ""}${v.toFixed(2)}</span>`;
    case "flow":
      if(v == null) return '<span class="dim">—</span>';
      return `<span class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : ""}${v.toFixed(1)}</span>`;
    case "pos52": {
      if(v == null) return '<span class="dim">—</span>';
      // The bar reads as "how far up its own year the price sits", which is the
      // question; the number alone needs the high and low to mean anything.
      const tone = v >= 90 ? "up" : v <= 10 ? "down" : "";
      return `<span class="${tone}">${v}</span>` +
             `<span class="pct"><i style="width:${Math.max(2, v)}%"></i></span>`;
    }
    case "z": {
      if(v == null) return '<span class="dim">—</span>';
      // Only flag what is actually unusual; everything inside ±2 is a normal day.
      const tone = Math.abs(v) >= 2 ? (v > 0 ? "up" : "down") : "dim";
      return `<span class="${tone}">${v > 0 ? "+" : ""}${v.toFixed(1)}</span>`;
    }
    case "room":
      if(v == null) return '<span class="dim">—</span>';
      // Under ~1% is effectively full: the constraint, not the number, is what
      // the reader needs to see.
      return v < 1
        ? '<span class="down" title="Đã kín room ngoại">Kín room</span>'
        : `<span class="${v < 5 ? "warn" : "dim"}">${v.toFixed(1)}</span>`;
    default: {
      let out = fmt(v, col.d ?? 2);
      const pct = col.p ? row[col.p] : null;
      if(pct != null){
        // The bar shows how cheap the value is versus this ticker's own eight
        // years, so a long bar means cheap. Drawing the raw percentile instead
        // would fill the bar for expensive tickers, which reads backwards.
        const cheapness = 100 - pct;
        const label = col.k === "pe" || col.k === "pb" || col.k === "ps" || col.k === "ev"
          ? `Rẻ hơn ${cheapness}% số quý trong 8 năm qua của chính mã này`
          : `Cao hơn ${pct}% số quý trong 8 năm qua của chính mã này`;
        const fill = col.k === "roe" || col.k === "dy" ? pct : cheapness;
        out += `<span class="pct" title="${label}"><i style="width:${Math.max(2, fill)}%"></i></span>`;
      }
      return out;
    }
  }
}

function render(){
  const f = filters();
  const rows = ROWS.filter(r => passes(r, f));

  rows.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if(x == null && y == null) return 0;
    if(x == null) return 1;          // blanks always sink
    if(y == null) return -1;
    if(typeof x === "string") return x.localeCompare(y, "vi") * sortDir;
    return (x - y) * sortDir;
  });

  el("count").textContent = `${rows.length} / ${ROWS.length} mã`;
  [...el("head").children].forEach((th, i) => {
    if(COLS[i].k === sortKey) th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending");
    else th.removeAttribute("aria-sort");
  });

  // Cap the DOM: 600 rows is more than anyone scans, and the count above
  // still reports the true match total.
  const shown = rows.slice(0, 600);
  el("body").innerHTML = shown
    .map(r => "<tr>" + COLS.map(c => `<td${c.bank ? ' class="bankcol"' : ""}>${cell(r, c)}</td>`).join("") + "</tr>")
    .join("");

  window.__filtered = rows;
}

/* ---------- url state, so a filtered view is shareable ---------- */
// One list, used by sync, restore, listeners and reset alike. Three separate
// copies is how a newly added control ends up saved but never restored.
const FILTER_IDS = ["q","ex","ind","peMin","peMax","roeMin","mcMin",
  "volMin","pbMin","pbMax","dyMin","posMin","posMax"];

function syncUrl(){
  const p = new URLSearchParams();
  const f = filters();
  Object.entries(f).forEach(([k, v]) => { if(v) p.set(k, v); });
  if(activePresets.size) p.set("preset", [...activePresets].join(","));
  if(document.body.classList.contains("show-bank")) p.set("bank", "1");
  history.replaceState(null, "", p.toString() ? "?" + p.toString() : location.pathname);
}

function readUrl(){
  const p = new URLSearchParams(location.search);
  FILTER_IDS.forEach(k => { if(p.get(k)) el(k).value = p.get(k); });
  // Comma-separated, and still accepts a single id from an older shared link.
  (p.get("preset") || "").split(",").filter(Boolean).forEach(id => {
    if(PRESETS.some(x => x.id === id)) activePresets.add(id);
  });
  [...el("presets").children].forEach((c, i) =>
    c.setAttribute("aria-pressed", String(activePresets.has(PRESETS[i].id))));
  if(p.get("bank") === "1"){
    el("bankCols").checked = true;
    document.body.classList.add("show-bank");
  }
}

FILTER_IDS.forEach(id => {
  el(id).addEventListener("input", () => { syncUrl(); render(); });
});

el("bankCols").addEventListener("change", () => {
  document.body.classList.toggle("show-bank", el("bankCols").checked);
  syncUrl();
});

el("reset").addEventListener("click", () => {
  FILTER_IDS.forEach(id => el(id).value = "");
  activePresets.clear();
  [...el("presets").children].forEach(c => c.setAttribute("aria-pressed", "false"));
  el("bankCols").checked = false;
  document.body.classList.remove("show-bank");
  syncUrl();
  render();
});

el("csv").addEventListener("click", () => {
  const rows = window.__filtered || [];
  const head = COLS.map(c => c.t).join(",");
  // Quote on quote, comma or newline, doubling any embedded quote. Checking
  // only for a comma left a company name containing " able to shift every
  // later column by one.
  const body = rows.map(r => COLS.map(c => {
    const v = r[c.k];
    if(v == null) return "";
    const s = String(v);
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(",")).join("\n");
  const blob = new Blob(["﻿" + head + "\n" + body], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `leon-stocks-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
