// mark carries a direction; arrowdown is the same tool aimed the other way,
// chosen from the price at the click rather than from a separate button.
const GANN_BOX_LEVELS = [0.25, 0.382, 0.5, 0.618, 0.75];
const FIB_CHANNEL_LEVELS = [0, 0.236, 0.382, 0.5, 0.618, 0.786, 1];

// Ratios a harmonic leg is allowed to land on, and the tolerance that counts
// as "landed". Straight from the standard pattern definitions.
const HARMONIC_RATIOS = [0.382, 0.5, 0.618, 0.707, 0.786, 0.886, 1, 1.13,
                         1.272, 1.414, 1.618, 2, 2.24, 2.618, 3.14, 3.618];
function nearHarmonic(r){
  return HARMONIC_RATIOS.some(h => Math.abs(r - h) <= 0.03);
}
const GANN_ANGLES = [[1,8],[1,4],[1,3],[1,2],[1,1],[2,1],[3,1],[4,1],[8,1]];
const FIB_FAN_LEVELS = [0.382, 0.5, 0.618];
const FIB_TIME_STEPS = [1, 2, 3, 5, 8, 13, 21, 34, 55];
const TOOL_KEYS = Object.keys(TOOLS);

let drawMode = "pan";
let drawings = [];
let selectedDrawing = -1;
let pendingPoint = null;
let pendingPoints = [];   // tools that take three points collect them here
let previewPoint = null;
let dragging = null;
let brushing = null;      // freehand stroke in progress
let drawFrame = 0;
let magnetEnabled = false;
try{ magnetEnabled = localStorage.getItem("leon_chart_magnet") === "1"; }catch(e){}

function drawingKey(){ return "leon_draw_" + symbol.replace(/[^A-Z0-9_-]/g, ""); }

function validPoint(p){
  return p && Number.isFinite(+p.t) && Number.isFinite(+p.p);
}

/* Two storage shapes coexist. Tools of three points or fewer keep the original
   a/b/c fields, so drawings saved before the polygon tools existed still load.
   Anything longer stores pts[], because naming a sixth vertex `f` stops being
   readable. shapePoints() hides the difference from everything downstream. */
function shapePoints(d){
  if(Array.isArray(d.pts)) return d.pts;
  const out = [];
  [d.a, d.b, d.c].forEach(p => { if(validPoint(p)) out.push(p); });
  return out;
}

function shapeOk(d){
  const tool = d && TOOLS[d.type];
  if(!tool) return false;
  const pts = shapePoints(d);
  // A freehand stroke has no fixed vertex count, but two points is the
  // minimum that draws as a line rather than a dot.
  if(tool.need === 0) return pts.length >= 2 && pts.every(validPoint);
  if(pts.length < tool.need) return false;
  return pts.every(validPoint);
}

function loadDrawings(){
  drawings = [];
  try{
    const value = JSON.parse(localStorage.getItem(drawingKey()) || "[]");
    if(Array.isArray(value)) drawings = value.filter(shapeOk);
  }catch(e){}
  selectedDrawing = -1;
  pendingPoint = previewPoint = null;
  pendingPoints = [];
  undoStack = []; redoStack = [];
  updateDrawCount();
  applyDrawingsVisibility();
  scheduleDraw();
}

/* Undo/redo hold whole-array snapshots. The drawing list is small and the
   shapes are plain data, so a snapshot is cheaper to get right than a log of
   reversible edits. */
let undoStack = [], redoStack = [];
const UNDO_MAX = 30;

function pushUndo(snapshot = JSON.stringify(drawings)){
  undoStack.push(snapshot);
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack = [];
  syncDrawControls();
}

function restoreFrom(stack, other){
  if(!stack.length) return;
  other.push(JSON.stringify(drawings));
  try{ drawings = JSON.parse(stack.pop()).filter(shapeOk); }catch(e){ return; }
  selectedDrawing = -1;
  pendingPoint = previewPoint = null;
  pendingPoints = [];
  try{ localStorage.setItem(drawingKey(), JSON.stringify(drawings)); }catch(e){}
  updateDrawCount();
  scheduleDraw();
}

function saveDrawings(){
  try{ localStorage.setItem(drawingKey(), JSON.stringify(drawings)); }catch(e){}
  updateDrawCount();
}

function syncDrawControls(){
  el.drawUndo.disabled = undoStack.length === 0;
  el.drawRedo.disabled = redoStack.length === 0;
  el.drawMagnet.setAttribute("aria-pressed", String(magnetEnabled));
}

function updateDrawCount(){
  el.drawCount.textContent = String(drawings.length);
  syncDrawControls();
}

function applyDrawingsVisibility(){
  el.drawing.hidden = !drawingsVisible;
}

function setDrawingsVisible(visible){
  drawingsVisible = !!visible;
  try{ localStorage.setItem("leon_chart_drawings_visible", drawingsVisible ? "1" : "0"); }catch(e){}
  if(!drawingsVisible && drawMode !== "pan") setDrawMode("pan");
  applyDrawingsVisibility();
  scheduleDraw();
}

/* Time and pixels convert both ways only inside the loaded data. Past the last
   bar -- the empty space on the right where a trendline is most often aimed --
   coordinateToTime returns null, and a click there used to be dropped in
   silence. Same in reverse: pan a shape off screen and timeToCoordinate stops
   answering, so the shape vanished instead of being clipped.

   Both are fixed by extrapolating along the bar spacing, which is uniform in
   coordinate space because the chart lays bars out by index, not by clock. */
// Seconds per bar for the current timeframe. Measured from the data rather
// than parsed from the label, so a gap-free crypto series and a VN session
// with holidays both answer correctly.
function tfSeconds(){
  const b = currentBars;
  if(b.length < 2) return 60;
  // Median of the last few gaps: a single diff straddling a weekend would
  // report Monday's step as three days.
  const gaps = [];
  for(let i = Math.max(1, b.length - 12); i < b.length; i++) gaps.push(b[i].time - b[i-1].time);
  gaps.sort((x, y) => x - y);
  return gaps[Math.floor(gaps.length / 2)] || 60;
}

/* Time and pixels convert through the chart's own logical index -- the bar
   number, which the chart keeps defined past the last bar and off both edges.
   Interpolating pixels from the spacing of the final two bars (the previous
   approach) drifts as soon as the reader zooms, because that spacing is
   exactly what zooming changes; asking for the logical index instead is exact
   at any zoom. */
function timeToX(t){
  if(t == null || !isFinite(t)) return null;
  const ts = chart.timeScale();
  const direct = ts.timeToCoordinate(t);
  if(direct != null) return direct;
  const b = currentBars;
  if(!b.length) return null;
  const last = b.length - 1;
  return ts.logicalToCoordinate(last + Math.round((t - b[last].time) / tfSeconds()));
}

function xToTime(x){
  const ts = chart.timeScale();
  const t = ts.coordinateToTime(x);
  if(t != null){
    // Daily and coarser series hand back {year, month, day} instead of a
    // timestamp; both shapes have to end up as seconds.
    return (typeof t === "object" && t.year)
      ? Math.floor(Date.UTC(t.year, t.month - 1, t.day) / 1000)
      : Number(t);
  }
  const logical = ts.coordinateToLogical(x);
  const b = currentBars;
  if(logical == null || !b.length) return null;
  const last = b.length - 1;
  return b[last].time + Math.round(logical - last) * tfSeconds();
}

function nearestBar(t){
  if(!currentBars.length) return null;
  let lo = 0, hi = currentBars.length - 1;
  while(lo < hi){
    const mid = Math.floor((lo + hi) / 2);
    if(currentBars[mid].time < t) lo = mid + 1; else hi = mid;
  }
  if(lo > 0 && Math.abs(currentBars[lo - 1].time - t) < Math.abs(currentBars[lo].time - t)) lo--;
  return currentBars[lo];
}

function snapToOhlc(t, p, y){
  const bar = nearestBar(t);
  if(!bar) return {t, p};
  const step = currentBars.length > 1
    ? currentBars[currentBars.length - 1].time - currentBars[currentBars.length - 2].time : 0;
  // Do not pull a projection in the blank future area back to the last candle.
  if(step && Math.abs(t - bar.time) > step * .65) return {t, p};
  const values = [bar.open, bar.high, bar.low, bar.close].filter(Number.isFinite);
  if(!values.length) return {t, p};
  let best = values[0], bestDistance = Infinity;
  values.forEach(value => {
    const cy = candles.priceToCoordinate(value);
    const distance = cy == null ? Math.abs(value - p) : Math.abs(cy - y);
    if(distance < bestDistance){ best = value; bestDistance = distance; }
  });
  return {t:bar.time, p:best};
}

function pointFromEvent(e, allowSnap = true){
  const rect = el.drawing.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const t = xToTime(x);
  const p = candles.coordinateToPrice(y);
  if(t == null || p == null || !Number.isFinite(t) || !Number.isFinite(+p)) return null;
  const shouldSnap = allowSnap && (magnetEnabled !== !!e.ctrlKey);
  const market = shouldSnap ? snapToOhlc(t, +p, y) : {t, p:+p};
  return {t:market.t, p:market.p, x, y};
}

function pixelPoint(p){
  if(!validPoint(p)) return null;
  const x = timeToX(+p.t);
  const y = candles.priceToCoordinate(+p.p);
  return x == null || y == null ? null : {x, y};
}

function line(ctx, x1, y1, x2, y2){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

/* Renderers for the multi-point tools. Each receives pixel points, the market
   points behind them, and a few helpers. Kept in one table so the shape of a
   tool lives next to how it draws, the way the reference implementation does
   it -- adding one means adding a registry entry and a function here. */
const POLY_PAINT = {
  // Main line through the first two points; the third anchors a parallel copy,
  // and the band between them is filled.
  channel(ctx, px, mk, d, u){
    const [A, B, C] = px;
    if(!B) return;
    const slope = B.x === A.x ? 0 : (B.y - A.y) / (B.x - A.x);
    const at = (anc, x) => anc.y + slope * (x - anc.x);
    const xs = px.map(p => p.x);
    const xl = Math.min(...xs), xr = Math.max(...xs);
    line(ctx, xl, at(A, xl), xr, at(A, xr));
    if(C){
      line(ctx, xl, at(C, xl), xr, at(C, xr));
      ctx.globalAlpha = 0.10;
      ctx.beginPath();
      ctx.moveTo(xl, at(A, xl)); ctx.lineTo(xr, at(A, xr));
      ctx.lineTo(xr, at(C, xr)); ctx.lineTo(xl, at(C, xl));
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    px.forEach(p => u.dot(p, 1.5));
  },

  // Andrews pitchfork: median from the first point through the midpoint of the
  // other two, with tines parallel to it through each of them.
  pitchfork(ctx, px, mk, d, u){
    const [P, B, C] = px;
    if(!C) return;
    const M = {x:(B.x + C.x) / 2, y:(B.y + C.y) / 2};
    const dx = M.x - P.x, dy = M.y - P.y;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len, ext = 4000;
    line(ctx, B.x, B.y, C.x, C.y);
    line(ctx, P.x, P.y, M.x + ux * ext, M.y + uy * ext);
    [B, C].forEach(p => line(ctx, p.x, p.y, p.x + ux * ext, p.y + uy * ext));
    ctx.globalAlpha = 0.07;
    ctx.beginPath();
    ctx.moveTo(B.x, B.y); ctx.lineTo(B.x + ux*ext, B.y + uy*ext);
    ctx.lineTo(C.x + ux*ext, C.y + uy*ext); ctx.lineTo(C.x, C.y);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    px.forEach(p => u.dot(p, 1.5));
  },

  triangle(ctx, px, mk, d, u){
    if(px.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(px[0].x, px[0].y);
    px.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.globalAlpha = 0.12; ctx.fill(); ctx.globalAlpha = 1;
    ctx.stroke();
  },

  ellipse(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    const cx = (A.x + B.x) / 2, cy = (A.y + B.y) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, Math.abs(B.x - A.x) / 2, Math.abs(B.y - A.y) / 2, 0, 0, Math.PI * 2);
    ctx.globalAlpha = 0.10; ctx.fill(); ctx.globalAlpha = 1;
    ctx.stroke();
  },

  // Nine rays whose slopes are the classic price/time ratios. The 1x1 line is
  // the reference; the others fan out from it in both directions.
  gannfan(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    const unitX = B.x - A.x, unitY = B.y - A.y;
    if(!unitX || !unitY) return;
    ctx.font = u.small;
    GANN_ANGLES.forEach(([rise, run]) => {
      const k = (rise / run);
      const ex = A.x + unitX * 6, ey = A.y + unitY * 6 * k;
      line(ctx, A.x, A.y, ex, ey);
    });
    u.dot(A, 2); u.dot(B, 2);
  },

  // Least-squares fit over the bars between the two clicks, with a band at one
  // standard deviation of the residuals -- the usual regression channel.
  linreg(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    const t0 = Math.min(mk[0].t, mk[1].t), t1 = Math.max(mk[0].t, mk[1].t);
    const inside = currentBars.filter(bar => bar.time >= t0 && bar.time <= t1);
    if(inside.length < 3){ line(ctx, A.x, A.y, B.x, B.y); return; }
    const n = inside.length;
    let sx = 0, sy = 0, sxy = 0, sxx = 0;
    inside.forEach((bar, i) => {
      sx += i; sy += bar.close; sxy += i * bar.close; sxx += i * i;
    });
    const denom = n * sxx - sx * sx;
    if(!denom){ line(ctx, A.x, A.y, B.x, B.y); return; }
    const slope = (n * sxy - sx * sy) / denom;
    const intercept = (sy - slope * sx) / n;
    const resid = inside.map((bar, i) => bar.close - (intercept + slope * i));
    const sd = Math.sqrt(resid.reduce((acc, r) => acc + r * r, 0) / n);
    const ptAt = (i, off) => {
      const x = timeToX(inside[i].time);
      const y = candles.priceToCoordinate(intercept + slope * i + off);
      return (x == null || y == null) ? null : {x, y};
    };
    [0, sd, -sd].forEach((off, idx) => {
      const p0 = ptAt(0, off), p1 = ptAt(n - 1, off);
      if(!p0 || !p1) return;
      ctx.save();
      if(idx) ctx.setLineDash([4, 3]);
      line(ctx, p0.x, p0.y, p1.x, p1.y);
      ctx.restore();
    });
  },

  // Rays from the first point through the Fibonacci fractions of the move.
  fibfan(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    ctx.font = u.small;
    FIB_FAN_LEVELS.forEach(level => {
      const y = A.y + (B.y - A.y) * level;
      const dx = (B.x - A.x) * 4, dy = (y - A.y) * 4;
      line(ctx, A.x, A.y, A.x + dx, A.y + dy);
      ctx.fillText(`${(level * 100).toFixed(1)}%`, B.x + 3, y);
    });
    line(ctx, A.x, A.y, B.x, B.y);
  },

  // Vertical lines at Fibonacci multiples of the span between the two clicks.
  fibtime(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    const step = mk[1].t - mk[0].t;
    if(!step) return;
    ctx.font = u.small;
    FIB_TIME_STEPS.forEach(mult => {
      const x = timeToX(mk[0].t + step * mult);
      if(x == null || x < -50 || x > u.w + 50) return;
      line(ctx, x, 0, x, u.h);
      ctx.fillText(String(mult), x + 3, 12);
    });
  },

  // Labelled polylines. Harmonic patterns additionally print each leg's
  // retracement and mark it when it lands on a recognised ratio.
  polyline(ctx, px, mk, d, u){
    const tool = TOOLS[d.type];
    ctx.beginPath();
    ctx.moveTo(px[0].x, px[0].y);
    px.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.font = u.small;
    px.forEach((p, i) => {
      u.dot(p, 2.5);
      const label = tool.labels && tool.labels[i];
      if(label) ctx.fillText(label, p.x + 5, p.y - 5);
    });
    if(tool.ratios && mk.length >= 3){
      for(let i = 2; i < mk.length; i++){
        const prev = Math.abs(mk[i-1].p - mk[i-2].p);
        if(!prev) continue;
        const ratio = Math.abs(mk[i].p - mk[i-1].p) / prev;
        const mx = (px[i].x + px[i-1].x) / 2, my = (px[i].y + px[i-1].y) / 2;
        ctx.save();
        ctx.fillStyle = nearHarmonic(ratio) ? css("--up") : css("--muted");
        ctx.fillText(ratio.toFixed(3), mx + 4, my);
        ctx.restore();
      }
    }
    if(d.type === "hns" && px.length >= 5){
      // Neckline through the two troughs, extended right: the level whose
      // break is what the pattern is watched for.
      const l = px[1], r = px[3];
      if(l && r && l.x !== r.x){
        const slope = (r.y - l.y) / (r.x - l.x);
        ctx.save(); ctx.setLineDash([5, 4]);
        line(ctx, l.x, l.y, u.w, l.y + slope * (u.w - l.x));
        ctx.restore();
      }
    }
  },

  arrow(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    line(ctx, A.x, A.y, B.x, B.y);
    const ang = Math.atan2(B.y - A.y, B.x - A.x), head = 10;
    ctx.save(); ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(B.x, B.y);
    ctx.lineTo(B.x - head * Math.cos(ang - Math.PI/7), B.y - head * Math.sin(ang - Math.PI/7));
    ctx.lineTo(B.x - head * Math.cos(ang + Math.PI/7), B.y - head * Math.sin(ang + Math.PI/7));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  },

  crossline(ctx, px, mk, d, u){
    const A = px[0];
    line(ctx, 0, A.y, u.w, A.y);
    line(ctx, A.x, 0, A.x, u.h);
    ctx.font = u.small;
    ctx.fillText(u.price(mk[0].p), 6, A.y - 4);
  },

  // A trendline that reads itself out: angle on screen, price move, percent,
  // and how many bars it spans.
  infoline(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    line(ctx, A.x, A.y, B.x, B.y);
    const dp = mk[1].p - mk[0].p;
    const pct = mk[0].p ? dp / mk[0].p * 100 : 0;
    const lo = Math.min(mk[0].t, mk[1].t), hi = Math.max(mk[0].t, mk[1].t);
    const bars = currentBars.filter(bar => bar.time >= lo && bar.time <= hi).length;
    // Screen angle, so it answers "how steep does this look" rather than a
    // price-per-second figure nobody reads.
    const ang = Math.atan2(-(B.y - A.y), B.x - A.x) * 180 / Math.PI;
    const label = `${ang.toFixed(1)}° · ${dp >= 0 ? "+" : ""}${u.price(dp)}` +
                  ` (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%) · ${bars} nến`;
    ctx.save(); ctx.setLineDash([]);
    ctx.font = "11px -apple-system,Segoe UI,sans-serif";
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = css("--panel"); ctx.globalAlpha = 0.85;
    ctx.fillRect(mx - tw/2 - 4, my - 9, tw + 8, 18);
    ctx.globalAlpha = 1; ctx.fillStyle = u.active ? css("--accent") : u.base;
    ctx.fillText(label, mx - tw/2, my + 4);
    ctx.restore();
  },

  callout(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    line(ctx, A.x, A.y, B.x, B.y);
    ctx.save(); ctx.setLineDash([]);
    ctx.font = "11px -apple-system,Segoe UI,sans-serif";
    const text = d.text || "";
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = css("--panel"); ctx.globalAlpha = 0.9;
    ctx.fillRect(B.x, B.y - 11, tw + 10, 22);
    ctx.globalAlpha = 1;
    ctx.strokeRect(B.x, B.y - 11, tw + 10, 22);
    ctx.fillStyle = u.active ? css("--accent") : u.base;
    ctx.fillText(text, B.x + 5, B.y + 4);
    ctx.restore();
    u.dot(A, 2.5);
  },

  brush(ctx, px, mk, d, u){
    if(px.length < 2) { if(px.length) u.dot(px[0], 2); return; }
    ctx.save(); ctx.setLineDash([]);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(px[0].x, px[0].y);
    px.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    ctx.restore();
  },

  // VWAP restarted at the anchor rather than at the session boundary: it
  // answers "what has the average buyer paid since this event".
  avwap(ctx, px, mk, d, u){
    const anchor = mk[0].t;
    let pv = 0, vol = 0;
    const pts = [];
    for(const bar of currentBars){
      if(bar.time < anchor) continue;
      const typical = (bar.high + bar.low + bar.close) / 3;
      const v = bar.volume || 0;
      if(v > 0){ pv += typical * v; vol += v; }
      else { pv += typical; vol += 1; }
      const x = timeToX(bar.time), y = candles.priceToCoordinate(pv / vol);
      if(x != null && y != null) pts.push({x, y});
    }
    if(pts.length < 2){ u.dot(px[0], 3); return; }
    ctx.save(); ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    u.dot(pts[0], 3);
    ctx.font = u.small;
    const last = pts[pts.length - 1];
    ctx.fillText("aVWAP", last.x - 42, last.y - 4);
    ctx.restore();
  },

  // Volume by price over the selected span. Each bar's volume is dropped into
  // the row its close falls in -- an approximation of the true distribution,
  // which would need tick data, and the one every charting package draws.
  vprofile(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    const xl = Math.min(A.x, B.x), xr = Math.max(A.x, B.x);
    ctx.save();
    ctx.setLineDash([4, 3]); ctx.globalAlpha = 0.45;
    line(ctx, xl, 0, xl, u.h); line(ctx, xr, 0, xr, u.h);
    ctx.restore();

    const t0 = Math.min(mk[0].t, mk[1].t), t1 = Math.max(mk[0].t, mk[1].t);
    const inside = currentBars.filter(bar => bar.time >= t0 && bar.time <= t1);
    if(inside.length < 2) return;
    const lo = Math.min(...inside.map(b => b.low));
    const hi = Math.max(...inside.map(b => b.high));
    if(hi <= lo) return;
    const rows = 24, rowH = (hi - lo) / rows;
    const sums = new Array(rows).fill(0);
    inside.forEach(bar => {
      const idx = Math.min(rows - 1, Math.max(0, Math.floor((bar.close - lo) / rowH)));
      sums[idx] += bar.volume || 0;
    });
    const peak = Math.max(...sums);
    if(!peak) return;
    const span = (xr - xl) * 0.9;
    ctx.save(); ctx.setLineDash([]);
    let pocIdx = 0;
    sums.forEach((v, i) => { if(v > sums[pocIdx]) pocIdx = i; });
    sums.forEach((v, i) => {
      if(!v) return;
      const yTop = candles.priceToCoordinate(lo + (i + 1) * rowH);
      const yBot = candles.priceToCoordinate(lo + i * rowH);
      if(yTop == null || yBot == null) return;
      ctx.globalAlpha = i === pocIdx ? 0.55 : 0.28;
      ctx.fillRect(xl, yTop, span * (v / peak), Math.max(1, yBot - yTop));
    });
    ctx.globalAlpha = 1;
    // Point of control: the price that traded most in the window.
    const pocY = candles.priceToCoordinate(lo + (pocIdx + 0.5) * rowH);
    if(pocY != null){
      ctx.strokeStyle = css("--warn");
      line(ctx, xl, pocY, xr, pocY);
      ctx.font = u.small;
      ctx.fillStyle = css("--warn");
      ctx.fillText("POC", xr + 3, pocY + 3);
    }
    ctx.restore();
  },

  gannbox(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    const x = Math.min(A.x, B.x), y = Math.min(A.y, B.y);
    const w = Math.abs(B.x - A.x), h = Math.abs(B.y - A.y);
    ctx.strokeRect(x, y, w, h);
    ctx.save();
    ctx.globalAlpha = 0.4; ctx.setLineDash([3, 3]);
    GANN_BOX_LEVELS.forEach(level => {
      line(ctx, x, y + h * level, x + w, y + h * level);
      line(ctx, x + w * level, y, x + w * level, y + h);
    });
    ctx.setLineDash([]); ctx.globalAlpha = 0.6;
    line(ctx, x, y, x + w, y + h);
    line(ctx, x, y + h, x + w, y);
    ctx.restore();
    u.dot(A, 1.5); u.dot(B, 1.5);
  },

  // Fibonacci levels drawn between a base line and a parallel through the
  // third point, so the retracements tilt with the trend instead of lying flat.
  fibchannel(ctx, px, mk, d, u){
    const [A, B, C] = px;
    if(!C) return;
    const slope = B.x === A.x ? 0 : (B.y - A.y) / (B.x - A.x);
    const at = (anc, x) => anc.y + slope * (x - anc.x);
    const xs = px.map(p => p.x);
    const xl = Math.min(...xs), xr = Math.max(...xs);
    ctx.font = u.small;
    FIB_CHANNEL_LEVELS.forEach(level => {
      const yl = at(A, xl) + (at(C, xl) - at(A, xl)) * level;
      const yr = at(A, xr) + (at(C, xr) - at(A, xr)) * level;
      ctx.save();
      if(level !== 0 && level !== 1) ctx.globalAlpha = 0.7;
      line(ctx, xl, yl, xr, yr);
      ctx.restore();
      ctx.fillText(`${(level * 100).toFixed(1)}%`, xl + 3, yl - 3);
    });
    px.forEach(p => u.dot(p, 1.5));
  },

  // Entry with a target above and a stop below (inverted for a short), drawn
  // as two tinted boxes so the risk and reward are compared by area.
  position(ctx, px, mk, d, u){
    const [A, B] = px;
    if(!B) return;
    const isLong = d.type === "long";
    const entryY = candles.priceToCoordinate(d.entry);
    const tpY = candles.priceToCoordinate(d.tp);
    const slY = candles.priceToCoordinate(d.sl);
    if(entryY == null || tpY == null || slY == null) return;
    const x0 = Math.min(A.x, B.x), x1 = Math.max(A.x, B.x);
    const box = (yA, yB, colour) => {
      ctx.save();
      ctx.fillStyle = colour; ctx.globalAlpha = 0.14;
      ctx.fillRect(x0, Math.min(yA, yB), x1 - x0, Math.abs(yB - yA));
      ctx.restore();
    };
    box(entryY, tpY, css("--up"));
    box(entryY, slY, css("--down"));
    ctx.save(); ctx.setLineDash([]);
    ctx.strokeStyle = css("--muted");
    line(ctx, x0, entryY, x1, entryY);
    ctx.restore();
    const risk = Math.abs(d.entry - d.sl);
    const reward = Math.abs(d.tp - d.entry);
    ctx.font = u.small;
    ctx.fillText(`${isLong ? "Mua" : "Bán"} · R:R ${risk ? (reward/risk).toFixed(2) : "—"}`,
      x0 + 4, Math.min(tpY, slY) - 4);
  },
};
POLY_PAINT.abcd = POLY_PAINT.polyline;
POLY_PAINT.xabcd = POLY_PAINT.polyline;
POLY_PAINT.elliott = POLY_PAINT.polyline;
POLY_PAINT.elliottabc = POLY_PAINT.polyline;
POLY_PAINT.hns = POLY_PAINT.polyline;
POLY_PAINT.long = POLY_PAINT.position;
POLY_PAINT.short = POLY_PAINT.position;

function paintDrawing(d, index, ctx, w, h){
  const tool = TOOLS[d.type];
  if(!tool) return;
  const market = shapePoints(d);
  const px = market.map(pixelPoint);
  if(!px.length || px.some(p => !p)) return;
  const a = px[0], b = px[1] || null;
  const active = index === selectedDrawing;
  // Tools that carry their own colour keep it, so a pitchfork and a channel
  // stay distinguishable when several are on the chart at once.
  const base = tool.color || css("--warn");
  ctx.strokeStyle = active ? css("--accent") : base;
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = active ? 2 : 1.35;
  ctx.setLineDash(active ? [] : [5, 3]);

  const price = v => nf(v, v < 1 ? 6 : 2);
  const small = "10px -apple-system,Segoe UI,sans-serif";
  const dot = (p, r = 2) => { ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill(); };

  if(POLY_PAINT[d.type]){
    POLY_PAINT[d.type](ctx, px, market, d, {w, h, price, small, dot, base, active});
    ctx.setLineDash([]);
    if(active) px.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
      ctx.fillStyle = css("--bg"); ctx.fill(); ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle;
    });
    return;
  }

  if(d.type === "hline"){
    line(ctx, 0, a.y, w, a.y);
    ctx.font = "11px -apple-system,Segoe UI,sans-serif";
    ctx.fillText(price(d.a.p), 8, Math.max(12, a.y - 5));
  }else if(d.type === "hray"){
    // Anchored at a, extended right at a's price: a level that only applies
    // from the moment it was set, unlike hline which claims all of history.
    line(ctx, a.x, a.y, w, a.y);
    ctx.font = small;
    ctx.fillText(price(d.a.p), Math.min(a.x + 6, w - 60), a.y - 4);
  }else if(d.type === "trend"){
    line(ctx, a.x, a.y, b.x, b.y);
  }else if(d.type === "vline"){
    line(ctx, a.x, 0, a.x, h);
  }else if(d.type === "rect"){
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const rw = Math.abs(b.x - a.x), rh = Math.abs(b.y - a.y);
    ctx.globalAlpha = 0.12; ctx.fillRect(x, y, rw, rh); ctx.globalAlpha = 1;
    ctx.strokeRect(x, y, rw, rh);
  }else if(d.type === "mark"){
    const up = d.dir !== "down", s = 7;
    ctx.beginPath();
    if(up){ ctx.moveTo(a.x, a.y - s); ctx.lineTo(a.x - s, a.y + s); ctx.lineTo(a.x + s, a.y + s); }
    else  { ctx.moveTo(a.x, a.y + s); ctx.lineTo(a.x - s, a.y - s); ctx.lineTo(a.x + s, a.y - s); }
    ctx.closePath(); ctx.fill();
  }else if(d.type === "text"){
    ctx.font = "12px -apple-system,Segoe UI,sans-serif";
    ctx.fillText(d.text || "", a.x + 4, a.y - 4);
  }else if(d.type === "range"){
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const rw = Math.abs(b.x - a.x), rh = Math.abs(b.y - a.y);
    ctx.globalAlpha = 0.1; ctx.fillRect(x, y, rw, rh); ctx.globalAlpha = 1;
    ctx.strokeRect(x, y, rw, rh);
    const dp = d.b.p - d.a.p;
    const pct = d.a.p ? (dp / d.a.p) * 100 : 0;
    // Bars, not clock time: on a chart with gaps the reader is counting
    // candles, and a weekend would otherwise inflate the answer.
    const step = currentBars.length > 1
      ? (currentBars[currentBars.length-1].time - currentBars[0].time) / (currentBars.length-1)
      : 0;
    const bars = step ? Math.round(Math.abs(d.b.t - d.a.t) / step) : 0;
    ctx.font = small;
    ctx.fillText(`${dp >= 0 ? "+" : ""}${price(dp)}  ${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%  ${bars} nến`,
      x + 4, y - 4);
  }else if(d.type === "fib" || d.type === "fibext"){
    ctx.font = small;
    const ext = d.type === "fibext";
    // Retracement measures a→b. Extension projects that leg forward from c,
    // which is what the third point is for.
    const base = ext ? d.c.p : d.a.p;
    const span = ext ? (d.b.p - d.a.p) : (d.b.p - d.a.p);
    const levels = ext ? FIB_EXT_LEVELS : FIB_LEVELS;
    const xs = [a.x, b.x].concat(ext && d.c ? [pixelPoint(d.c)?.x ?? a.x] : []);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    levels.forEach(level => {
      const y = candles.priceToCoordinate(base + span * level);
      if(y == null) return;
      line(ctx, x0, y, x1, y);
      ctx.fillText(`${(level * 100).toFixed(level % 1 === 0 ? 0 : 1)}%`, x0 + 4, y - 3);
    });
  }

  if(active){
    ctx.setLineDash([]);
    [a, b, d.c ? pixelPoint(d.c) : null].forEach(pt => {
      if(!pt) return;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = css("--bg"); ctx.fill(); ctx.stroke();
    });
  }
  ctx.setLineDash([]);
}

function syncDrawingPaneHeight(){
  let height = 0;
  try{ height = chart.panes()[0].getHeight(); }catch(e){}
  if(height > 0 && el.drawing.style.height !== `${height}px`)
    el.drawing.style.height = `${height}px`;
}

function redraw(){
  drawFrame = 0;
  if(!drawingsVisible) return;
  // The canvas only covers the price pane. Oscillator panes remain interactive
  // while a drawing tool is active, and candle price coordinates stay aligned.
  syncDrawingPaneHeight();
  const rect = el.drawing.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const pxW = Math.round(rect.width * dpr), pxH = Math.round(rect.height * dpr);
  if(el.drawing.width !== pxW || el.drawing.height !== pxH){
    el.drawing.width = pxW; el.drawing.height = pxH;
  }
  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCtx.clearRect(0, 0, rect.width, rect.height);
  drawings.forEach((d, i) => paintDrawing(d, i, drawCtx, rect.width, rect.height));
  // Preview the shape mid-placement. Index -2 never matches selectedDrawing,
  // so it draws in the unselected style without claiming to be a real shape.
  if(pendingPoints.length && previewPoint){
    const pts = pendingPoints.concat([previewPoint]);
    const tool = TOOLS[drawMode];
    const ghost = tool && tool.need > 3
      ? {type:drawMode, pts}
      : {type:drawMode, a:pts[0], b:pts[1] || previewPoint};
    if(tool && tool.need === 3 && pts[2]) ghost.c = pts[2];
    if(drawMode === "long" || drawMode === "short"){
      ghost.entry = pts[0].p;
      ghost.tp = (pts[1] || previewPoint).p;
      ghost.sl = ghost.entry - (ghost.tp - ghost.entry);
    }
    // Partial polylines are legitimate to preview even though shapeOk would
    // reject them for having too few vertices.
    const previewOk = tool && tool.need > 3
      ? pts.length >= 2 && pts.every(validPoint)
      : shapeOk(ghost);
    if(previewOk) paintDrawing(ghost, -2, drawCtx, rect.width, rect.height);
  }
}

function scheduleDraw(){
  if(!drawFrame) drawFrame = requestAnimationFrame(redraw);
}

function segmentDistance(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  if(dx === 0 && dy === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  const t = Math.max(0, Math.min(1, ((p.x-a.x)*dx + (p.y-a.y)*dy) / (dx*dx + dy*dy)));
  return Math.hypot(p.x - (a.x+t*dx), p.y - (a.y+t*dy));
}

function hitDrawing(p){
  const near = 6;
  // Newest first: shapes drawn later sit on top, so they answer the click.
  for(let i = drawings.length - 1; i >= 0; i--){
    const d = drawings[i];
    const t = d.type;

    // Multi-point shapes are hit through their outline: close enough to any
    // segment between consecutive vertices, or to a vertex itself. Exact
    // per-tool geometry (a pitchfork's tines, a fan's rays) is not worth the
    // code -- the reader is aiming at the shape, not at one of its rays.
    if(POLY_PAINT[t]){
      const pts = shapePoints(d).map(pixelPoint);
      if(pts.some(q => !q)) continue;
      if(pts.some(q => Math.hypot(p.x - q.x, p.y - q.y) <= near + 2)) return i;
      let hit = false;
      for(let k = 1; k < pts.length && !hit; k++){
        if(segmentDistance(p, pts[k-1], pts[k]) <= near) hit = true;
      }
      // Position tools are boxes, so anywhere inside counts.
      if(!hit && (t === "long" || t === "short")){
        const ys = [d.entry, d.tp, d.sl].map(v => candles.priceToCoordinate(v));
        if(ys.every(y => y != null)){
          const xs = pts.map(q => q.x);
          if(p.x >= Math.min(...xs) - near && p.x <= Math.max(...xs) + near &&
             p.y >= Math.min(...ys) - near && p.y <= Math.max(...ys) + near) hit = true;
        }
      }
      if(hit) return i;
      continue;
    }

    const a = pixelPoint(d.a), b = d.b ? pixelPoint(d.b) : null;
    if(!a) continue;

    if(t === "hline" && Math.abs(p.y - a.y) <= near) return i;
    if(t === "hray" && Math.abs(p.y - a.y) <= near && p.x >= a.x - near) return i;
    if(t === "vline" && Math.abs(p.x - a.x) <= near) return i;
    if((t === "mark" || t === "text") &&
       Math.hypot(p.x - a.x, p.y - a.y) <= 10) return i;
    if(t === "trend" && b && segmentDistance(p, a, b) <= near) return i;

    if((t === "rect" || t === "range") && b){
      const x0 = Math.min(a.x,b.x)-near, x1 = Math.max(a.x,b.x)+near;
      const y0 = Math.min(a.y,b.y)-near, y1 = Math.max(a.y,b.y)+near;
      // Edges only, so a box does not swallow clicks meant for what it frames.
      if(p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1){
        const inner = p.x > x0+2*near && p.x < x1-2*near &&
                      p.y > y0+2*near && p.y < y1-2*near;
        if(!inner) return i;
      }
    }

    if((t === "fib" || t === "fibext") && b){
      const ext = t === "fibext";
      const cx = ext && d.c ? (pixelPoint(d.c)?.x ?? a.x) : a.x;
      const x0 = Math.min(a.x,b.x,cx)-near, x1 = Math.max(a.x,b.x,cx)+near;
      if(p.x < x0 || p.x > x1) continue;
      const base = ext ? d.c.p : d.a.p, span = d.b.p - d.a.p;
      const hit = (ext ? FIB_EXT_LEVELS : FIB_LEVELS).some(level => {
        const y = candles.priceToCoordinate(base + span*level);
        return y != null && Math.abs(p.y-y) <= near;
      });
      if(hit) return i;
    }
  }
  return -1;
}

function hitSelectedHandle(p){
  if(selectedDrawing < 0 || !drawings[selectedDrawing]) return null;
  const d = drawings[selectedDrawing];
  for(const key of ["a", "b", "c"]){
    if(!d[key]) continue;
    const pt = pixelPoint(d[key]);
    if(pt && Math.hypot(p.x - pt.x, p.y - pt.y) <= 9) return key;
  }
  return null;
}

function setDrawMode(mode){
  if(mode !== "pan" && !drawingsVisible){
    drawingsVisible = true;
    try{ localStorage.setItem("leon_chart_drawings_visible", "1"); }catch(e){}
    applyDrawingsVisibility();
  }
  drawMode = mode;
  pendingPoint = previewPoint = null;
  pendingPoints = [];
  dragging = null;
  [...el.drawTools.querySelectorAll("[data-tool]")].forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.tool === mode)));
  el.drawing.classList.toggle("active", mode !== "pan");
  el.drawing.classList.toggle("selecting", mode === "select");
  if(mode !== "select") selectedDrawing = -1;
  scheduleDraw();
}

// Insert the generated tool buttons before undo, so the row reads
// pan · select · [tools] · undo · redo · clear.
(function buildToolButtons(){
  const anchor = document.getElementById("draw-undo");
  TOOL_KEYS.forEach(key => {
    const t = TOOLS[key];
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.tool = key;
    b.setAttribute("aria-pressed", "false");
    b.title = `${t.title} · Vẽ liên tục; bấm lại, chuột phải hoặc Esc để thoát`;
    b.textContent = t.label;
    el.drawTools.insertBefore(b, anchor);
  });
})();

el.drawTools.addEventListener("click", e => {
  const button = e.target.closest("[data-tool]");
  if(button) setDrawMode(button.dataset.tool === drawMode && drawMode !== "pan"
    ? "pan" : button.dataset.tool);
});

el.drawUndo.addEventListener("click", () => restoreFrom(undoStack, redoStack));
el.drawRedo.addEventListener("click", () => restoreFrom(redoStack, undoStack));
el.drawMagnet.addEventListener("click", () => {
  magnetEnabled = !magnetEnabled;
  try{ localStorage.setItem("leon_chart_magnet", magnetEnabled ? "1" : "0"); }catch(e){}
  syncDrawControls();
});

el.drawClear.addEventListener("click", () => {
  if(!drawings.length) return;
  pushUndo();
  drawings = [];
  selectedDrawing = -1;
  pendingPoint = previewPoint = null;
  pendingPoints = [];
  saveDrawings();
  scheduleDraw();
});

el.drawing.addEventListener("pointerdown", e => {
  if(e.button !== 0) return;
  const p = pointFromEvent(e, drawMode !== "select");
  if(!p) return;
  el.drawing.focus({preventScroll:true});
  e.preventDefault();

  if(drawMode === "select"){
    const handle = hitSelectedHandle(p);
    if(!handle) selectedDrawing = hitDrawing(p);
    if(selectedDrawing >= 0){
      const original = drawings[selectedDrawing];
      dragging = {
        start:p, index:selectedDrawing, handle,
        original:JSON.parse(JSON.stringify(original)),
        snapshot:JSON.stringify(drawings), dirty:false,
      };
      el.drawing.setPointerCapture(e.pointerId);
    }
    scheduleDraw();
    return;
  }
  const tool = TOOLS[drawMode];
  if(!tool) return;
  const here = {t:p.t, p:p.p};

  // Freehand is the one tool with no vertex count: the stroke starts on press
  // and is collected on move until release.
  if(tool.need === 0){
    pushUndo();
    brushing = {type:drawMode, pts:[here]};
    drawings.push(brushing);
    el.drawing.setPointerCapture(e.pointerId);
    scheduleDraw();
    return;
  }

  if(tool.need === 1){
    pushUndo();
    const shape = {type:drawMode, a:here};
    if(drawMode === "text"){
      const note = (prompt("Ghi chú:", "") || "").trim().slice(0, 80);
      if(!note){ undoStack.pop(); syncDrawControls(); setDrawMode("pan"); return; }
      shape.text = note;
    }
    if(drawMode === "mark"){
      // Above the click points down at the bar, below points up at it.
      const mid = candles.coordinateToPrice(el.drawing.clientHeight / 2);
      shape.dir = mid != null && p.p > +mid ? "down" : "up";
    }
    drawings.push(shape);
    saveDrawings();
    scheduleDraw();
    return;
  }

  pendingPoints.push(here);
  previewPoint = here;
  pendingPoint = pendingPoints[0];
  if(pendingPoints.length >= tool.need){
    pushUndo();
    const shape = tool.need > 3
      ? {type:drawMode, pts:pendingPoints.slice(0, tool.need)}
      : {type:drawMode, a:pendingPoints[0], b:pendingPoints[1]};
    if(tool.need === 3) shape.c = pendingPoints[2];
    if(drawMode === "long" || drawMode === "short"){
      // Entry is where the reader clicked first; the second click sets the
      // target, and the stop mirrors it so the box opens at 1:1 and can be
      // dragged from there.
      const entry = pendingPoints[0].p, target = pendingPoints[1].p;
      shape.entry = entry; shape.tp = target; shape.sl = entry - (target - entry);
    }
    if(drawMode === "callout"){
      const note = (prompt("Chú thích:", "") || "").trim().slice(0, 80);
      if(!note){
        undoStack.pop();
        pendingPoints = []; pendingPoint = previewPoint = null;
        scheduleDraw();
        return;
      }
      shape.text = note;
    }
    drawings.push(shape);
    pendingPoints = [];
    pendingPoint = previewPoint = null;
    saveDrawings();
  }
  scheduleDraw();
});

el.drawing.addEventListener("pointermove", e => {
  const p = pointFromEvent(e, !!(dragging && dragging.handle) || pendingPoints.length > 0);
  if(!p) return;
  if(brushing){
    // Thin the stroke as it is collected: a pointermove per pixel would store
    // thousands of points for one gesture and redraw them on every pan.
    const last = brushing.pts[brushing.pts.length - 1];
    const lastPx = pixelPoint(last);
    if(!lastPx || Math.hypot(p.x - lastPx.x, p.y - lastPx.y) >= 3){
      brushing.pts.push({t:p.t, p:p.p});
      scheduleDraw();
    }
    return;
  }
  if(dragging && selectedDrawing === dragging.index){
    const moved = JSON.parse(JSON.stringify(dragging.original));
    if(dragging.handle){
      moved[dragging.handle] = {t:p.t, p:p.p};
    }else{
      const dt = p.t - dragging.start.t, dp = p.p - dragging.start.p;
      if(Array.isArray(moved.pts)){
        moved.pts.forEach(q => { q.t += dt; q.p += dp; });
      }else{
        moved.a.t += dt; moved.a.p += dp;
        if(moved.b){ moved.b.t += dt; moved.b.p += dp; }
        if(moved.c){ moved.c.t += dt; moved.c.p += dp; }
      }
      // Position tools carry prices outside the point list; they have to move
      // with it or the box detaches from its own handles.
      if(moved.entry != null){ moved.entry += dp; moved.tp += dp; moved.sl += dp; }
    }
    if(!dragging.dirty){
      pushUndo(dragging.snapshot);
      dragging.dirty = true;
    }
    drawings[selectedDrawing] = moved;
    scheduleDraw();
  }else if(pendingPoints.length){
    previewPoint = {t:p.t, p:p.p};
    scheduleDraw();
  }else if(drawMode === "select"){
    el.drawing.style.cursor = hitSelectedHandle(p) ? "crosshair" :
      (hitDrawing(p) >= 0 ? "move" : "default");
  }
});

function finishDrag(e){
  if(brushing){
    try{ el.drawing.releasePointerCapture(e.pointerId); }catch(err){}
    // A press with no movement leaves a single point, which is not a stroke.
    if(brushing.pts.length < 2){
      const i = drawings.indexOf(brushing);
      if(i >= 0) drawings.splice(i, 1);
      undoStack.pop();
    }
    brushing = null;
    saveDrawings();
    scheduleDraw();
    return;
  }
  if(!dragging) return;
  try{ el.drawing.releasePointerCapture(e.pointerId); }catch(err){}
  const changed = dragging.dirty;
  dragging = null;
  if(changed) saveDrawings();
}
el.drawing.addEventListener("pointerup", finishDrag);
el.drawing.addEventListener("pointercancel", finishDrag);

document.addEventListener("keydown", e => {
  const tag = e.target && e.target.tagName;
  const editing = tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA" ||
    (e.target && e.target.isContentEditable);
  if(editing) return;
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === "z" && !e.shiftKey){
    restoreFrom(undoStack, redoStack); e.preventDefault();
  }else if(mod && (e.key.toLowerCase() === "y" ||
                   (e.shiftKey && e.key.toLowerCase() === "z"))){
    restoreFrom(redoStack, undoStack); e.preventDefault();
  }else if((e.key === "Delete" || e.key === "Backspace") && selectedDrawing >= 0){
    pushUndo();
    drawings.splice(selectedDrawing, 1);
    selectedDrawing = -1;
    saveDrawings(); scheduleDraw(); e.preventDefault();
  }else if(e.key === "Escape"){
    closeChartMenu();
    if(el.alertDialog.open) el.alertDialog.close();
    setDrawMode("pan");
  }
});

/* ---------- paging older history ----------
   The first fetch is the most recent LIMIT bars, which on the 5m chart is under
   two days. Scrolling left used to simply run out. Now nearing the left edge
   pulls the previous page and prepends it, so the reader can keep going back
   until the exchange has nothing older. */
async function loadOlderHistory(){
  if(loadingHistory || historyExhausted || oldestTime == null) return;
  if(!currentBars.length) return;
  loadingHistory = true;
  const token = inflight;
  try{
    // endTime is inclusive, so step back one second to avoid refetching the
    // bar already held at the left edge.
    const endMs = (oldestTime - 1) * 1000;
    const older = currentSource === "Hyperliquid"
      ? await fromHyperliquid(symbol, timeframe, endMs)
      : await fromBinance(symbol, timeframe, endMs);

    if(token !== inflight) return;          // symbol or timeframe changed mid-flight
    const fresh = older.filter(b => b.time < oldestTime);
    if(!fresh.length){ historyExhausted = true; return; }

    currentBars = fresh.concat(currentBars);
    if(currentBars.length > MAX_BARS) currentBars = currentBars.slice(-MAX_BARS);
    oldestTime = currentBars[0].time;

    // setData, not update: prepending rewrites the start of the series, and
    // the viewport stays where the reader put it because no fitContent runs.
    candles.setData(currentBars);
    volume.setData(currentBars.map(volumeBar));
    applyMA(currentBars);
    scheduleDraw();
  }catch(e){
    // A failed page is not fatal; the reader keeps the bars already loaded.
    historyExhausted = true;
  }finally{
    loadingHistory = false;
  }
}

chart.timeScale().subscribeVisibleTimeRangeChange(scheduleDraw);
chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
  // `from` counts bars from the left edge of the data, going negative once the
  // viewport scrolls past it. Ten bars of slack starts the fetch before the
  // reader reaches actual blank space.
  if(range && range.from < 10) loadOlderHistory();
});
const drawResizeObserver = new ResizeObserver(scheduleDraw);
drawResizeObserver.observe(el.drawing.parentElement);

if(pricePaneElement) drawResizeObserver.observe(pricePaneElement);

/* ---------- indicator panel ---------- */
const indEl = {
  open:  document.getElementById("ind-open"),
  count: document.getElementById("ind-count"),
  panel: document.getElementById("ind-panel"),
  type:  document.getElementById("ind-type"),
  params:document.getElementById("ind-params"),
  color: document.getElementById("ind-color"),
  add:   document.getElementById("ind-add"),
  reset: document.getElementById("ind-reset"),
  close: document.getElementById("ind-close"),
  status:document.getElementById("ind-status"),
  list:  document.getElementById("ind-list"),
};

INDICATOR_KEYS.forEach(key => {
  const o = document.createElement("option");
  o.value = key;
  o.textContent = INDICATORS[key].name;
  indEl.type.appendChild(o);
});

function indicatorLabel(inst){
  const def = INDICATORS[inst.type];
  const p = inst.params;
  if(inst.type === "macd") return `${def.name} ${p.fast}/${p.slow}/${p.signal}`;
  if(inst.type === "ichimoku") return `${def.name} ${p.tenkan}/${p.kijun}/${p.senkou}`;
  if(inst.type === "stoch") return `${def.name} ${p.period}/${p.smoothK}/${p.smoothD}`;
  if("mult" in p) return `${def.name} ${p.period} ×${p.mult}`;
  if("period" in p) return `${def.name} ${p.period}`;
  return def.name;
}

function indicatorColor(inst){
  return validIndicatorColor(inst.color) || INDICATORS[inst.type].color || "#8b98a5";
}

function setIndicatorStatus(message, error = false){
  indEl.status.textContent = message;
  indEl.status.classList.toggle("error", error);
}

function renderIndicatorList(){
  indEl.count.textContent = String(indicators.length);
  indEl.list.replaceChildren();
  if(!indicators.length){
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "Chưa có chỉ báo nào";
    indEl.list.appendChild(empty);
    return;
  }
  indicators.forEach(inst => {
    const label = indicatorLabel(inst);
    const li = document.createElement("li");
    li.dataset.id = inst.id;
    li.classList.toggle("off", !inst.visible);
    const dot = document.createElement("i");
    dot.className = "dot";
    dot.style.background = indicatorColor(inst);
    const text = document.createElement("span");
    text.textContent = label;
    const toggle = document.createElement("button");
    toggle.className = "toggle";
    toggle.type = "button";
    toggle.dataset.action = "toggle";
    toggle.dataset.id = inst.id;
    toggle.textContent = inst.visible ? "◉" : "○";
    toggle.title = `${inst.visible ? "Ẩn" : "Hiện"} ${label}`;
    toggle.setAttribute("aria-label", toggle.title);
    const remove = document.createElement("button");
    remove.className = "rm";
    remove.type = "button";
    remove.dataset.action = "remove";
    remove.dataset.id = inst.id;
    remove.textContent = "×";
    remove.title = `Bỏ ${label}`;
    remove.setAttribute("aria-label", remove.title);
    li.append(dot, text, toggle, remove);
    indEl.list.appendChild(li);
  });
}

function renderParamInputs(){
  const def = INDICATORS[indEl.type.value];
  indEl.params.replaceChildren();
  Object.entries(def.params).forEach(([key, value]) => {
    const meta = PARAM_META[key];
    const label = document.createElement("label");
    label.className = "ind-param";
    label.append(document.createTextNode(meta.label));
    const input = document.createElement("input");
    input.type = "number";
    input.dataset.param = key;
    input.min = String(meta.min);
    input.max = String(meta.max);
    input.step = String(meta.step);
    input.value = String(value);
    input.setAttribute("aria-label", meta.label);
    label.appendChild(input);
    indEl.params.appendChild(label);
  });
  indEl.color.value = def.color;
  setIndicatorStatus(def.pane === 0 ? "Vẽ trên biểu đồ giá" : "Mở trong pane riêng có thể kéo đổi chiều cao");
}

function readIndicatorForm(type){
  const raw = {};
  indEl.params.querySelectorAll("[data-param]").forEach(input => {
    raw[input.dataset.param] = Number(input.value);
  });
  const params = normaliseParams(type, raw);
  if(type === "macd" && params.fast >= params.slow)
    return {error:"MACD cần chu kỳ Nhanh nhỏ hơn Chậm."};
  if(type === "ichimoku" && !(params.tenkan < params.kijun && params.kijun < params.senkou))
    return {error:"Ichimoku cần Tenkan < Kijun < Senkou."};
  return {params, color:validIndicatorColor(indEl.color.value) || INDICATORS[type].color};
}

indEl.open.addEventListener("click", () => {
  indEl.panel.hidden = !indEl.panel.hidden;
  indEl.open.setAttribute("aria-pressed", String(!indEl.panel.hidden));
  if(!indEl.panel.hidden){ renderIndicatorList(); renderParamInputs(); }
});
indEl.close.addEventListener("click", () => {
  indEl.panel.hidden = true;
  indEl.open.setAttribute("aria-pressed", "false");
});
indEl.type.addEventListener("change", renderParamInputs);

indEl.add.addEventListener("click", () => {
  const type = indEl.type.value;
  const def = INDICATORS[type];
  if(!def) return;
  if(indicators.length >= MAX_INDICATORS){
    setIndicatorStatus(`Tối đa ${MAX_INDICATORS} chỉ báo để chart vẫn mượt.`, true);
    return;
  }
  const paneCount = indicators.filter(i => i.visible && INDICATORS[i.type].pane !== 0).length;
  if(def.pane !== 0 && paneCount >= MAX_INDICATOR_PANES){
    setIndicatorStatus(`Tối đa ${MAX_INDICATOR_PANES} pane phụ; hãy ẩn hoặc bỏ một pane trước.`, true);
    return;
  }
  const form = readIndicatorForm(type);
  if(form.error){ setIndicatorStatus(form.error, true); return; }
  const inst = {id: indicatorSeq++, type, color:form.color, params:form.params, visible:true};
  indicators.push(inst);
  buildIndicator(inst, currentBars);
  saveIndicators();
  renderIndicatorList();
  setIndicatorStatus(`Đã thêm ${indicatorLabel(inst)}.`);
});

indEl.params.addEventListener("keydown", e => {
  if(e.key === "Enter"){ indEl.add.click(); e.preventDefault(); }
});

indEl.reset.addEventListener("click", () => {
  indicators.forEach(disposeIndicator);
  indicators = DEFAULT_INDICATORS.map(d => ({
    id:indicatorSeq++, type:d.type, color:d.color,
    params:normaliseParams(d.type, d.params), visible:true,
  }));
  applyIndicators(currentBars);
  saveIndicators();
  renderIndicatorList();
  setIndicatorStatus("Đã khôi phục SMA20 và SMA50 theo rule tín hiệu.");
});

indEl.list.addEventListener("click", e => {
  const btn = e.target.closest("button[data-action]");
  if(!btn) return;
  const id = Number(btn.dataset.id);
  const i = indicators.findIndex(x => x.id === id);
  if(i < 0) return;
  if(btn.dataset.action === "toggle"){
    indicators[i].visible = !indicators[i].visible;
    if(indicators[i].visible) buildIndicator(indicators[i], currentBars);
    else if(INDICATORS[indicators[i].type].pane !== 0) disposeIndicator(indicators[i]);
    else setIndicatorVisibility(indicators[i]);
    saveIndicators();
    renderIndicatorList();
    return;
  }
  disposeIndicator(indicators[i]);
  indicators.splice(i, 1);
  saveIndicators();
  renderIndicatorList();
  setIndicatorStatus("Đã bỏ chỉ báo.");
});

/* ---------- local price alerts ----------
   Alerts are deliberately local and one-shot: they need no account/backend and
   cannot imply that a server will keep watching after this tab is closed. */
let priceAlerts = [];
let alertPriceLines = [];
let toastTimer = 0;

function priceAlertKey(){
  return "leon_chart_alerts_" + symbol.replace(/[^A-Z0-9_-]/g, "");
}

function loadPriceAlerts(){
  priceAlerts = [];
  try{
    const value = JSON.parse(localStorage.getItem(priceAlertKey()) || "[]");
    if(Array.isArray(value)) priceAlerts = value.filter(a =>
      a && typeof a.id === "string" && Number.isFinite(+a.price) && +a.price > 0)
      .map(a => ({
        id:a.id, price:+a.price, active:a.active !== false,
        triggeredAt:typeof a.triggeredAt === "string" ? a.triggeredAt : null,
        createdAt:typeof a.createdAt === "string" ? a.createdAt : new Date().toISOString(),
      })).slice(0, 30);
  }catch(e){}
  renderPriceAlerts();
  if(el.alertDialog.open) renderAlertDialog();
}

function savePriceAlerts(){
  try{ localStorage.setItem(priceAlertKey(), JSON.stringify(priceAlerts)); }catch(e){}
  renderPriceAlerts();
}

function renderPriceAlerts(){
  alertPriceLines.forEach(line => { try{ candles.removePriceLine(line); }catch(e){} });
  alertPriceLines = priceAlerts.map(a => candles.createPriceLine({
    price:a.price,
    color:a.active ? css("--warn") : css("--muted"),
    lineWidth:1,
    lineStyle:a.active ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Dotted,
    axisLabelVisible:true,
    title:a.active ? "Cảnh báo" : "Đã chạm",
  }));
}

function showToast(message){
  clearTimeout(toastTimer);
  el.toast.textContent = message;
  el.toast.hidden = false;
  toastTimer = setTimeout(() => { el.toast.hidden = true; }, 2600);
}

function addPriceAlert(price){
  if(!Number.isFinite(price) || price <= 0) return;
  const duplicate = priceAlerts.some(a => Math.abs(a.price - price) <= Math.max(price * 1e-8, 1e-8));
  if(duplicate){ showToast(`Đã có cảnh báo tại ${nf(price, price < 1 ? 6 : 2)}.`); return; }
  priceAlerts.push({
    id:`a${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`,
    price, active:true, triggeredAt:null, createdAt:new Date().toISOString(),
  });
  savePriceAlerts();
  showToast(`Đã thêm cảnh báo local tại ${nf(price, price < 1 ? 6 : 2)}.`);
}

function checkPriceAlerts(previous, current){
  if(!Number.isFinite(previous) || !Number.isFinite(current) || previous === current) return;
  const hit = priceAlerts.filter(a => a.active &&
    ((previous <= a.price && current >= a.price) || (previous >= a.price && current <= a.price)));
  if(!hit.length) return;
  const at = new Date().toISOString();
  hit.forEach(a => { a.active = false; a.triggeredAt = at; });
  savePriceAlerts();
  showToast(`${symbol} vừa chạm cảnh báo ${nf(hit[0].price, hit[0].price < 1 ? 6 : 2)}${hit.length > 1 ? ` (+${hit.length-1})` : ""}.`);
}

function renderAlertDialog(){
  document.getElementById("alert-title").textContent = `Cảnh báo giá · ${symbol}`;
  el.alertList.replaceChildren();
  if(!priceAlerts.length){
    const empty = document.createElement("div");
    empty.className = "alert-empty";
    empty.textContent = "Chưa có cảnh báo. Chuột phải trên pane giá để thêm.";
    el.alertList.appendChild(empty);
    return;
  }
  priceAlerts.slice().reverse().forEach(a => {
    const row = document.createElement("div");
    row.className = "alert-row";
    const info = document.createElement("div");
    info.className = "alert-price";
    info.textContent = nf(a.price, a.price < 1 ? 6 : 2);
    const state = document.createElement("small");
    state.className = "alert-state";
    state.textContent = a.active ? "Đang theo dõi khi tab mở" :
      `Đã chạm${a.triggeredAt ? " · " + new Date(a.triggeredAt).toLocaleString("vi-VN") : ""}`;
    info.appendChild(state);
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.dataset.alertAction = "toggle";
    toggle.dataset.id = a.id;
    toggle.textContent = a.active ? "Tạm dừng" : "Bật lại";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "danger";
    remove.dataset.alertAction = "remove";
    remove.dataset.id = a.id;
    remove.textContent = "Xóa";
    row.append(info, toggle, remove);
    el.alertList.appendChild(row);
  });
}

document.getElementById("alert-close").addEventListener("click", () => el.alertDialog.close());
el.alertList.addEventListener("click", e => {
  const button = e.target.closest("button[data-alert-action]");
  if(!button) return;
  const alert = priceAlerts.find(a => a.id === button.dataset.id);
  if(!alert) return;
  if(button.dataset.alertAction === "remove")
    priceAlerts = priceAlerts.filter(a => a.id !== alert.id);
  else{
    alert.active = !alert.active;
    if(alert.active) alert.triggeredAt = null;
  }
  savePriceAlerts();
  renderAlertDialog();
});

/* ---------- right-click chart menu ---------- */
let menuPoint = null;

function closeChartMenu(){ el.menu.hidden = true; }

function appendMenuItem(group, item){
  if(item.separator){
    const sep = document.createElement("div");
    sep.className = "ctx-sep";
    group.appendChild(sep);
    return;
  }
  const button = document.createElement("button");
  button.type = "button";
  button.role = "menuitem";
  button.dataset.action = item.action;
  button.disabled = !!item.disabled;
  if(item.danger) button.classList.add("danger");
  const icon = document.createElement("span");
  icon.className = "ctx-icon";
  icon.textContent = item.icon || "";
  const label = document.createElement("span");
  label.className = "ctx-label";
  label.textContent = item.label;
  const value = document.createElement("span");
  value.className = "ctx-value";
  value.textContent = item.value || "";
  const check = document.createElement("span");
  check.className = "ctx-check";
  check.textContent = item.checked ? "✓" : "";
  button.append(icon, label, value, check);
  group.appendChild(button);
}

function renderChartMenu(){
  const scaleOptions = candles.priceScale().options();
  const anyIndicatorsVisible = indicators.some(i => i.visible);
  const priceText = menuPoint && Number.isFinite(menuPoint.price)
    ? nf(menuPoint.price, menuPoint.price < 1 ? 6 : 2) : "—";
  const items = [
    {action:"alert-add", icon:"♧", label:`Thêm cảnh báo @ ${priceText}`, disabled:!menuPoint},
    {action:"alert-manage", icon:"♧", label:"Quản lý cảnh báo…", value:String(priceAlerts.length)},
    {separator:true},
    {action:"fit-price", icon:"↔", label:"Tự co giãn scale giá"},
    {action:"auto-price", label:"Auto-scale price", checked:scaleOptions.autoScale},
    {action:"scale-mode", label:`Scale: ${logarithmicScale ? "Logarithmic → Normal" : "Normal → Logarithmic"}`},
    {action:"crosshair-mode", label:`Crosshair: ${crosshairMagnet ? "Magnet → Normal (free)" : "Normal (free) → Magnet (close)"}`},
    {separator:true},
    {action:"volume", icon:"▥", label:"Volume bars", checked:volumeVisible},
    {action:"indicator-titles", label:"Tiêu đề chỉ báo", checked:showIndicatorTitles},
    {action:"indicator-visibility", icon:"◉", label:`${anyIndicatorsVisible ? "Ẩn" : "Hiện"} hết indicator`, disabled:!indicators.length},
    {action:"drawing-visibility", icon:"◉", label:`${drawingsVisible ? "Ẩn" : "Hiện"} hết hình vẽ`, disabled:!drawings.length},
    {action:"drawing-delete", icon:"♜", label:`Xóa hình vẽ (${drawings.length})`, disabled:!drawings.length, danger:true},
    {action:"indicator-delete", icon:"♜", label:`Xóa hết indicator (${indicators.length})`, disabled:!indicators.length, danger:true},
    {separator:true},
    {action:"image-copy", icon:"▧", label:"Copy ảnh chart"},
    {action:"image-download", icon:"⇩", label:"Tải PNG"},
    {separator:true},
    {action:"theme", icon:"◐", label:"Đổi giao diện sáng / tối"},
    {action:"settings", icon:"⚙", label:"Cài đặt chỉ báo…"},
  ];
  el.menu.replaceChildren();
  items.forEach(item => appendMenuItem(el.menu, item));
}

function openChartMenu(e){
  e.preventDefault();
  if(drawMode !== "pan") setDrawMode("pan");
  const rect = el.main.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const time = x >= 0 && x <= rect.width ? xToTime(x) : null;
  const pricePaneHeight = chart.panes()[0].getHeight();
  const price = y >= 0 && y <= pricePaneHeight ? candles.coordinateToPrice(y) : null;
  menuPoint = price != null && Number.isFinite(+price) && +price > 0
    ? {time:time == null ? null : +time, price:+price} : null;
  renderChartMenu();
  el.menu.hidden = false;
  el.menu.style.left = "0px";
  el.menu.style.top = "0px";
  const menuRect = el.menu.getBoundingClientRect();
  const left = Math.max(8, Math.min(e.clientX, innerWidth - menuRect.width - 8));
  const top = Math.max(8, Math.min(e.clientY, innerHeight - menuRect.height - 8));
  el.menu.style.left = `${left}px`;
  el.menu.style.top = `${top}px`;
  const first = el.menu.querySelector("button:not(:disabled)");
  if(first) first.focus({preventScroll:true});
}

function setAllIndicatorsVisible(visible){
  let panes = 0, limited = false;
  indicators.forEach(inst => {
    if(visible && INDICATORS[inst.type].pane !== 0){
      if(panes >= MAX_INDICATOR_PANES){ inst.visible = false; limited = true; return; }
      panes++;
    }
    inst.visible = visible;
    if(visible) buildIndicator(inst, currentBars);
    else if(INDICATORS[inst.type].pane !== 0) disposeIndicator(inst);
    else setIndicatorVisibility(inst);
  });
  saveIndicators();
  renderIndicatorList();
  if(limited) showToast(`Chỉ mở ${MAX_INDICATOR_PANES} pane phụ để chart vẫn đọc được.`);
}

function updateIndicatorTitles(){
  indicators.forEach(inst => (inst._series || []).forEach((series, slot) => {
    try{ series.applyOptions({title:showIndicatorTitles && slot === 0 ? indicatorLabel(inst) : ""}); }catch(e){}
  }));
}

async function chartImageBlob(){
  const base = chart.takeScreenshot(true, true);
  const output = document.createElement("canvas");
  output.width = base.width;
  output.height = base.height;
  const ctx = output.getContext("2d");
  ctx.drawImage(base, 0, 0);
  if(drawingsVisible && drawings.length){
    const mainRect = el.main.getBoundingClientRect();
    const drawRect = el.drawing.getBoundingClientRect();
    const sx = output.width / mainRect.width, sy = output.height / mainRect.height;
    ctx.drawImage(el.drawing, 0, 0, el.drawing.width, el.drawing.height,
      (drawRect.left-mainRect.left)*sx, (drawRect.top-mainRect.top)*sy,
      drawRect.width*sx, drawRect.height*sy);
  }
  return new Promise((resolve, reject) => output.toBlob(
    blob => blob ? resolve(blob) : reject(new Error("Không tạo được ảnh")), "image/png"));
}

async function runMenuAction(action){
  if(action === "alert-add" && menuPoint) addPriceAlert(menuPoint.price);
  else if(action === "alert-manage"){
    renderAlertDialog();
    el.alertDialog.showModal();
  }else if(action === "fit-price"){
    candles.priceScale().applyOptions({autoScale:true});
    showToast("Đã tự co giãn trục giá.");
  }else if(action === "auto-price"){
    const next = !candles.priceScale().options().autoScale;
    candles.priceScale().applyOptions({autoScale:next});
  }else if(action === "scale-mode"){
    logarithmicScale = !logarithmicScale;
    candles.priceScale().applyOptions({mode:logarithmicScale
      ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal});
    try{ localStorage.setItem("leon_chart_log_scale", logarithmicScale ? "1" : "0"); }catch(e){}
  }else if(action === "crosshair-mode"){
    crosshairMagnet = !crosshairMagnet;
    chart.applyOptions({crosshair:{mode:crosshairMagnet
      ? LightweightCharts.CrosshairMode.Magnet : LightweightCharts.CrosshairMode.Normal}});
    try{ localStorage.setItem("leon_chart_crosshair_magnet", crosshairMagnet ? "1" : "0"); }catch(e){}
  }else if(action === "volume"){
    volumeVisible = !volumeVisible;
    volume.applyOptions({visible:volumeVisible});
    try{ localStorage.setItem("leon_chart_volume", volumeVisible ? "1" : "0"); }catch(e){}
  }else if(action === "indicator-titles"){
    showIndicatorTitles = !showIndicatorTitles;
    updateIndicatorTitles();
    try{ localStorage.setItem("leon_chart_indicator_titles", showIndicatorTitles ? "1" : "0"); }catch(e){}
  }else if(action === "indicator-visibility"){
    setAllIndicatorsVisible(!indicators.some(i => i.visible));
  }else if(action === "drawing-visibility"){
    setDrawingsVisible(!drawingsVisible);
  }else if(action === "drawing-delete"){
    pushUndo(); drawings = []; selectedDrawing = -1; saveDrawings(); scheduleDraw();
  }else if(action === "indicator-delete"){
    indicators.forEach(disposeIndicator); indicators = []; saveIndicators(); renderIndicatorList();
  }else if(action === "image-copy"){
    try{
      const blob = await chartImageBlob();
      if(!navigator.clipboard || typeof ClipboardItem === "undefined") throw new Error("Clipboard không hỗ trợ ảnh");
      await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
      showToast("Đã copy ảnh chart vào clipboard.");
    }catch(e){ showToast("Không copy được ảnh; hãy dùng Tải PNG."); }
  }else if(action === "image-download"){
    try{
      const blob = await chartImageBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `LEON-${symbol}-${timeframe}-${new Date().toISOString().slice(0,10)}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("Đã tạo ảnh PNG của chart.");
    }catch(e){ showToast("Không tạo được ảnh PNG."); }
  }else if(action === "theme"){
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem("leon_theme", next); }catch(e){}
    try{ parent.document.documentElement.dataset.theme = next; }catch(e){}
  }else if(action === "settings"){
    if(indEl.panel.hidden) indEl.open.click();
    indEl.type.focus({preventScroll:true});
  }
}

el.main.addEventListener("contextmenu", openChartMenu);
el.menu.addEventListener("click", e => {
  const button = e.target.closest("button[data-action]");
  if(!button || button.disabled) return;
  const action = button.dataset.action;
  closeChartMenu();
  runMenuAction(action);
});
el.menu.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeChartMenu(); setDrawMode("pan"); return; }
  if(!["ArrowDown","ArrowUp","Home","End"].includes(e.key)) return;
  const buttons = [...el.menu.querySelectorAll("button:not(:disabled)")];
  if(!buttons.length) return;
  const current = Math.max(0, buttons.indexOf(document.activeElement));
  const next = e.key === "Home" ? 0 : e.key === "End" ? buttons.length-1 :
    (current + (e.key === "ArrowDown" ? 1 : -1) + buttons.length) % buttons.length;
  buttons[next].focus(); e.preventDefault();
});
document.addEventListener("pointerdown", e => {
  if(!el.menu.hidden && !el.menu.contains(e.target)) closeChartMenu();
});
window.addEventListener("resize", closeChartMenu);

function syncUrl(){
  const p = new URLSearchParams(location.search);
  p.set("sym", symbol);
  p.set("tf", timeframe);
  history.replaceState(null, "", "?" + p.toString());
}

let symTimer;
el.sym.addEventListener("input", () => {
  clearTimeout(symTimer);
  symTimer = setTimeout(() => {
    const next = el.sym.value.trim().toUpperCase();
    if(next && next !== symbol){
      symbol = next;
      needsFit = true;
      loadDrawings();
      loadPriceAlerts();
      syncUrl();
      load();
    }
  }, 500);
});
el.sym.addEventListener("keydown", e => { if(e.key === "Enter") el.sym.blur(); });

// Follow the hub's theme switch without a reload.
new MutationObserver(() => {
  chart.applyOptions(chartTheme());
  candles.applyOptions({
    upColor:css("--up"), downColor:css("--down"),
    borderUpColor:css("--up"), borderDownColor:css("--down"),
    wickUpColor:css("--up"), wickDownColor:css("--down"),
  });
  // Histogram colors live on each data point, so applyOptions alone cannot
  // recolor bars that are already mounted.
  volume.setData(currentBars.map(volumeBar));
  renderPriceAlerts();
  scheduleDraw();
}).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

// REST is the safety net, not a second live feed. Poll only when the socket is
// absent or has stopped delivering; a healthy Binance stream never refetches
// all 500 bars and never churns its own connection once a minute.
setInterval(() => {
  const healthy = ws && ws.readyState === WebSocket.OPEN && Date.now() - wsLastMessage < 90000;
  if(!document.hidden && !healthy) load();
}, 60000);

loadCoinList();
loadDrawings();
loadPriceAlerts();
loadIndicators();
renderIndicatorList();
load();
</script>
</body>
</html>
