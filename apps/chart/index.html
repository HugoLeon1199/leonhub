<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Chart — LEON Hub</title>
<meta name="description" content="Biểu đồ nến crypto theo thời gian thực từ Binance và Hyperliquid, kèm funding, open interest và Coinbase premium.">

<script>try{document.documentElement.dataset.theme=localStorage.getItem("leon_theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>

<!-- Lightweight Charts is not on cdnjs; jsDelivr is the other CSP-allowed host.
     Pinned, because a silent major bump would break the series API.
     v5 supplies real indicator panes and the unified series API. Drawings stay
     in a lightweight registry-backed canvas because they need editable handles;
     their stored coordinates are market time/price, never screen pixels. -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1c242e; --line:#26303c;
  --text:#e7edf3; --muted:#8b98a8; --accent:#38d39f;
  --up:#38d39f; --down:#f0655a; --warn:#e0a83c;
}
:root[data-theme="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel-2:#eaeff4; --line:#d5dee6;
  --text:#141b22; --muted:#5d6b7a; --accent:#0c8a63;
  --up:#0c8a63; --down:#c2402f; --warn:#8a6412;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
}

/* ---- Toolbar ---- */
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line);
}
.sym-input{
  width:104px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:7px; padding:6px 10px; font:inherit; font-weight:700; letter-spacing:.4px;
  text-transform:uppercase;
}
.sym-input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.group{display:flex; gap:2px; background:var(--panel-2); padding:2px; border-radius:8px;
  flex:0 0 auto}
.group button{
  appearance:none; border:0; background:transparent; color:var(--muted);
  font:inherit; font-size:12.5px; padding:5px 10px; border-radius:6px; cursor:pointer;
}
.group button:hover{color:var(--text)}
.group button[aria-pressed="true"]{background:var(--accent); color:#04150f; font-weight:600}
.group button:disabled{opacity:.35; cursor:not-allowed}
:root[data-theme="light"] .group button[aria-pressed="true"]{color:#fff}
.group button.danger:hover{color:var(--down)}
.draw-count{min-width:18px; padding:0 4px; color:var(--muted); font-size:11px;
  display:grid; place-items:center; font-variant-numeric:tabular-nums}
.ind-panel{background:var(--panel); border-bottom:1px solid var(--line);
  padding:8px 12px; display:flex; flex-direction:column; gap:8px}
.ind-panel[hidden]{display:none}
.ind-add{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ind-add select, .ind-add input{background:var(--panel-2); border:1px solid var(--line);
  color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px; font-family:inherit}
.ind-params{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ind-param{display:inline-flex; gap:4px; align-items:center; color:var(--muted); font-size:11px}
.ind-param input{width:72px}
.ind-color{display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-size:11px}
.ind-color input{width:34px; height:28px; padding:2px; cursor:pointer}
.ind-add button{background:var(--accent); color:#04150f; border:0; border-radius:6px;
  padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit}
.ind-add button.ghost{background:var(--panel-2); color:var(--muted); font-weight:400}
.ind-add button:disabled{opacity:.45; cursor:not-allowed}
.ind-status{min-height:18px; color:var(--muted); font-size:11px}
.ind-status.error{color:var(--down)}
.ind-list{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.ind-list li{display:inline-flex; align-items:center; gap:7px; background:var(--panel-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 6px 3px 10px; font-size:12px}
.ind-list li.off{opacity:.55}
.ind-list .dot{width:8px; height:8px; border-radius:50%; flex:none}
.ind-list button{background:none; border:0; color:var(--muted); cursor:pointer;
  font-size:14px; line-height:1; padding:2px 4px; font-family:inherit}
.ind-list .toggle:hover{color:var(--text)}
.ind-list .rm:hover{color:var(--down)}
.ind-list .empty{color:var(--muted); border:0; background:none; padding-left:0}
.live{display:inline-flex; align-items:center; gap:5px}
.live::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--up);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--up) 18%, transparent)}
.live[hidden]{display:none}

.quote{display:flex; align-items:baseline; gap:10px; margin-left:auto; padding-right:4px;
  flex:0 0 auto}
.price{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.4px}
.chg{font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.dim{color:var(--muted); font-weight:400; font-size:11px}

/* ---- Stat strip: the context a price alone cannot give ---- */
.stats{
  flex:0 0 auto; display:flex; gap:0; overflow-x:auto; background:var(--panel);
  border-bottom:1px solid var(--line); scrollbar-width:none;
}
.stats::-webkit-scrollbar{display:none}
.stat{
  padding:7px 14px; border-right:1px solid var(--line); min-width:112px; flex:0 0 auto;
}
.stat .k{
  font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  display:block; margin-bottom:2px;
}
.stat .v{font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums}

/* ---- Chart ---- */
main{flex:1; position:relative; min-height:0}
#chart{position:absolute; inset:0}
#drawings{position:absolute; top:0; left:0; width:100%; height:100%; z-index:2;
  pointer-events:none; touch-action:none; outline:none}
#drawings.active{pointer-events:auto; cursor:crosshair}
#drawings.selecting{cursor:default}
#drawings[hidden]{display:none}
.msg{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  gap:8px; color:var(--muted); background:var(--bg); padding:24px; z-index:3;
}
.msg strong{color:var(--text); font-size:15px}
.msg small{font-size:12.5px; max-width:46ch}
.msg[hidden]{display:none!important}

/* ---- Right-click menu ---- */
.context-menu{
  position:fixed; z-index:30; width:min(292px,calc(100vw - 16px));
  max-height:calc(100vh - 16px); overflow:auto; padding:7px;
  border:1px solid var(--line); border-radius:8px; background:var(--panel);
  box-shadow:0 18px 48px rgba(0,0,0,.38); color:var(--text);
}
.context-menu[hidden]{display:none}
.context-menu button{
  width:100%; display:flex; align-items:center; gap:9px; border:0; border-radius:5px;
  padding:8px 9px; background:transparent; color:var(--text); text-align:left;
  font:12.5px/1.25 inherit; cursor:pointer;
}
.context-menu button:hover,.context-menu button:focus-visible{background:var(--panel-2); outline:none}
.context-menu button:disabled{opacity:.38; cursor:not-allowed; background:transparent}
.context-menu .ctx-icon{width:16px; flex:none; color:var(--muted); text-align:center}
.context-menu .ctx-label{flex:1; min-width:0}
.context-menu .ctx-value{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
.context-menu .ctx-check{width:14px; color:var(--muted); text-align:center}
.context-menu .danger{color:var(--down)}
.context-menu .ctx-sep{height:1px; margin:5px 4px; background:var(--line)}

.chart-toast{
  position:fixed; left:50%; bottom:38px; z-index:40; transform:translateX(-50%);
  max-width:min(440px,calc(100vw - 24px)); padding:8px 12px; border-radius:7px;
  background:var(--panel-2); border:1px solid var(--line); box-shadow:0 10px 28px rgba(0,0,0,.3);
  color:var(--text); font-size:12px; text-align:center;
}
.chart-toast[hidden]{display:none}

.alert-dialog{
  width:min(520px,calc(100vw - 24px)); max-height:min(620px,calc(100vh - 24px));
  padding:0; border:1px solid var(--line); border-radius:10px; background:var(--panel);
  color:var(--text); box-shadow:0 24px 80px rgba(0,0,0,.5);
}
.alert-dialog::backdrop{background:rgba(2,6,12,.66)}
.alert-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
.alert-head strong{flex:1}
.alert-head button,.alert-row button{
  border:1px solid var(--line); border-radius:6px; background:var(--panel-2); color:var(--text);
  padding:5px 9px; cursor:pointer; font:12px inherit;
}
.alert-list{padding:8px 16px 14px; max-height:440px; overflow:auto}
.alert-empty{padding:22px 0; color:var(--muted); text-align:center}
.alert-row{display:grid; grid-template-columns:minmax(110px,1fr) auto auto; gap:8px; align-items:center;
  padding:9px 0; border-bottom:1px solid var(--line)}
.alert-row:last-child{border-bottom:0}
.alert-price{font-weight:700; font-variant-numeric:tabular-nums}
.alert-state{display:block; margin-top:2px; color:var(--muted); font-size:11px; font-weight:400}
.alert-row button.danger{color:var(--down)}

footer{
  flex:0 0 auto; padding:5px 12px; background:var(--panel); border-top:1px solid var(--line);
  font-size:11px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap;
}
footer b{color:var(--text); font-weight:600}
</style>

<body>

<div class="bar">
  <input id="sym" class="sym-input" value="BTC" maxlength="12" list="coins" aria-label="Mã coin"
         autocomplete="off" spellcheck="false">
  <datalist id="coins"></datalist>
  <div class="group" id="tfs" role="group" aria-label="Khung thời gian"></div>
  <div class="group" role="group" aria-label="Chỉ báo">
    <button id="ind-open" type="button" title="Thêm hoặc bỏ chỉ báo">Chỉ báo <span id="ind-count">0</span></button>
  </div>
  <div class="group" id="draw-tools" role="group" aria-label="Công cụ vẽ">
    <button type="button" data-tool="pan" aria-pressed="true" title="Di chuyển và thu phóng chart (Esc)">Pan / Esc</button>
    <button type="button" data-tool="select" aria-pressed="false" title="Chọn, kéo hoặc nhấn Delete để xóa hình">◇</button>
    <!-- Tool buttons are generated from TOOLS so a new tool needs one entry,
         not an entry plus a button someone has to remember to add. -->
    <button id="draw-undo" type="button" title="Hoàn tác (Ctrl+Z)">↶</button>
    <button id="draw-redo" type="button" title="Làm lại (Ctrl+Y)">↷</button>
    <button id="draw-magnet" type="button" aria-pressed="false"
            title="Nam châm OHLC — giữ Ctrl để đảo tạm">🧲</button>
    <button id="draw-clear" class="danger" type="button" title="Xóa tất cả hình của coin này">Xóa</button>
    <span class="draw-count" id="draw-count" title="Số hình đã lưu">0</span>
  </div>
  <div class="quote">
    <span class="price" id="price">—</span>
    <span class="chg" id="chg"></span>
  </div>
</div>

<!-- Indicator panel. Hidden until asked for, so the default chart stays a
     chart rather than a control surface. -->
<div class="ind-panel" id="ind-panel" hidden>
  <div class="ind-add">
    <select id="ind-type" aria-label="Loại chỉ báo"></select>
    <div id="ind-params" class="ind-params"></div>
    <label class="ind-color">Màu <input id="ind-color" type="color" value="#3b82f6"></label>
    <button id="ind-add" type="button">Thêm</button>
    <button id="ind-reset" type="button" class="ghost">MA mặc định</button>
    <button id="ind-close" type="button" class="ghost">Đóng</button>
  </div>
  <div id="ind-status" class="ind-status" aria-live="polite"></div>
  <ul class="ind-list" id="ind-list"></ul>
</div>

<div class="stats" id="stats"></div>

<main>
  <div id="chart"></div>
  <canvas id="drawings" tabindex="0" aria-label="Lớp vẽ phân tích kỹ thuật"></canvas>
  <div class="msg" id="msg"><strong>Đang tải dữ liệu…</strong></div>
</main>

<div id="chart-menu" class="context-menu" role="menu" aria-label="Tùy chọn biểu đồ" hidden></div>
<div id="chart-toast" class="chart-toast" role="status" aria-live="polite" hidden></div>

<dialog id="alert-dialog" class="alert-dialog" aria-labelledby="alert-title">
  <div class="alert-head">
    <strong id="alert-title">Cảnh báo giá</strong>
    <button id="alert-close" type="button">Đóng</button>
  </div>
  <div id="alert-list" class="alert-list"></div>
</dialog>

<footer>
  <span>Nguồn: <b id="src">Binance</b></span>
  <span class="live" id="live" hidden>Trực tiếp</span>
  <span>Cập nhật: <b id="upd">—</b></span>
  <span>Dữ liệu tham khảo, không phải khuyến nghị đầu tư.</span>
</footer>

<script>
"use strict";

const TIMEFRAMES = ["5m","15m","1h","4h","1d"];
const LIMIT = 500;
// How many bars may accumulate once older pages are pulled in. Separate from
// LIMIT on purpose: LIMIT is the size of one fetch, this is the ceiling on the
// series. Trimming the series back to LIMIT after a websocket tick -- which is
// what used to happen -- threw away every page the reader had just scrolled
// back to load.
const MAX_BARS = 5000;
const COIN_CACHE_KEY = "leon_binance_coins_v1";
const COIN_CACHE_MS = 24 * 60 * 60 * 1000;
const FALLBACK_COINS = [
  "BTC","ETH","BNB","SOL","XRP","DOGE","ADA","TRX","AVAX","LINK",
  "SUI","TON","DOT","BCH","LTC","UNI","NEAR","APT","FIL","ARB",
  "OP","AAVE","ATOM","ETC","ICP","INJ","RENDER","FET","PEPE","SHIB",
];

const el = {
  main: document.querySelector("main"),
  sym: document.getElementById("sym"),
  coins: document.getElementById("coins"),
  tfs: document.getElementById("tfs"),
  drawing: document.getElementById("drawings"),
  drawTools: document.getElementById("draw-tools"),
  drawClear: document.getElementById("draw-clear"),
  drawCount: document.getElementById("draw-count"),
  drawUndo: document.getElementById("draw-undo"),
  drawRedo: document.getElementById("draw-redo"),
  drawMagnet: document.getElementById("draw-magnet"),
  price: document.getElementById("price"),
  chg: document.getElementById("chg"),
  stats: document.getElementById("stats"),
  msg: document.getElementById("msg"),
  src: document.getElementById("src"),
  upd: document.getElementById("upd"),
  live: document.getElementById("live"),
  menu: document.getElementById("chart-menu"),
  toast: document.getElementById("chart-toast"),
  alertDialog: document.getElementById("alert-dialog"),
  alertList: document.getElementById("alert-list"),
};

const params = new URLSearchParams(location.search);
let symbol = (params.get("sym") || "BTC").toUpperCase();
let timeframe = TIMEFRAMES.includes(params.get("tf")) ? params.get("tf") : "1h";
el.sym.value = symbol;

function storedBool(key, fallback){
  try{
    const value = localStorage.getItem(key);
    return value == null ? fallback : value === "1";
  }catch(e){ return fallback; }
}

let volumeVisible = storedBool("leon_chart_volume", true);
let showIndicatorTitles = storedBool("leon_chart_indicator_titles", true);
let drawingsVisible = storedBool("leon_chart_drawings_visible", true);
let crosshairMagnet = storedBool("leon_chart_crosshair_magnet", false);
let logarithmicScale = storedBool("leon_chart_log_scale", false);

function renderCoinList(symbols){
  el.coins.replaceChildren(...symbols.map(sym => {
    const option = document.createElement("option");
    option.value = sym;
    return option;
  }));
}

async function loadCoinList(){
  let cached;
  try{ cached = JSON.parse(localStorage.getItem(COIN_CACHE_KEY) || "null"); }catch(e){}
  if(cached && Date.now() - cached.at < COIN_CACHE_MS && Array.isArray(cached.symbols)){
    renderCoinList(cached.symbols);
    return;
  }
  renderCoinList(FALLBACK_COINS);
  try{
    const res = await fetch("https://api.binance.com/api/v3/exchangeInfo");
    if(!res.ok) throw new Error("exchangeInfo " + res.status);
    const payload = await res.json();
    const available = (payload.symbols || [])
      .filter(x => x.status === "TRADING" && x.quoteAsset === "USDT" &&
        x.isSpotTradingAllowed !== false && x.symbol.endsWith("USDT"))
      .map(x => x.symbol.slice(0, -4))
      .filter((x, i, all) => x && all.indexOf(x) === i)
      .sort((a, b) => a.localeCompare(b));
    // exchangeInfo currently exposes hundreds of tiny pairs. Keep the field
    // scannable while pinning the widely followed names to the front.
    const popular = FALLBACK_COINS.filter(x => available.includes(x));
    const symbols = [...popular, ...available.filter(x => !popular.includes(x))].slice(0, 250);
    if(symbols.length){
      renderCoinList(symbols);
      try{ localStorage.setItem(COIN_CACHE_KEY, JSON.stringify({at:Date.now(), symbols})); }catch(e){}
    }
  }catch(e){ /* the popular fallback keeps the field useful offline */ }
}

/* ---------- theme-aware chart colors ---------- */
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

function chartTheme(){
  return {
    layout:{
      background:{color:css("--bg")}, textColor:css("--muted"), fontSize:11,
      panes:{
        enableResize:true,
        separatorColor:css("--line"),
        separatorHoverColor:css("--panel-2"),
      },
    },
    grid:{ vertLines:{color:css("--line")}, horzLines:{color:css("--line")} },
    rightPriceScale:{ borderColor:css("--line") },
    timeScale:{ borderColor:css("--line"), timeVisible:true, secondsVisible:false },
    crosshair:{ mode: crosshairMagnet
      ? LightweightCharts.CrosshairMode.Magnet : LightweightCharts.CrosshairMode.Normal },
  };
}

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  ...chartTheme(), autoSize:true,
});
const candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor:css("--up"), downColor:css("--down"),
  borderUpColor:css("--up"), borderDownColor:css("--down"),
  wickUpColor:css("--up"), wickDownColor:css("--down"),
});
const volume = chart.addSeries(LightweightCharts.HistogramSeries, {
  priceFormat:{type:"volume"}, priceScaleId:"vol", visible:volumeVisible,
});
chart.priceScale("vol").applyOptions({ scaleMargins:{top:0.84, bottom:0} });
candles.priceScale().applyOptions({
  mode:logarithmicScale
    ? LightweightCharts.PriceScaleMode.Logarithmic : LightweightCharts.PriceScaleMode.Normal,
});

/* ---------- indicator maths ----------
   Written out rather than pulled from a library: every formula below is
   textbook, and a dependency for arithmetic this small would cost more in
   load time than it saves. Each takes the bar array and returns
   {time, value} points aligned to it. */

function sma(bars, period, key = "close"){
  const out = [];
  let sum = 0;
  for(let i = 0; i < bars.length; i++){
    sum += bars[i][key];
    if(i >= period) sum -= bars[i - period][key];
    if(i >= period - 1) out.push({time:bars[i].time, value:sum / period});
  }
  return out;
}

function emaValues(values, period){
  // Seeded with the simple average of the first `period` values, which is the
  // convention charting platforms use; seeding with the first value alone
  // leaves a visible hook at the left edge.
  const k = 2 / (period + 1), out = [];
  let prev = null, sum = 0;
  for(let i = 0; i < values.length; i++){
    const v = values[i];
    if(i < period - 1){ sum += v; out.push(null); continue; }
    if(prev === null){ sum += v; prev = sum / period; }
    else prev = v * k + prev * (1 - k);
    out.push(prev);
  }
  return out;
}

function ema(bars, period, key = "close"){
  const vals = emaValues(bars.map(b => b[key]), period);
  return bars.map((b, i) => vals[i] == null ? null : {time:b.time, value:vals[i]})
             .filter(Boolean);
}

function wma(bars, period, key = "close"){
  const out = [], denom = period * (period + 1) / 2;
  for(let i = period - 1; i < bars.length; i++){
    let acc = 0;
    for(let j = 0; j < period; j++) acc += bars[i - period + 1 + j][key] * (j + 1);
    out.push({time:bars[i].time, value:acc / denom});
  }
  return out;
}

function hma(bars, period){
  // Hull: WMA of (2*WMA(n/2) - WMA(n)), smoothed over sqrt(n).
  const half = Math.max(1, Math.round(period / 2));
  const sqrt = Math.max(1, Math.round(Math.sqrt(period)));
  const w1 = wma(bars, half), w2 = wma(bars, period);
  const byTime = new Map(w1.map(p => [p.time, p.value]));
  const raw = w2.map(p => {
    const a = byTime.get(p.time);
    return a == null ? null : {time:p.time, close:2 * a - p.value};
  }).filter(Boolean);
  return wma(raw, sqrt);
}

function stdev(values){
  const n = values.length;
  if(n < 2) return 0;
  const mean = values.reduce((a, b) => a + b, 0) / n;
  return Math.sqrt(values.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
}

function rsi(bars, period){
  // Wilder smoothing, not a plain average: the first value is a simple mean of
  // the opening window, and every later one decays it. A plain rolling mean
  // gives a visibly different line and is the usual mistake.
  const out = [];
  let gain = 0, loss = 0;
  for(let i = 1; i < bars.length; i++){
    const diff = bars[i].close - bars[i - 1].close;
    const up = Math.max(0, diff), down = Math.max(0, -diff);
    if(i <= period){
      gain += up; loss += down;
      if(i === period){
        gain /= period; loss /= period;
        out.push({time:bars[i].time, value:loss === 0 ? (gain === 0 ? 50 : 100) : 100 - 100 / (1 + gain / loss)});
      }
      continue;
    }
    gain = (gain * (period - 1) + up) / period;
    loss = (loss * (period - 1) + down) / period;
    out.push({time:bars[i].time, value:loss === 0 ? (gain === 0 ? 50 : 100) : 100 - 100 / (1 + gain / loss)});
  }
  return out;
}

function macd(bars, fast, slow, signal){
  const closes = bars.map(b => b.close);
  const f = emaValues(closes, fast), s = emaValues(closes, slow);
  const line = [], lineVals = [];
  bars.forEach((b, i) => {
    if(f[i] == null || s[i] == null) return;
    lineVals.push(f[i] - s[i]);
    line.push({time:b.time, value:f[i] - s[i]});
  });
  const sig = emaValues(lineVals, signal);
  const signalPts = [], histPts = [];
  line.forEach((p, i) => {
    if(sig[i] == null) return;
    signalPts.push({time:p.time, value:sig[i]});
    const value = p.value - sig[i];
    histPts.push({time:p.time, value,
      color:value >= 0 ? "rgba(56,211,159,.58)" : "rgba(240,101,90,.58)"});
  });
  return {line, signal:signalPts, hist:histPts};
}

function bollinger(bars, period, mult){
  const upper = [], mid = [], lower = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1).map(b => b.close);
    const mean = win.reduce((a, b) => a + b, 0) / period;
    const sd = stdev(win);
    const t = bars[i].time;
    upper.push({time:t, value:mean + mult * sd});
    mid.push({time:t, value:mean});
    lower.push({time:t, value:mean - mult * sd});
  }
  return {upper, mid, lower};
}

function trueRanges(bars){
  const tr = [];
  for(let i = 0; i < bars.length; i++){
    const b = bars[i];
    tr.push(i === 0 ? b.high - b.low : Math.max(
      b.high - b.low,
      Math.abs(b.high - bars[i-1].close),
      Math.abs(b.low - bars[i-1].close)));
  }
  return tr;
}

function atr(bars, period){
  const tr = trueRanges(bars), out = [];
  let prev = null;
  for(let i = 0; i < bars.length; i++){
    if(i < period - 1) continue;
    if(prev === null) prev = tr.slice(0, period).reduce((a, b) => a + b, 0) / period;
    else prev = (prev * (period - 1) + tr[i]) / period;
    out.push({time:bars[i].time, value:prev});
  }
  return out;
}

function stochastic(bars, period, smoothK, smoothD){
  const raw = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1);
    const hi = Math.max(...win.map(b => b.high));
    const lo = Math.min(...win.map(b => b.low));
    raw.push({time:bars[i].time,
      close: hi === lo ? 50 : ((bars[i].close - lo) / (hi - lo)) * 100});
  }
  const k = sma(raw, smoothK);
  const d = sma(k.map(p => ({time:p.time, close:p.value})), smoothD);
  return {k, d};
}

function vwap(bars){
  // Session-anchored: the running sum restarts each UTC day, which is what
  // makes VWAP a level for the session rather than a slow drifting average.
  const out = [];
  let pv = 0, vol = 0, day = null;
  for(const b of bars){
    const d = Math.floor(b.time / 86400);
    if(d !== day){ day = d; pv = 0; vol = 0; }
    const typical = (b.high + b.low + b.close) / 3;
    pv += typical * (b.volume || 0);
    vol += b.volume || 0;
    if(vol > 0) out.push({time:b.time, value:pv / vol});
  }
  return out;
}

function supertrend(bars, period, mult){
  const a = atr(bars, period);
  const atrAt = new Map(a.map(p => [p.time, p.value]));
  const up = [], down = [];
  let trend = 1, prevUpper = null, prevLower = null, prevClose = null;
  for(const b of bars){
    const av = atrAt.get(b.time);
    if(av == null){ prevClose = b.close; continue; }
    const mid = (b.high + b.low) / 2;
    let upper = mid + mult * av, lower = mid - mult * av;
    // Bands only tighten while the trend holds; that ratchet is what keeps the
    // line from whipsawing on every bar.
    if(prevUpper != null && prevClose != null)
      upper = (upper < prevUpper || prevClose > prevUpper) ? upper : prevUpper;
    if(prevLower != null && prevClose != null)
      lower = (lower > prevLower || prevClose < prevLower) ? lower : prevLower;
    if(prevUpper != null){
      if(trend === 1 && b.close < prevLower) trend = -1;
      else if(trend === -1 && b.close > prevUpper) trend = 1;
    }
    // Whitespace points break the opposite line, so a direction change is
    // visible instead of painting one ambiguous colour through both regimes.
    up.push(trend === 1 ? {time:b.time, value:lower} : {time:b.time});
    down.push(trend === -1 ? {time:b.time, value:upper} : {time:b.time});
    prevUpper = upper; prevLower = lower; prevClose = b.close;
  }
  return {up, down};
}

function ichimoku(bars, tenkanLen, kijunLen, senkouLen){
  const hl = (from, to) => {
    const win = bars.slice(from, to);
    if(!win.length) return null;
    return (Math.max(...win.map(b => b.high)) + Math.min(...win.map(b => b.low))) / 2;
  };
  const tenkan = [], kijun = [], spanA = [], spanB = [], chikou = [];
  const futureTime = i => {
    if(i < bars.length) return bars[i].time;
    const step = bars.length > 1
      ? bars[bars.length - 1].time - bars[bars.length - 2].time : 0;
    return step ? bars[bars.length - 1].time + (i - bars.length + 1) * step : null;
  };
  for(let i = 0; i < bars.length; i++){
    let tenkanValue = null, kijunValue = null;
    if(i >= tenkanLen - 1){
      tenkanValue = hl(i - tenkanLen + 1, i + 1);
      if(tenkanValue != null) tenkan.push({time:bars[i].time, value:tenkanValue});
    }
    if(i >= kijunLen - 1){
      kijunValue = hl(i - kijunLen + 1, i + 1);
      if(kijunValue != null) kijun.push({time:bars[i].time, value:kijunValue});
      const projected = futureTime(i + kijunLen);
      if(projected != null && tenkanValue != null)
        spanA.push({time:projected, value:(tenkanValue + kijunValue) / 2});
    }
    if(i >= senkouLen - 1){
      const projected = futureTime(i + kijunLen);
      const v = hl(i - senkouLen + 1, i + 1);
      if(projected != null && v != null) spanB.push({time:projected, value:v});
    }
    if(i >= kijunLen) chikou.push({time:bars[i - kijunLen].time, value:bars[i].close});
  }
  return {tenkan, kijun, spanA, spanB, chikou};
}

function obv(bars){
  const out = [];
  let acc = 0;
  for(let i = 1; i < bars.length; i++){
    const d = bars[i].close - bars[i-1].close;
    acc += d > 0 ? (bars[i].volume || 0) : d < 0 ? -(bars[i].volume || 0) : 0;
    out.push({time:bars[i].time, value:acc});
  }
  return out;
}

function mfi(bars, period){
  const out = [];
  for(let i = period; i < bars.length; i++){
    let pos = 0, neg = 0;
    for(let j = i - period + 1; j <= i; j++){
      const tp = (bars[j].high + bars[j].low + bars[j].close) / 3;
      const prev = (bars[j-1].high + bars[j-1].low + bars[j-1].close) / 3;
      const flow = tp * (bars[j].volume || 0);
      if(tp > prev) pos += flow; else if(tp < prev) neg += flow;
    }
    out.push({time:bars[i].time,
      value: neg === 0 ? (pos === 0 ? 50 : 100) : 100 - 100 / (1 + pos / neg)});
  }
  return out;
}

function cci(bars, period){
  const out = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1)
                    .map(b => (b.high + b.low + b.close) / 3);
    const mean = win.reduce((a, b) => a + b, 0) / period;
    const dev = win.reduce((a, b) => a + Math.abs(b - mean), 0) / period;
    const tp = (bars[i].high + bars[i].low + bars[i].close) / 3;
    out.push({time:bars[i].time, value: dev === 0 ? 0 : (tp - mean) / (0.015 * dev)});
  }
  return out;
}

function adx(bars, period){
  const tr = trueRanges(bars), plus = [0], minus = [0];
  for(let i = 1; i < bars.length; i++){
    const up = bars[i].high - bars[i-1].high;
    const dn = bars[i-1].low - bars[i].low;
    plus.push(up > dn && up > 0 ? up : 0);
    minus.push(dn > up && dn > 0 ? dn : 0);
  }
  const out = [];
  let trS = 0, pS = 0, mS = 0, adxPrev = null, dxSum = 0, count = 0;
  for(let i = 1; i < bars.length; i++){
    if(i <= period){
      trS += tr[i]; pS += plus[i]; mS += minus[i];
      if(i < period) continue;
    }else{
      trS = trS - trS / period + tr[i];
      pS  = pS  - pS  / period + plus[i];
      mS  = mS  - mS  / period + minus[i];
    }
    if(trS === 0) continue;
    const pdi = 100 * pS / trS, mdi = 100 * mS / trS;
    const dx = (pdi + mdi) === 0 ? 0 : 100 * Math.abs(pdi - mdi) / (pdi + mdi);
    if(adxPrev === null){
      dxSum += dx; count++;
      if(count === period){ adxPrev = dxSum / period; out.push({time:bars[i].time, value:adxPrev}); }
    }else{
      adxPrev = (adxPrev * (period - 1) + dx) / period;
      out.push({time:bars[i].time, value:adxPrev});
    }
  }
  return out;
}

function vwma(bars, period){
  const out = [];
  for(let i = period - 1; i < bars.length; i++){
    let pv = 0, v = 0;
    for(let j = i - period + 1; j <= i; j++){
      const vol = bars[j].volume || 0;
      pv += bars[j].close * vol; v += vol;
    }
    out.push({time:bars[i].time, value: v ? pv / v : bars[i].close});
  }
  return out;
}

// Parabolic SAR: the stop flips side when price crosses it, and the
// acceleration factor steps up on each new extreme.
function psar(bars, step, maxStep){
  if(bars.length < 2) return [];
  const out = [];
  let up = bars[1].close >= bars[0].close;
  let sar = up ? bars[0].low : bars[0].high;
  let ep = up ? bars[0].high : bars[0].low;
  let af = step;
  for(let i = 1; i < bars.length; i++){
    sar = sar + af * (ep - sar);
    const b = bars[i];
    if(up){
      if(b.low < sar){ up = false; sar = ep; ep = b.low; af = step; }
      else if(b.high > ep){ ep = b.high; af = Math.min(maxStep, af + step); }
    }else{
      if(b.high > sar){ up = true; sar = ep; ep = b.high; af = step; }
      else if(b.low < ep){ ep = b.low; af = Math.min(maxStep, af + step); }
    }
    out.push({time:b.time, value:sar});
  }
  return out;
}

// Alligator: three smoothed averages of the median price, each pushed forward
// by its own offset. The offsets are the point -- the lines only separate
// once a trend is real.
function smma(values, period){
  const out = [];
  let prev = null, sum = 0;
  for(let i = 0; i < values.length; i++){
    if(i < period - 1){ sum += values[i]; out.push(null); continue; }
    if(prev === null){ sum += values[i]; prev = sum / period; }
    else prev = (prev * (period - 1) + values[i]) / period;
    out.push(prev);
  }
  return out;
}

function alligator(bars){
  const med = bars.map(b => (b.high + b.low) / 2);
  const mk = (period, shift) => {
    const v = smma(med, period), out = [];
    for(let i = 0; i < bars.length; i++){
      const src = i - shift;
      if(src < 0 || v[src] == null) continue;
      out.push({time:bars[i].time, value:v[src]});
    }
    return out;
  };
  return {jaw:mk(13, 8), teeth:mk(8, 5), lips:mk(5, 3)};
}

function williamsR(bars, period){
  const out = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1);
    const hi = Math.max(...win.map(b => b.high));
    const lo = Math.min(...win.map(b => b.low));
    out.push({time:bars[i].time, value: hi === lo ? -50 : -100 * (hi - bars[i].close) / (hi - lo)});
  }
  return out;
}

function roc(bars, period){
  const out = [];
  for(let i = period; i < bars.length; i++){
    const base = bars[i - period].close;
    out.push({time:bars[i].time, value: base ? (bars[i].close - base) / base * 100 : 0});
  }
  return out;
}

function momentum(bars, period){
  const out = [];
  for(let i = period; i < bars.length; i++)
    out.push({time:bars[i].time, value:bars[i].close - bars[i - period].close});
  return out;
}

// TRIX: rate of change of a triple-smoothed EMA -- the triple smoothing is
// what strips the noise a single EMA leaves behind.
function trix(bars, period){
  const c = bars.map(b => b.close);
  const e1 = emaValues(c, period);
  const e2 = emaValues(e1.map(v => v == null ? 0 : v), period);
  const e3 = emaValues(e2.map(v => v == null ? 0 : v), period);
  const out = [];
  for(let i = 1; i < bars.length; i++){
    if(e3[i] == null || e3[i-1] == null || !e3[i-1]) continue;
    out.push({time:bars[i].time, value:(e3[i] - e3[i-1]) / e3[i-1] * 100});
  }
  return out;
}

function tsi(bars, longLen, shortLen){
  const diff = [], absDiff = [];
  for(let i = 1; i < bars.length; i++){
    const d = bars[i].close - bars[i-1].close;
    diff.push(d); absDiff.push(Math.abs(d));
  }
  const s1 = emaValues(emaValues(diff, longLen).map(v => v == null ? 0 : v), shortLen);
  const s2 = emaValues(emaValues(absDiff, longLen).map(v => v == null ? 0 : v), shortLen);
  const out = [];
  for(let i = 0; i < diff.length; i++){
    if(s1[i] == null || s2[i] == null || !s2[i]) continue;
    out.push({time:bars[i+1].time, value:100 * s1[i] / s2[i]});
  }
  return out;
}

function ultimate(bars, fast, mid, slow){
  const bp = [], tr = [];
  for(let i = 1; i < bars.length; i++){
    const low = Math.min(bars[i].low, bars[i-1].close);
    bp.push(bars[i].close - low);
    tr.push(Math.max(bars[i].high, bars[i-1].close) - low);
  }
  const sumOf = (arr, end, n) => {
    let s = 0;
    for(let j = end - n + 1; j <= end; j++) s += arr[j];
    return s;
  };
  const out = [];
  for(let i = slow - 1; i < bp.length; i++){
    const a = sumOf(tr, i, fast) ? sumOf(bp, i, fast) / sumOf(tr, i, fast) : 0;
    const b = sumOf(tr, i, mid)  ? sumOf(bp, i, mid)  / sumOf(tr, i, mid)  : 0;
    const c = sumOf(tr, i, slow) ? sumOf(bp, i, slow) / sumOf(tr, i, slow) : 0;
    out.push({time:bars[i+1].time, value:100 * (4*a + 2*b + c) / 7});
  }
  return out;
}

function awesome(bars, fast, slow){
  const med = bars.map(b => ({time:b.time, close:(b.high + b.low) / 2}));
  const f = sma(med, fast), s = sma(med, slow);
  const byTime = new Map(f.map(p => [p.time, p.value]));
  return s.map(p => {
    const fv = byTime.get(p.time);
    return fv == null ? null : {time:p.time, value:fv - p.value};
  }).filter(Boolean);
}

function aroon(bars, period){
  const up = [], down = [];
  for(let i = period; i < bars.length; i++){
    const win = bars.slice(i - period, i + 1);
    let hi = 0, lo = 0;
    win.forEach((b, j) => {
      if(b.high >= win[hi].high) hi = j;
      if(b.low <= win[lo].low) lo = j;
    });
    up.push({time:bars[i].time, value:100 * hi / period});
    down.push({time:bars[i].time, value:100 * lo / period});
  }
  return {up, down};
}

function vortex(bars, period){
  const plus = [], minus = [];
  const tr = trueRanges(bars);
  for(let i = period; i < bars.length; i++){
    let vp = 0, vm = 0, trSum = 0;
    for(let j = i - period + 1; j <= i; j++){
      vp += Math.abs(bars[j].high - bars[j-1].low);
      vm += Math.abs(bars[j].low - bars[j-1].high);
      trSum += tr[j];
    }
    if(!trSum) continue;
    plus.push({time:bars[i].time, value:vp / trSum});
    minus.push({time:bars[i].time, value:vm / trSum});
  }
  return {plus, minus};
}

function elderRay(bars, period){
  const e = ema(bars, period);
  const byTime = new Map(e.map(p => [p.time, p.value]));
  const bull = [], bear = [];
  bars.forEach(b => {
    const v = byTime.get(b.time);
    if(v == null) return;
    bull.push({time:b.time, value:b.high - v});
    bear.push({time:b.time, value:b.low - v});
  });
  return {bull, bear};
}

function keltner(bars, period, atrPeriod, mult){
  const mid = ema(bars, period);
  const a = atr(bars, atrPeriod);
  const atrAt = new Map(a.map(p => [p.time, p.value]));
  const upper = [], lower = [], centre = [];
  mid.forEach(p => {
    const av = atrAt.get(p.time);
    if(av == null) return;
    centre.push(p);
    upper.push({time:p.time, value:p.value + mult * av});
    lower.push({time:p.time, value:p.value - mult * av});
  });
  return {upper, mid:centre, lower};
}

function donchian(bars, period){
  const upper = [], lower = [], mid = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1);
    const hi = Math.max(...win.map(b => b.high));
    const lo = Math.min(...win.map(b => b.low));
    const t = bars[i].time;
    upper.push({time:t, value:hi});
    lower.push({time:t, value:lo});
    mid.push({time:t, value:(hi + lo) / 2});
  }
  return {upper, mid, lower};
}

function envelope(bars, period, pct){
  const mid = sma(bars, period);
  return {
    upper: mid.map(p => ({time:p.time, value:p.value * (1 + pct / 100)})),
    mid,
    lower: mid.map(p => ({time:p.time, value:p.value * (1 - pct / 100)})),
  };
}

// Annualised standard deviation of log returns.
function historicalVol(bars, period){
  const rets = [];
  for(let i = 1; i < bars.length; i++)
    rets.push(bars[i-1].close ? Math.log(bars[i].close / bars[i-1].close) : 0);
  const out = [];
  for(let i = period - 1; i < rets.length; i++)
    out.push({time:bars[i+1].time, value:stdev(rets.slice(i - period + 1, i + 1)) * Math.sqrt(365) * 100});
  return out;
}

// Where today's range sits among the last `history` ranges. Low readings mean
// the market is coiled, which is what the compression indicator watches for.
function rangePercentile(bars, period, history){
  const a = atr(bars, period);
  const out = [];
  for(let i = history; i < a.length; i++){
    const win = a.slice(i - history, i + 1).map(p => p.value);
    const cur = a[i].value;
    const below = win.filter(v => v < cur).length;
    out.push({time:a[i].time, value:100 * below / win.length});
  }
  return out;
}

function chandelier(bars, period, mult){
  const a = atr(bars, period);
  const atrAt = new Map(a.map(p => [p.time, p.value]));
  const out = [];
  for(let i = period - 1; i < bars.length; i++){
    const av = atrAt.get(bars[i].time);
    if(av == null) continue;
    const hi = Math.max(...bars.slice(i - period + 1, i + 1).map(b => b.high));
    out.push({time:bars[i].time, value:hi - mult * av});
  }
  return out;
}

function chaikinMF(bars, period){
  const out = [];
  for(let i = period - 1; i < bars.length; i++){
    let mfv = 0, vol = 0;
    for(let j = i - period + 1; j <= i; j++){
      const b = bars[j], span = b.high - b.low;
      const mult = span ? ((b.close - b.low) - (b.high - b.close)) / span : 0;
      mfv += mult * (b.volume || 0);
      vol += b.volume || 0;
    }
    out.push({time:bars[i].time, value: vol ? mfv / vol : 0});
  }
  return out;
}

function accumDist(bars){
  const out = [];
  let acc = 0;
  bars.forEach(b => {
    const span = b.high - b.low;
    const mult = span ? ((b.close - b.low) - (b.high - b.close)) / span : 0;
    acc += mult * (b.volume || 0);
    out.push({time:b.time, value:acc});
  });
  return out;
}

// Swing points: a bar whose high tops the `left` bars before and `right` after
// it. The lookahead is why the most recent bars never carry a pivot.
function pivots(bars, left, right){
  const highs = [], lows = [];
  for(let i = left; i < bars.length - right; i++){
    const win = bars.slice(i - left, i + right + 1);
    if(bars[i].high >= Math.max(...win.map(b => b.high)))
      highs.push({time:bars[i].time, value:bars[i].high});
    if(bars[i].low <= Math.min(...win.map(b => b.low)))
      lows.push({time:bars[i].time, value:bars[i].low});
  }
  return {highs, lows};
}

// Classic floor-trader pivots from the previous session.
function pivotPoints(bars){
  const byDay = new Map();
  bars.forEach(b => {
    const day = Math.floor(b.time / 86400);
    const cur = byDay.get(day);
    if(!cur) byDay.set(day, {high:b.high, low:b.low, close:b.close});
    else {
      cur.high = Math.max(cur.high, b.high);
      cur.low = Math.min(cur.low, b.low);
      cur.close = b.close;
    }
  });
  const days = [...byDay.keys()].sort((a, b) => a - b);
  const level = {p:[], r1:[], s1:[], r2:[], s2:[]};
  bars.forEach(b => {
    const day = Math.floor(b.time / 86400);
    const idx = days.indexOf(day);
    if(idx <= 0) return;
    const prev = byDay.get(days[idx - 1]);
    const p = (prev.high + prev.low + prev.close) / 3;
    const span = prev.high - prev.low;
    level.p.push({time:b.time, value:p});
    level.r1.push({time:b.time, value:2*p - prev.low});
    level.s1.push({time:b.time, value:2*p - prev.high});
    level.r2.push({time:b.time, value:p + span});
    level.s2.push({time:b.time, value:p - span});
  });
  return level;
}

// ZigZag keeps only the swings that moved more than `dev` percent, so the
// line reads the structure rather than every wiggle.
function zigzag(bars, dev){
  if(!bars.length) return [];
  const out = [{time:bars[0].time, value:bars[0].close}];
  let lastIdx = 0, dir = 0;
  for(let i = 1; i < bars.length; i++){
    const last = out[out.length - 1].value;
    const change = (bars[i].close - last) / last * 100;
    if(dir >= 0 && change <= -dev){ out.push({time:bars[i].time, value:bars[i].close}); dir = -1; lastIdx = i; }
    else if(dir <= 0 && change >= dev){ out.push({time:bars[i].time, value:bars[i].close}); dir = 1; lastIdx = i; }
    else if((dir > 0 && bars[i].close > last) || (dir < 0 && bars[i].close < last)){
      out[out.length - 1] = {time:bars[i].time, value:bars[i].close};
      lastIdx = i;
    }
  }
  return out;
}

// Squeeze: Bollinger bands inside Keltner channels means volatility has
// contracted, and the release is what traders position for.
function squeeze(bars, period, bbMult, kcMult){
  const bb = bollinger(bars, period, bbMult);
  const kc = keltner(bars, period, period, kcMult);
  const kcUp = new Map(kc.upper.map(p => [p.time, p.value]));
  const kcDn = new Map(kc.lower.map(p => [p.time, p.value]));
  const out = [];
  bb.upper.forEach((p, i) => {
    const up = kcUp.get(p.time), dn = kcDn.get(p.time);
    if(up == null || dn == null) return;
    const on = p.value < up && bb.lower[i].value > dn;
    out.push({time:p.time, value: on ? 1 : 0});
  });
  return out;
}

// Regime helpers: each returns a 0/1 series that the registry paints as a
// coloured strip, so the reader sees when a condition held rather than
// reading a number and deciding for themselves.
function regimeFromPair(bars, fast, slow){
  const f = ema(bars, fast), s = ema(bars, slow);
  const sAt = new Map(s.map(p => [p.time, p.value]));
  return f.map(p => {
    const sv = sAt.get(p.time);
    return sv == null ? null : {time:p.time, value: p.value > sv ? 1 : 0};
  }).filter(Boolean);
}

function drawdownSeries(bars){
  let peak = -Infinity;
  return bars.map(b => {
    peak = Math.max(peak, b.close);
    return {time:b.time, value: peak ? (b.close - peak) / peak * 100 : 0};
  });
}

// Hurst exponent by rescaled range: above 0.5 the series trends, below it
// mean-reverts. Estimated over one window rather than a full R/S regression,
// which is enough to colour a regime strip.
function hurst(bars, window){
  const out = [];
  for(let i = window; i < bars.length; i++){
    const win = bars.slice(i - window, i).map(b => b.close);
    const rets = [];
    for(let j = 1; j < win.length; j++) rets.push(win[j] - win[j-1]);
    const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
    let cum = 0, min = 0, max = 0;
    rets.forEach(r => { cum += r - mean; min = Math.min(min, cum); max = Math.max(max, cum); });
    const sd = stdev(rets);
    const rs = sd ? (max - min) / sd : 0;
    out.push({time:bars[i].time, value: rs > 0 ? Math.log(rs) / Math.log(rets.length) : 0.5});
  }
  return out;
}

/* Active instances. Each carries its own id, so the same indicator can be
   added several times with different periods (EMA 20 + EMA 50 + EMA 200) --
   which a single on/off toggle per type could never express. */
let indicators = [];
let indicatorSeq = 1;
const MAX_INDICATORS = 16;
const MAX_INDICATOR_PANES = 4;

const PARAM_META = {
  period:{label:"Chu kỳ", min:1, max:400, step:1},
  mult:{label:"Hệ số", min:.1, max:10, step:.1},
  fast:{label:"Nhanh", min:1, max:200, step:1},
  slow:{label:"Chậm", min:2, max:400, step:1},
  signal:{label:"Tín hiệu", min:1, max:200, step:1},
  tenkan:{label:"Tenkan", min:1, max:200, step:1},
  kijun:{label:"Kijun", min:2, max:300, step:1},
  senkou:{label:"Senkou", min:3, max:400, step:1},
  smoothK:{label:"Mượt K", min:1, max:50, step:1},
  smoothD:{label:"Mượt D", min:1, max:50, step:1},
};

const DEFAULT_INDICATORS = [
  // MA20 and MA50 stay on by default because those are the two averages
  // signals_build.py crosses to generate a trade: the chart shows the rule
  // that produced a signal rather than asking the reader to take it on trust.
  {type:"sma", params:{period:20}, color:"#3b82f6", visible:true},
  {type:"sma", params:{period:50}, color:"#f59e0b", visible:true},
];

function normaliseParams(type, raw){
  const defaults = INDICATORS[type].params;
  const out = {};
  Object.keys(defaults).forEach(key => {
    const meta = PARAM_META[key];
    let value = Number(raw && raw[key]);
    if(!Number.isFinite(value)) value = defaults[key];
    if(meta){
      value = Math.max(meta.min, Math.min(meta.max, value));
      if(meta.step === 1) value = Math.round(value);
    }
    out[key] = value;
  });
  return out;
}

function validIndicatorColor(value){
  return typeof value === "string" && /^#[0-9a-f]{6}$/i.test(value) ? value : null;
}

function loadIndicators(){
  let stored = null;
  try{ stored = JSON.parse(localStorage.getItem("leon_chart_inds") || "null"); }catch(e){}
  const source = Array.isArray(stored) ? stored : DEFAULT_INDICATORS;
  indicators = source
    .filter(d => d && INDICATORS[d.type])
    .map(d => ({
      id: indicatorSeq++,
      type: d.type,
      color: validIndicatorColor(d.color) || INDICATORS[d.type].color,
      visible: d.visible !== false,
      params: normaliseParams(d.type, d.params),
    })).slice(0, MAX_INDICATORS);
}

function saveIndicators(){
  try{
    localStorage.setItem("leon_chart_inds", JSON.stringify(
      indicators.map(i => ({type:i.type, params:i.params, color:i.color, visible:i.visible}))));
  }catch(e){}
}

function disposeIndicator(inst){
  (inst._series || []).forEach(s => { try{ chart.removeSeries(s); }catch(e){} });
  inst._series = null;
  inst._signature = null;
  inst._paneIndex = null;
  scheduleDraw();
}

function setIndicatorVisibility(inst){
  (inst._series || []).forEach(s => {
    try{ s.applyOptions({visible:inst.visible}); }catch(e){}
  });
}

function buildIndicator(inst, bars){
  const def = INDICATORS[inst.type];
  if(!inst.visible && def.pane !== 0){
    disposeIndicator(inst);
    return;
  }
  if(!bars.length) return;
  let plots = [];
  try{ plots = def.build(bars, inst.params) || []; }catch(e){ return; }
  const signature = plots.map(p => p.histogram ? "h" : "l").join("");

  // Keep existing series when only their data changed. Recreating every pane
  // after a history page arrived made the chart jump and discarded the user's
  // resized pane heights.
  if(inst._series && inst._signature === signature && inst._series.length === plots.length){
    plots.forEach((plot, i) => inst._series[i].setData(plot.data));
    setIndicatorVisibility(inst);
    return;
  }

  disposeIndicator(inst);
  const paneIndex = def.pane === 0 ? 0 : chart.panes().length;
  inst._paneIndex = paneIndex;

  inst._series = plots.map((plot, slot) => {
    const common = {
      priceScaleId:"right",
      priceLineVisible: false, lastValueVisible: def.pane !== 0,
      crosshairMarkerVisible: false,
      visible:inst.visible,
      title:showIndicatorTitles && slot === 0 ? indicatorLabel(inst) : "",
    };
    const s = plot.histogram
      ? chart.addSeries(LightweightCharts.HistogramSeries,
          Object.assign({color:plot.color}, common), paneIndex)
      : chart.addSeries(LightweightCharts.LineSeries, Object.assign({
          color: slot === 0 && inst.color ? inst.color : plot.color,
          lineWidth: plot.width || 1,
          // Parabolic SAR and pivots are point series, not curves: joining
          // them would draw a line through gaps that carry no meaning.
          lineStyle: plot.dots
            ? LightweightCharts.LineStyle.Dotted
            : plot.dashed ? LightweightCharts.LineStyle.Dashed
                          : LightweightCharts.LineStyle.Solid,
          pointMarkersVisible: !!plot.dots,
          lineVisible: !plot.dots,
        }, common), paneIndex);
    s.setData(plot.data);
    return s;
  });
  inst._signature = signature;

  if(def.pane !== 0 && inst._series.length){
    const first = inst._series[0];
    // Bound oscillators to their mathematical range and draw the decision
    // levels declared by the registry. Those fields existed before, but were
    // never applied, so RSI could autoscale to e.g. 43-58 and hide 30/70.
    (def.range || []).forEach(price => first.createPriceLine({
      price, color:"rgba(139,152,168,.16)", lineWidth:1,
      lineStyle:LightweightCharts.LineStyle.Dotted, axisLabelVisible:true,
    }));
    (def.guides || []).filter(x => !(def.range || []).includes(x)).forEach(price =>
      first.createPriceLine({
        price, color:"rgba(139,152,168,.42)", lineWidth:1,
        lineStyle:LightweightCharts.LineStyle.Dashed, axisLabelVisible:false,
      }));
    requestAnimationFrame(() => {
      const pane = chart.panes()[inst._paneIndex];
      const mainPane = chart.panes()[0];
      if(mainPane && mainPane.getStretchFactor() < 3) mainPane.setStretchFactor(3);
      if(pane) pane.setStretchFactor(1);
      scheduleDraw();
    });
  }
}

function applyIndicators(bars){
  indicators.forEach(inst => buildIndicator(inst, bars));
  scheduleDraw();
}

/* Live tick: recompute and push only the newest point of each plot. setData on
   every tick would rebuild thousands of points several times a second, and on
   the 5m chart with history paged in that is visible as stutter. */
function tickIndicators(){
  if(!currentBars.length) return;
  indicators.forEach(inst => {
    if(!inst._series || !inst._series.length) return;
    let plots = [];
    try{ plots = INDICATORS[inst.type].build(currentBars, inst.params) || []; }
    catch(e){ return; }
    plots.forEach((plot, i) => {
      const s = inst._series[i];
      const last = plot.data && plot.data[plot.data.length - 1];
      if(s && last) { try{ s.update(last); }catch(e){} }
    });
  });
}

let indicatorTickTimer = 0;
function scheduleIndicatorTick(){
  if(indicatorTickTimer) return;
  indicatorTickTimer = setTimeout(() => {
    indicatorTickTimer = 0;
    tickIndicators();
  }, 300);
}

// Kept as the single name the load path and the websocket path both call, so
// the two can never drift apart the way the old hand-written pair did.
function applyMA(bars){ applyIndicators(bars); }

/* ---------- data sources ----------
   Binance is fetched from the browser on purpose: it geo-blocks US datacenter
   IPs (451), so a server-side fetch from CI would fail while the reader's own
   browser succeeds. Hyperliquid is the fallback and needs no key either. */
const HL_INTERVAL = {"5m":"5m","15m":"15m","1h":"1h","4h":"4h","1d":"1d"};

// endTime pages backwards: Binance returns the LIMIT bars ending there, which
// is how scrolling left keeps finding more history instead of running out.
async function fromBinance(sym, tf, endTime){
  const url = `https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=${tf}&limit=${LIMIT}`
    + (endTime ? `&endTime=${endTime}` : "");
  const res = await fetch(url);
  if(!res.ok) throw new Error("binance " + res.status);
  const rows = await res.json();
  return rows.map(r => ({
    time: r[0] / 1000,
    open:+r[1], high:+r[2], low:+r[3], close:+r[4], volume:+r[5],
  }));
}

async function fromHyperliquid(sym, tf, endTime){
  const end = endTime || Date.now();
  const spanMs = {"5m":5,"15m":15,"1h":60,"4h":240,"1d":1440}[tf] * 60000 * LIMIT;
  const res = await fetch("https://api.hyperliquid.xyz/info", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      type:"candleSnapshot",
      req:{ coin:sym, interval:HL_INTERVAL[tf], startTime:end - spanMs, endTime:end },
    }),
  });
  if(!res.ok) throw new Error("hyperliquid " + res.status);
  const rows = await res.json();
  if(!Array.isArray(rows) || !rows.length) throw new Error("hyperliquid empty");
  return rows.map(r => ({
    time: r.t / 1000,
    open:+r.o, high:+r.h, low:+r.l, close:+r.c, volume:+r.v,
  }));
}

/* Perp context: funding and open interest say whether a move is being pushed
   by leverage or by spot demand. Both are free and keyless. */
async function perpStats(sym){
  const out = {};
  try{
    const [prem, oi] = await Promise.all([
      fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${sym}USDT`).then(r => r.json()),
      fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${sym}USDT`).then(r => r.json()),
    ]);
    if(prem && prem.lastFundingRate != null) out.funding = +prem.lastFundingRate * 100;
    if(prem && prem.markPrice != null) out.mark = +prem.markPrice;
    if(oi && oi.openInterest != null) out.oi = +oi.openInterest;
  }catch(e){ /* context is optional; the chart stands without it */ }

  try{
    const lsr = await fetch(
      `https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${sym}USDT&period=1h&limit=1`
    ).then(r => r.json());
    if(Array.isArray(lsr) && lsr[0]) out.lsr = +lsr[0].longShortRatio;
  }catch(e){}

  return out;
}

/* Coinbase premium: US spot paying above global perp is the cleanest free read
   on American institutional bid. */
async function coinbasePremium(sym, mark){
  if(!mark) return null;
  try{
    const t = await fetch(`https://api.exchange.coinbase.com/products/${sym}-USD/ticker`)
      .then(r => r.ok ? r.json() : null);
    if(!t || !t.price) return null;
    return (+t.price - mark) / mark * 100;
  }catch(e){ return null; }
}

/* ---------- rendering ---------- */
const nf = (v, d = 2) => v == null || !isFinite(v)
  ? "—"
  : v.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});

function compact(v){
  if(v == null || !isFinite(v)) return "—";
  const abs = Math.abs(v);
  if(abs >= 1e9) return (v/1e9).toFixed(2) + "B";
  if(abs >= 1e6) return (v/1e6).toFixed(2) + "M";
  if(abs >= 1e3) return (v/1e3).toFixed(1) + "K";
  return v.toFixed(2);
}

function renderStats(items){
  el.stats.innerHTML = "";
  items.forEach(it => {
    if(it.value == null) return;
    const box = document.createElement("div");
    box.className = "stat";
    box.title = it.hint || "";
    box.innerHTML =
      `<span class="k">${it.label}</span>` +
      `<span class="v${it.tone ? " " + it.tone : ""}">${it.value}</span>`;
    el.stats.appendChild(box);
  });
}

// Bars per 24 hours, so the headline change means the same thing on every
// timeframe. Measuring from the first loaded bar instead would quietly report
// a 20-day move on the 1h chart and a 40-hour move on the 5m one.
const BARS_PER_DAY = {"5m":288, "15m":96, "1h":24, "4h":6, "1d":1};

function renderQuote(bars){
  const last = bars[bars.length - 1];
  if(!last) return;

  const decimals = last.close < 1 ? 6 : last.close < 100 ? 3 : 2;
  el.price.textContent = nf(last.close, decimals);

  const span = BARS_PER_DAY[timeframe] || 24;
  const ref = bars[Math.max(0, bars.length - 1 - span)];
  const base = timeframe === "1d" ? ref.close : ref.open;
  const pct = (last.close - base) / base * 100;
  const label = timeframe === "1d" ? "1d" : "24h";

  el.chg.innerHTML =
    `${pct >= 0 ? "+" : ""}${pct.toFixed(2)}% <span class="dim">${label}</span>`;
  el.chg.className = "chg " + (pct >= 0 ? "up" : "down");
}

let inflight = 0;
// The bars currently on screen, kept so the websocket can update the last one
// in place instead of refetching the whole series.
let currentBars = [];
// fitContent() is for a chart the reader has not framed yet. Calling it on
// every refresh (as this used to) threw away their zoom and pan once a minute.
let needsFit = true;
// Which feed answered last, and how far back the series currently reaches.
// Paging older bars needs both: the same source that served the first page,
// and the timestamp to page backwards from.
let currentSource = "Binance";
let oldestTime = null;
let loadingHistory = false;
let historyExhausted = false;

function volumeBar(b){
  return {
    time: b.time, value: b.volume,
    color: b.close >= b.open ? css("--up") + "55" : css("--down") + "55",
  };
}

/* ---------- live stream ----------
   Binance publishes a kline stream that pushes the in-progress candle several
   times a second. Updating that one bar is what makes the price move on screen;
   the old 60-second full refetch could not, and reset the viewport besides.
   The REST poll below is kept as a fallback for when the socket cannot hold. */
let ws = null;
let wsRetry = 0;
let wsTimer = null;
let wsLastMessage = 0;

function closeStream(){
  clearTimeout(wsTimer);
  if(ws){
    // Drop the handlers first: an onclose that still fires would schedule a
    // reconnect for a stream nobody is watching any more.
    ws.onclose = ws.onerror = ws.onmessage = null;
    try{ ws.close(); }catch(e){}
    ws = null;
  }
  wsLastMessage = 0;
  setLive(false);
}

function setLive(on){
  el.live.hidden = !on;
}

function openStream(sym, tf, token){
  closeStream();
  let socket;
  try{
    socket = new WebSocket(
      `wss://stream.binance.com:9443/ws/${sym.toLowerCase()}usdt@kline_${tf}`);
  }catch(e){ return; }
  ws = socket;

  socket.onopen = () => {
    if(token !== inflight){ closeStream(); return; }
    wsRetry = 0;
    wsLastMessage = Date.now();
    setLive(true);
  };

  socket.onmessage = ev => {
    if(token !== inflight) return;
    let k;
    try{ k = JSON.parse(ev.data).k; }catch(e){ return; }
    if(!k) return;
    wsLastMessage = Date.now();

    const bar = {
      time: k.t / 1000,
      open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v,
    };
    candles.update(bar);
    volume.update(volumeBar(bar));

    // Keep currentBars in step so the stat strip and the moving averages read
    // the same series the chart is showing.
    const last = currentBars[currentBars.length - 1];
    const previousClose = last && Number.isFinite(last.close) ? last.close : null;
    if(last && last.time === bar.time) currentBars[currentBars.length - 1] = bar;
    else currentBars.push(bar);
    if(currentBars.length > MAX_BARS) currentBars.splice(0, currentBars.length - MAX_BARS);

    // Recompute the last point of every indicator through the same path the
    // initial load uses. The old code recomputed MA20/50 by hand right here,
    // which meant two copies of the same arithmetic that had to be kept in
    // step -- exactly the kind of pair that drifts.
    scheduleIndicatorTick();
    checkPriceAlerts(previousClose, bar.close);
    renderQuote(currentBars);
    el.upd.textContent = new Date().toLocaleTimeString("vi-VN");
    scheduleDraw();
  };

  socket.onerror = () => { try{ socket.close(); }catch(e){} };

  socket.onclose = () => {
    if(socket !== ws || token !== inflight) return;
    ws = null;
    setLive(false);
    // Back off rather than hammering: a symbol Binance does not stream would
    // otherwise reconnect in a tight loop. The polling timer still refreshes
    // the chart meanwhile, so a failed socket degrades instead of breaking.
    if(wsRetry >= 5) return;
    const wait = Math.min(30000, 1000 * Math.pow(2, wsRetry++));
    wsTimer = setTimeout(() => {
      if(token === inflight) openStream(sym, tf, token);
    }, wait);
  };
}

async function load(){
  const token = ++inflight;
  el.msg.hidden = false;
  el.msg.innerHTML = "<strong>Đang tải dữ liệu…</strong>";

  let bars, source = "Binance";
  try{
    bars = await fromBinance(symbol, timeframe);
  }catch(primary){
    try{
      bars = await fromHyperliquid(symbol, timeframe);
      source = "Hyperliquid";
    }catch(fallback){
      if(token !== inflight) return;
      closeStream();
      el.msg.innerHTML =
        `<strong>Không tải được ${symbol}</strong>` +
        `<small>Cả Binance lẫn Hyperliquid đều không trả dữ liệu cho mã này. ` +
        `Kiểm tra lại ký hiệu (ví dụ BTC, ETH, SOL).</small>`;
      return;
    }
  }
  if(token !== inflight) return;

  currentBars = bars;
  currentSource = source;
  oldestTime = bars.length ? bars[0].time : null;
  // A refresh of the same symbol re-fetches only the newest page, so any older
  // pages are gone and the reader may page back through them again.
  historyExhausted = false;
  loadingHistory = false;
  candles.setData(bars);
  volume.setData(bars.map(volumeBar));
  applyMA(bars);
  if(needsFit){
    chart.timeScale().fitContent();
    needsFit = false;
  }
  scheduleDraw();

  // Live updates ride on top of the history just loaded; Hyperliquid has no
  // equivalent public candle stream, so that path stays on the polling timer.
  if(source === "Binance") openStream(symbol, timeframe, token);
  else closeStream();

  renderQuote(bars);
  el.src.textContent = source;
  el.upd.textContent = new Date().toLocaleTimeString("vi-VN");
  el.msg.hidden = true;

  const stats = await perpStats(symbol);
  if(token !== inflight) return;
  const premium = await coinbasePremium(symbol, stats.mark);
  if(token !== inflight) return;

  const last = bars[bars.length - 1];
  // On the daily chart a "24h range" would be a single candle, so widen the
  // window to a week and say so rather than showing one bar's own high and low.
  const isDaily = timeframe === "1d";
  const window = isDaily ? 7 : (BARS_PER_DAY[timeframe] || 24);
  const day = bars.slice(-window);
  const rangeLabel = isDaily ? "7 ngày" : "24h";
  renderStats([
    { label:`Cao ${rangeLabel}`, value: nf(Math.max(...day.map(b => b.high)), 2) },
    { label:`Thấp ${rangeLabel}`, value: nf(Math.min(...day.map(b => b.low)), 2) },
    { label:"KL nến", value: compact(last.volume), hint:"Khối lượng của nến gần nhất" },
    stats.funding == null ? {} : {
      label:"Funding", value: stats.funding.toFixed(4) + "%",
      tone: stats.funding >= 0 ? "up" : "down",
      hint:"Phí funding hợp đồng vĩnh cửu. Dương = phe mua trả phí cho phe bán.",
    },
    stats.oi == null ? {} : {
      label:"Open Interest", value: compact(stats.oi),
      hint:"Tổng hợp đồng đang mở. Tăng cùng giá = tiền mới vào.",
    },
    stats.lsr == null ? {} : {
      label:"Long/Short", value: stats.lsr.toFixed(2),
      tone: stats.lsr >= 1 ? "up" : "down",
      hint:"Tỉ lệ tài khoản long/short trên Binance futures.",
    },
    premium == null ? {} : {
      label:"Coinbase prem.", value: premium.toFixed(3) + "%",
      tone: premium >= 0 ? "up" : "down",
      hint:"Giá Coinbase so với giá mark. Dương = lực mua từ Mỹ.",
    },
  ]);
}
