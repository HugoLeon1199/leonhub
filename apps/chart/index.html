<!-- Lightweight Charts is not on cdnjs; jsDelivr is the other CSP-allowed host.
     Pinned, because a silent major bump would break the series API.
     v5 for series primitives: drawings attached to the series get the chart's
     own coordinate handling, instead of a parallel canvas that has to convert
     time and price by hand and loses the shape whenever a conversion returns
     null (off-screen, or past the last bar). -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1c242e; --line:#26303c;
  --text:#e7edf3; --muted:#8b98a8; --accent:#38d39f;
  --up:#38d39f; --down:#f0655a; --warn:#e0a83c;
}
:root[data-theme="light"]{
  --bg:#f4f6f8; --panel:#ffffff; --panel-2:#eaeff4; --line:#d5dee6;
  --text:#141b22; --muted:#5d6b7a; --accent:#0c8a63;
  --up:#0c8a63; --down:#c2402f; --warn:#8a6412;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); overflow:hidden;
  font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column;
}

/* ---- Toolbar ---- */
.bar{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line);
}
.sym-input{
  width:104px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:7px; padding:6px 10px; font:inherit; font-weight:700; letter-spacing:.4px;
  text-transform:uppercase;
}
.sym-input:focus{outline:2px solid var(--accent); outline-offset:-1px}
.group{display:flex; gap:2px; background:var(--panel-2); padding:2px; border-radius:8px;
  flex:0 0 auto}
.group button{
  appearance:none; border:0; background:transparent; color:var(--muted);
  font:inherit; font-size:12.5px; padding:5px 10px; border-radius:6px; cursor:pointer;
}
.group button:hover{color:var(--text)}
.group button[aria-pressed="true"]{background:var(--accent); color:#04150f; font-weight:600}
:root[data-theme="light"] .group button[aria-pressed="true"]{color:#fff}
.group button.danger:hover{color:var(--down)}
.draw-count{min-width:18px; padding:0 4px; color:var(--muted); font-size:11px;
  display:grid; place-items:center; font-variant-numeric:tabular-nums}
.ind-panel{background:var(--panel); border-bottom:1px solid var(--line);
  padding:8px 12px; display:flex; flex-direction:column; gap:8px}
.ind-add{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ind-add select, .ind-add input{background:var(--panel-2); border:1px solid var(--line);
  color:var(--text); border-radius:6px; padding:5px 8px; font-size:12px; font-family:inherit}
.ind-add input{width:78px}
.ind-add button{background:var(--accent); color:#04150f; border:0; border-radius:6px;
  padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit}
.ind-add button.ghost{background:var(--panel-2); color:var(--muted); font-weight:400}
.ind-list{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.ind-list li{display:inline-flex; align-items:center; gap:7px; background:var(--panel-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 6px 3px 10px; font-size:12px}
.ind-list .dot{width:8px; height:8px; border-radius:50%; flex:none}
.ind-list .rm{background:none; border:0; color:var(--muted); cursor:pointer;
  font-size:14px; line-height:1; padding:2px 4px; font-family:inherit}
.ind-list .rm:hover{color:var(--down)}
.ind-list .empty{color:var(--muted); border:0; background:none; padding-left:0}
.live{display:inline-flex; align-items:center; gap:5px}
.live::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--up);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--up) 18%, transparent)}
.live[hidden]{display:none}

.quote{display:flex; align-items:baseline; gap:10px; margin-left:auto; padding-right:4px;
  flex:0 0 auto}
.price{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.4px}
.chg{font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.dim{color:var(--muted); font-weight:400; font-size:11px}

/* ---- Stat strip: the context a price alone cannot give ---- */
.stats{
  flex:0 0 auto; display:flex; gap:0; overflow-x:auto; background:var(--panel);
  border-bottom:1px solid var(--line); scrollbar-width:none;
}
.stats::-webkit-scrollbar{display:none}
.stat{
  padding:7px 14px; border-right:1px solid var(--line); min-width:112px; flex:0 0 auto;
}
.stat .k{
  font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  display:block; margin-bottom:2px;
}
.stat .v{font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums}

/* ---- Chart ---- */
main{flex:1; position:relative; min-height:0}
#chart{position:absolute; inset:0}
#drawings{position:absolute; inset:0; width:100%; height:100%; z-index:2;
  pointer-events:none; touch-action:none; outline:none}
#drawings.active{pointer-events:auto; cursor:crosshair}
#drawings.selecting{cursor:default}
.msg{
  position:absolute; inset:0; display:grid; place-content:center; text-align:center;
  gap:8px; color:var(--muted); background:var(--bg); padding:24px; z-index:3;
}
.msg strong{color:var(--text); font-size:15px}
.msg small{font-size:12.5px; max-width:46ch}
.msg[hidden]{display:none!important}

footer{
  flex:0 0 auto; padding:5px 12px; background:var(--panel); border-top:1px solid var(--line);
  font-size:11px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap;
}
footer b{color:var(--text); font-weight:600}
</style>

<div class="bar">
  <input id="sym" class="sym-input" value="BTC" maxlength="12" list="coins" aria-label="Mã coin"

<div class="ind-panel" id="ind-panel" hidden>
  <div class="ind-add">
    <select id="ind-type" aria-label="Loại chỉ báo"></select>

<div class="stats" id="stats"></div>

<main>
  <div id="chart"></div>
  <canvas id="drawings" tabindex="0" aria-label="Lớp vẽ phân tích kỹ thuật"></canvas>

  <span>Nguồn: <b id="src">Binance</b></span>

<script>
"use strict";

const TIMEFRAMES = ["5m","15m","1h","4h","1d"];
const LIMIT = 500;
// How many bars may accumulate once older pages are pulled in. Separate from
// LIMIT on purpose: LIMIT is the size of one fetch, this is the ceiling on the
// series. Trimming the series back to LIMIT after a websocket tick -- which is
// what used to happen -- threw away every page the reader had just scrolled
// back to load.
const MAX_BARS = 5000;
const COIN_CACHE_KEY = "leon_binance_coins_v1";
const COIN_CACHE_MS = 24 * 60 * 60 * 1000;
const FALLBACK_COINS = [
  "BTC","ETH","BNB","SOL","XRP","DOGE","ADA","TRX","AVAX","LINK",
  "SUI","TON","DOT","BCH","LTC","UNI","NEAR","APT","FIL","ARB",
  "OP","AAVE","ATOM","ETC","ICP","INJ","RENDER","FET","PEPE","SHIB",
];

const el = {
  sym: document.getElementById("sym"),
  coins: document.getElementById("coins"),
  tfs: document.getElementById("tfs"),
  drawing: document.getElementById("drawings"),
  drawTools: document.getElementById("draw-tools"),
  drawClear: document.getElementById("draw-clear"),
  drawCount: document.getElementById("draw-count"),
  price: document.getElementById("price"),
  chg: document.getElementById("chg"),
  stats: document.getElementById("stats"),
  msg: document.getElementById("msg"),
  src: document.getElementById("src"),
  upd: document.getElementById("upd"),
  live: document.getElementById("live"),
};

const params = new URLSearchParams(location.search);
let symbol = (params.get("sym") || "BTC").toUpperCase();
let timeframe = TIMEFRAMES.includes(params.get("tf")) ? params.get("tf") : "1h";
el.sym.value = symbol;

function renderCoinList(symbols){
  el.coins.replaceChildren(...symbols.map(sym => {
    const option = document.createElement("option");
    option.value = sym;
    return option;
  }));
}

async function loadCoinList(){
  let cached;
  try{ cached = JSON.parse(localStorage.getItem(COIN_CACHE_KEY) || "null"); }catch(e){}
  if(cached && Date.now() - cached.at < COIN_CACHE_MS && Array.isArray(cached.symbols)){
    renderCoinList(cached.symbols);
    return;
  }
  renderCoinList(FALLBACK_COINS);
  try{
    const res = await fetch("https://api.binance.com/api/v3/exchangeInfo");
    if(!res.ok) throw new Error("exchangeInfo " + res.status);
    const payload = await res.json();
    const available = (payload.symbols || [])
      .filter(x => x.status === "TRADING" && x.quoteAsset === "USDT" &&
        x.isSpotTradingAllowed !== false && x.symbol.endsWith("USDT"))
      .map(x => x.symbol.slice(0, -4))
      .filter((x, i, all) => x && all.indexOf(x) === i)
      .sort((a, b) => a.localeCompare(b));
    // exchangeInfo currently exposes hundreds of tiny pairs. Keep the field
    // scannable while pinning the widely followed names to the front.
    const popular = FALLBACK_COINS.filter(x => available.includes(x));
    const symbols = [...popular, ...available.filter(x => !popular.includes(x))].slice(0, 250);
    if(symbols.length){
      renderCoinList(symbols);
      try{ localStorage.setItem(COIN_CACHE_KEY, JSON.stringify({at:Date.now(), symbols})); }catch(e){}
    }
  }catch(e){ /* the popular fallback keeps the field useful offline */ }
}

/* ---------- theme-aware chart colors ---------- */
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

function chartTheme(){
  return {
    layout:{ background:{color:css("--bg")}, textColor:css("--muted"), fontSize:11 },
    grid:{ vertLines:{color:css("--line")}, horzLines:{color:css("--line")} },
    rightPriceScale:{ borderColor:css("--line") },
    timeScale:{ borderColor:css("--line"), timeVisible:true, secondsVisible:false },
    crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
  };
}

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  ...chartTheme(), autoSize:true,
});
const candles = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor:css("--up"), downColor:css("--down"),
  borderUpColor:css("--up"), borderDownColor:css("--down"),
  wickUpColor:css("--up"), wickDownColor:css("--down"),
});
const volume = chart.addSeries(LightweightCharts.HistogramSeries, {
  priceFormat:{type:"volume"}, priceScaleId:"vol",
});
chart.priceScale("vol").applyOptions({ scaleMargins:{top:0.84, bottom:0} });

/* ---------- indicator maths ----------
   Written out rather than pulled from a library: every formula below is
   textbook, and a dependency for arithmetic this small would cost more in
   load time than it saves. Each takes the bar array and returns
   {time, value} points aligned to it. */

function sma(bars, period, key = "close"){
  const out = [];
  let sum = 0;
  for(let i = 0; i < bars.length; i++){
    sum += bars[i][key];
    if(i >= period) sum -= bars[i - period][key];
    if(i >= period - 1) out.push({time:bars[i].time, value:sum / period});
  }
  return out;
}

function emaValues(values, period){
  // Seeded with the simple average of the first `period` values, which is the
  // convention charting platforms use; seeding with the first value alone
  // leaves a visible hook at the left edge.
  const k = 2 / (period + 1), out = [];
  let prev = null, sum = 0;
  for(let i = 0; i < values.length; i++){
    const v = values[i];
    if(i < period - 1){ sum += v; out.push(null); continue; }
    if(prev === null){ sum += v; prev = sum / period; }
    else prev = v * k + prev * (1 - k);
    out.push(prev);
  }
  return out;
}

function ema(bars, period, key = "close"){
  const vals = emaValues(bars.map(b => b[key]), period);
  return bars.map((b, i) => vals[i] == null ? null : {time:b.time, value:vals[i]})
             .filter(Boolean);
}

function wma(bars, period, key = "close"){
  const out = [], denom = period * (period + 1) / 2;
  for(let i = period - 1; i < bars.length; i++){
    let acc = 0;
    for(let j = 0; j < period; j++) acc += bars[i - period + 1 + j][key] * (j + 1);
    out.push({time:bars[i].time, value:acc / denom});
  }
  return out;
}

function hma(bars, period){
  // Hull: WMA of (2*WMA(n/2) - WMA(n)), smoothed over sqrt(n).
  const half = Math.max(1, Math.round(period / 2));
  const sqrt = Math.max(1, Math.round(Math.sqrt(period)));
  const w1 = wma(bars, half), w2 = wma(bars, period);
  const byTime = new Map(w1.map(p => [p.time, p.value]));
  const raw = w2.map(p => {
    const a = byTime.get(p.time);
    return a == null ? null : {time:p.time, close:2 * a - p.value};
  }).filter(Boolean);
  return wma(raw, sqrt);
}

function stdev(values){
  const n = values.length;
  if(n < 2) return 0;
  const mean = values.reduce((a, b) => a + b, 0) / n;
  return Math.sqrt(values.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
}

function rsi(bars, period){
  // Wilder smoothing, not a plain average: the first value is a simple mean of
  // the opening window, and every later one decays it. A plain rolling mean
  // gives a visibly different line and is the usual mistake.
  const out = [];
  let gain = 0, loss = 0;
  for(let i = 1; i < bars.length; i++){
    const diff = bars[i].close - bars[i - 1].close;
    const up = Math.max(0, diff), down = Math.max(0, -diff);
    if(i <= period){
      gain += up; loss += down;
      if(i === period){
        gain /= period; loss /= period;
        out.push({time:bars[i].time, value:loss === 0 ? 100 : 100 - 100 / (1 + gain / loss)});
      }
      continue;
    }
    gain = (gain * (period - 1) + up) / period;
    loss = (loss * (period - 1) + down) / period;
    out.push({time:bars[i].time, value:loss === 0 ? 100 : 100 - 100 / (1 + gain / loss)});
  }
  return out;
}

function macd(bars, fast, slow, signal){
  const closes = bars.map(b => b.close);
  const f = emaValues(closes, fast), s = emaValues(closes, slow);
  const line = [], lineVals = [];
  bars.forEach((b, i) => {
    if(f[i] == null || s[i] == null) return;
    lineVals.push(f[i] - s[i]);
    line.push({time:b.time, value:f[i] - s[i]});
  });
  const sig = emaValues(lineVals, signal);
  const signalPts = [], histPts = [];
  line.forEach((p, i) => {
    if(sig[i] == null) return;
    signalPts.push({time:p.time, value:sig[i]});
    histPts.push({time:p.time, value:p.value - sig[i]});
  });
  return {line, signal:signalPts, hist:histPts};
}

function bollinger(bars, period, mult){
  const upper = [], mid = [], lower = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1).map(b => b.close);
    const mean = win.reduce((a, b) => a + b, 0) / period;
    const sd = stdev(win);
    const t = bars[i].time;
    upper.push({time:t, value:mean + mult * sd});
    mid.push({time:t, value:mean});
    lower.push({time:t, value:mean - mult * sd});
  }
  return {upper, mid, lower};
}

function trueRanges(bars){
  const tr = [];
  for(let i = 0; i < bars.length; i++){
    const b = bars[i];
    tr.push(i === 0 ? b.high - b.low : Math.max(
      b.high - b.low,
      Math.abs(b.high - bars[i-1].close),
      Math.abs(b.low - bars[i-1].close)));
  }
  return tr;
}

function atr(bars, period){
  const tr = trueRanges(bars), out = [];
  let prev = null;
  for(let i = 0; i < bars.length; i++){
    if(i < period - 1) continue;
    if(prev === null) prev = tr.slice(0, period).reduce((a, b) => a + b, 0) / period;
    else prev = (prev * (period - 1) + tr[i]) / period;
    out.push({time:bars[i].time, value:prev});
  }
  return out;
}

function stochastic(bars, period, smoothK, smoothD){
  const raw = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1);
    const hi = Math.max(...win.map(b => b.high));
    const lo = Math.min(...win.map(b => b.low));
    raw.push({time:bars[i].time,
      close: hi === lo ? 50 : ((bars[i].close - lo) / (hi - lo)) * 100});
  }
  const k = sma(raw, smoothK);
  const d = sma(k.map(p => ({time:p.time, close:p.value})), smoothD);
  return {k, d};
}

function vwap(bars){
  // Session-anchored: the running sum restarts each UTC day, which is what
  // makes VWAP a level for the session rather than a slow drifting average.
  const out = [];
  let pv = 0, vol = 0, day = null;
  for(const b of bars){
    const d = Math.floor(b.time / 86400);
    if(d !== day){ day = d; pv = 0; vol = 0; }
    const typical = (b.high + b.low + b.close) / 3;
    pv += typical * (b.volume || 0);
    vol += b.volume || 0;
    if(vol > 0) out.push({time:b.time, value:pv / vol});
  }
  return out;
}

function supertrend(bars, period, mult){
  const a = atr(bars, period);
  const atrAt = new Map(a.map(p => [p.time, p.value]));
  const out = [];
  let trend = 1, prevUpper = null, prevLower = null, prevClose = null;
  for(const b of bars){
    const av = atrAt.get(b.time);
    if(av == null){ prevClose = b.close; continue; }
    const mid = (b.high + b.low) / 2;
    let upper = mid + mult * av, lower = mid - mult * av;
    // Bands only tighten while the trend holds; that ratchet is what keeps the
    // line from whipsawing on every bar.
    if(prevUpper != null && prevClose != null)
      upper = (upper < prevUpper || prevClose > prevUpper) ? upper : prevUpper;
    if(prevLower != null && prevClose != null)
      lower = (lower > prevLower || prevClose < prevLower) ? lower : prevLower;
    if(prevUpper != null){
      if(trend === 1 && b.close < prevLower) trend = -1;
      else if(trend === -1 && b.close > prevUpper) trend = 1;
    }
    out.push({time:b.time, value:trend === 1 ? lower : upper});
    prevUpper = upper; prevLower = lower; prevClose = b.close;
  }
  return out;
}

function ichimoku(bars, tenkanLen, kijunLen, senkouLen){
  const hl = (from, to) => {
    const win = bars.slice(from, to);
    if(!win.length) return null;
    return (Math.max(...win.map(b => b.high)) + Math.min(...win.map(b => b.low))) / 2;
  };
  const tenkan = [], kijun = [];
  for(let i = 0; i < bars.length; i++){
    if(i >= tenkanLen - 1){
      const v = hl(i - tenkanLen + 1, i + 1);
      if(v != null) tenkan.push({time:bars[i].time, value:v});
    }
    if(i >= kijunLen - 1){
      const v = hl(i - kijunLen + 1, i + 1);
      if(v != null) kijun.push({time:bars[i].time, value:v});
    }
  }
  return {tenkan, kijun};
}

function obv(bars){
  const out = [];
  let acc = 0;
  for(let i = 1; i < bars.length; i++){
    const d = bars[i].close - bars[i-1].close;
    acc += d > 0 ? (bars[i].volume || 0) : d < 0 ? -(bars[i].volume || 0) : 0;
    out.push({time:bars[i].time, value:acc});
  }
  return out;
}

function mfi(bars, period){
  const out = [];
  for(let i = period; i < bars.length; i++){
    let pos = 0, neg = 0;
    for(let j = i - period + 1; j <= i; j++){
      const tp = (bars[j].high + bars[j].low + bars[j].close) / 3;
      const prev = (bars[j-1].high + bars[j-1].low + bars[j-1].close) / 3;
      const flow = tp * (bars[j].volume || 0);
      if(tp > prev) pos += flow; else if(tp < prev) neg += flow;
    }
    out.push({time:bars[i].time,
      value: neg === 0 ? 100 : 100 - 100 / (1 + pos / neg)});
  }
  return out;
}

function cci(bars, period){
  const out = [];
  for(let i = period - 1; i < bars.length; i++){
    const win = bars.slice(i - period + 1, i + 1)
                    .map(b => (b.high + b.low + b.close) / 3);
    const mean = win.reduce((a, b) => a + b, 0) / period;
    const dev = win.reduce((a, b) => a + Math.abs(b - mean), 0) / period;
    const tp = (bars[i].high + bars[i].low + bars[i].close) / 3;
    out.push({time:bars[i].time, value: dev === 0 ? 0 : (tp - mean) / (0.015 * dev)});
  }
  return out;
}

function adx(bars, period){
  const tr = trueRanges(bars), plus = [0], minus = [0];
  for(let i = 1; i < bars.length; i++){
    const up = bars[i].high - bars[i-1].high;
    const dn = bars[i-1].low - bars[i].low;
    plus.push(up > dn && up > 0 ? up : 0);
    minus.push(dn > up && dn > 0 ? dn : 0);
  }
  const out = [];
  let trS = 0, pS = 0, mS = 0, adxPrev = null, dxSum = 0, count = 0;
  for(let i = 1; i < bars.length; i++){
    if(i <= period){
      trS += tr[i]; pS += plus[i]; mS += minus[i];
      if(i < period) continue;
    }else{
      trS = trS - trS / period + tr[i];
      pS  = pS  - pS  / period + plus[i];
      mS  = mS  - mS  / period + minus[i];
    }
    if(trS === 0) continue;
    const pdi = 100 * pS / trS, mdi = 100 * mS / trS;
    const dx = (pdi + mdi) === 0 ? 0 : 100 * Math.abs(pdi - mdi) / (pdi + mdi);
    if(adxPrev === null){
      dxSum += dx; count++;
      if(count === period){ adxPrev = dxSum / period; out.push({time:bars[i].time, value:adxPrev}); }
    }else{
      adxPrev = (adxPrev * (period - 1) + dx) / period;
      out.push({time:bars[i].time, value:adxPrev});
    }
  }
  return out;
}

/* ---------- indicator registry ----------
   One entry per indicator. `pane` 0 draws over the candles; anything else gets
   its own strip below. `build` returns the plotted lines, so adding an
   indicator means adding an entry here and nothing else. */
const INDICATORS = {
  sma:    {name:"SMA", pane:0, params:{period:20},
           build:(b, p) => [{data:sma(b, p.period), color:"#3b82f6"}]},
  ema:    {name:"EMA", pane:0, params:{period:9},
           build:(b, p) => [{data:ema(b, p.period), color:"#f59e0b"}]},
  wma:    {name:"WMA", pane:0, params:{period:20},
           build:(b, p) => [{data:wma(b, p.period), color:"#8b5cf6"}]},
  hma:    {name:"HMA", pane:0, params:{period:20},
           build:(b, p) => [{data:hma(b, p.period), color:"#ec4899"}]},
  bb:     {name:"Bollinger", pane:0, params:{period:20, mult:2},
           build:(b, p) => {
             const r = bollinger(b, p.period, p.mult);
             return [{data:r.upper, color:"#94a3b8"},
                     {data:r.mid, color:"#64748b", dashed:true},
                     {data:r.lower, color:"#94a3b8"}];
           }},
  vwap:   {name:"VWAP", pane:0, params:{},
           build:b => [{data:vwap(b), color:"#eab308", width:2}]},
  supertrend:{name:"Supertrend", pane:0, params:{period:10, mult:3},
           build:(b, p) => [{data:supertrend(b, p.period, p.mult), color:"#10b981", width:2}]},
  ichimoku:{name:"Ichimoku", pane:0, params:{tenkan:9, kijun:26, senkou:52},
           build:(b, p) => {
             const r = ichimoku(b, p.tenkan, p.kijun, p.senkou);
             return [{data:r.tenkan, color:"#22d3ee"}, {data:r.kijun, color:"#f43f5e"}];
           }},
  rsi:    {name:"RSI", pane:1, range:[0, 100], guides:[30, 70], params:{period:14},
           build:(b, p) => [{data:rsi(b, p.period), color:"#a78bfa"}]},
  macd:   {name:"MACD", pane:1, params:{fast:12, slow:26, signal:9},
           build:(b, p) => {
             const r = macd(b, p.fast, p.slow, p.signal);
             return [{data:r.line, color:"#3b82f6"},
                     {data:r.signal, color:"#f59e0b"},
                     {data:r.hist, color:"#64748b", histogram:true}];
           }},
  stoch:  {name:"Stochastic", pane:1, range:[0, 100], guides:[20, 80],
           params:{period:14, smoothK:3, smoothD:3},
           build:(b, p) => {
             const r = stochastic(b, p.period, p.smoothK, p.smoothD);
             return [{data:r.k, color:"#3b82f6"}, {data:r.d, color:"#f59e0b"}];
           }},
  atr:    {name:"ATR", pane:1, params:{period:14},
           build:(b, p) => [{data:atr(b, p.period), color:"#f97316"}]},
  adx:    {name:"ADX", pane:1, guides:[25], params:{period:14},
           build:(b, p) => [{data:adx(b, p.period), color:"#14b8a6"}]},
  cci:    {name:"CCI", pane:1, guides:[-100, 100], params:{period:20},
           build:(b, p) => [{data:cci(b, p.period), color:"#8b5cf6"}]},
  mfi:    {name:"MFI", pane:1, range:[0, 100], guides:[20, 80], params:{period:14},
           build:(b, p) => [{data:mfi(b, p.period), color:"#06b6d4"}]},
  obv:    {name:"OBV", pane:1, params:{},
           build:b => [{data:obv(b), color:"#84cc16"}]},
};
const INDICATOR_KEYS = Object.keys(INDICATORS);

/* Active instances. Each carries its own id, so the same indicator can be
   added several times with different periods (EMA 20 + EMA 50 + EMA 200) --
   which a single on/off toggle per type could never express. */
let indicators = [];
let indicatorSeq = 1;

const DEFAULT_INDICATORS = [
  // MA20 and MA50 stay on by default because those are the two averages
  // signals_build.py crosses to generate a trade: the chart shows the rule
  // that produced a signal rather than asking the reader to take it on trust.
  {type:"sma", params:{period:20}},
  {type:"sma", params:{period:50}, color:"#f59e0b"},
];

function loadIndicators(){
  let stored = null;
  try{ stored = JSON.parse(localStorage.getItem("leon_chart_inds") || "null"); }catch(e){}
  const source = Array.isArray(stored) ? stored : DEFAULT_INDICATORS;
  indicators = source
    .filter(d => d && INDICATORS[d.type])
    .map(d => ({
      id: indicatorSeq++,
      type: d.type,
      color: d.color || null,
      params: Object.assign({}, INDICATORS[d.type].params, d.params || {}),
    }));
}

function saveIndicators(){
  try{
    localStorage.setItem("leon_chart_inds", JSON.stringify(
      indicators.map(i => ({type:i.type, params:i.params, color:i.color}))));
  }catch(e){}
}

function disposeIndicator(inst){
  (inst._series || []).forEach(s => { try{ chart.removeSeries(s); }catch(e){} });
  inst._series = null;
}

// Indicators sharing a pane index share a price scale, so RSI and MFI can sit
// together on one strip instead of each claiming its own.
function paneScaleId(inst, slot){
  return INDICATORS[inst.type].pane === 0 ? "right" : `ind_${inst.id}`;
}

function buildIndicator(inst, bars){
  const def = INDICATORS[inst.type];
  disposeIndicator(inst);
  if(!bars.length) return;
  let plots = [];
  try{ plots = def.build(bars, inst.params) || []; }catch(e){ return; }

  inst._series = plots.map((plot, slot) => {
    const scaleId = paneScaleId(inst, slot);
    const common = {
      priceScaleId: scaleId,
      priceLineVisible: false, lastValueVisible: def.pane !== 0,
      crosshairMarkerVisible: false,
    };
    const s = plot.histogram
      ? chart.addSeries(LightweightCharts.HistogramSeries,
          Object.assign({color:plot.color}, common))
      : chart.addSeries(LightweightCharts.LineSeries, Object.assign({
          color: slot === 0 && inst.color ? inst.color : plot.color,
          lineWidth: plot.width || 1,
          lineStyle: plot.dashed ? 2 : 0,
        }, common));
    s.setData(plot.data);
    return s;
  });

  if(def.pane !== 0 && inst._series.length){
    // Sub-panes stack in the lower third, above the volume strip.
    chart.priceScale(paneScaleId(inst, 0)).applyOptions({
      scaleMargins:{top:0.72, bottom:0.16},
    });
  }
}

function applyIndicators(bars){
  indicators.forEach(inst => buildIndicator(inst, bars));
}

/* Live tick: recompute and push only the newest point of each plot. setData on
   every tick would rebuild thousands of points several times a second, and on
   the 5m chart with history paged in that is visible as stutter. */
function tickIndicators(){
  if(!currentBars.length) return;
  indicators.forEach(inst => {
    if(!inst._series || !inst._series.length) return;
    let plots = [];
    try{ plots = INDICATORS[inst.type].build(currentBars, inst.params) || []; }
    catch(e){ return; }
    plots.forEach((plot, i) => {
      const s = inst._series[i];
      const last = plot.data && plot.data[plot.data.length - 1];
      if(s && last) { try{ s.update(last); }catch(e){} }
    });
  });
}

// Kept as the single name the load path and the websocket path both call, so
// the two can never drift apart the way the old hand-written pair did.
function applyMA(bars){ applyIndicators(bars); }

/* ---------- data sources ----------
   Binance is fetched from the browser on purpose: it geo-blocks US datacenter
   IPs (451), so a server-side fetch from CI would fail while the reader's own
   browser succeeds. Hyperliquid is the fallback and needs no key either. */
const HL_INTERVAL = {"5m":"5m","15m":"15m","1h":"1h","4h":"4h","1d":"1d"};

// endTime pages backwards: Binance returns the LIMIT bars ending there, which
// is how scrolling left keeps finding more history instead of running out.
async function fromBinance(sym, tf, endTime){
  const url = `https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=${tf}&limit=${LIMIT}`
    + (endTime ? `&endTime=${endTime}` : "");
  const res = await fetch(url);
  if(!res.ok) throw new Error("binance " + res.status);
  const rows = await res.json();
  return rows.map(r => ({
    time: r[0] / 1000,
    open:+r[1], high:+r[2], low:+r[3], close:+r[4], volume:+r[5],
  }));
}

async function fromHyperliquid(sym, tf, endTime){
  const end = endTime || Date.now();
  const spanMs = {"5m":5,"15m":15,"1h":60,"4h":240,"1d":1440}[tf] * 60000 * LIMIT;
  const res = await fetch("https://api.hyperliquid.xyz/info", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      type:"candleSnapshot",
      req:{ coin:sym, interval:HL_INTERVAL[tf], startTime:end - spanMs, endTime:end },
    }),
  });
  if(!res.ok) throw new Error("hyperliquid " + res.status);
  const rows = await res.json();
  if(!Array.isArray(rows) || !rows.length) throw new Error("hyperliquid empty");
  return rows.map(r => ({
    time: r.t / 1000,
    open:+r.o, high:+r.h, low:+r.l, close:+r.c, volume:+r.v,
  }));
}

/* Perp context: funding and open interest say whether a move is being pushed
   by leverage or by spot demand. Both are free and keyless. */
async function perpStats(sym){
  const out = {};
  try{
    const [prem, oi] = await Promise.all([
      fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${sym}USDT`).then(r => r.json()),
      fetch(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${sym}USDT`).then(r => r.json()),
    ]);
    if(prem && prem.lastFundingRate != null) out.funding = +prem.lastFundingRate * 100;
    if(prem && prem.markPrice != null) out.mark = +prem.markPrice;
    if(oi && oi.openInterest != null) out.oi = +oi.openInterest;
  }catch(e){ /* context is optional; the chart stands without it */ }

  try{
    const lsr = await fetch(
      `https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=${sym}USDT&period=1h&limit=1`
    ).then(r => r.json());
    if(Array.isArray(lsr) && lsr[0]) out.lsr = +lsr[0].longShortRatio;
  }catch(e){}

  return out;
}

/* Coinbase premium: US spot paying above global perp is the cleanest free read
   on American institutional bid. */
async function coinbasePremium(sym, mark){
  if(!mark) return null;
  try{
    const t = await fetch(`https://api.exchange.coinbase.com/products/${sym}-USD/ticker`)
      .then(r => r.ok ? r.json() : null);
    if(!t || !t.price) return null;
    return (+t.price - mark) / mark * 100;
  }catch(e){ return null; }
}

/* ---------- rendering ---------- */
const nf = (v, d = 2) => v == null || !isFinite(v)
  ? "—"
  : v.toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});

function compact(v){
  if(v == null || !isFinite(v)) return "—";
  const abs = Math.abs(v);
  if(abs >= 1e9) return (v/1e9).toFixed(2) + "B";
  if(abs >= 1e6) return (v/1e6).toFixed(2) + "M";
  if(abs >= 1e3) return (v/1e3).toFixed(1) + "K";
  return v.toFixed(2);
}

function renderStats(items){
  el.stats.innerHTML = "";
  items.forEach(it => {
    if(it.value == null) return;
    const box = document.createElement("div");
    box.className = "stat";
    box.title = it.hint || "";
    box.innerHTML =
      `<span class="k">${it.label}</span>` +
      `<span class="v${it.tone ? " " + it.tone : ""}">${it.value}</span>`;
    el.stats.appendChild(box);
  });
}

// Bars per 24 hours, so the headline change means the same thing on every
// timeframe. Measuring from the first loaded bar instead would quietly report
// a 20-day move on the 1h chart and a 40-hour move on the 5m one.
const BARS_PER_DAY = {"5m":288, "15m":96, "1h":24, "4h":6, "1d":1};

function renderQuote(bars){
  const last = bars[bars.length - 1];
  if(!last) return;

  const decimals = last.close < 1 ? 6 : last.close < 100 ? 3 : 2;
  el.price.textContent = nf(last.close, decimals);

  const span = BARS_PER_DAY[timeframe] || 24;
  const ref = bars[Math.max(0, bars.length - 1 - span)];
  const base = timeframe === "1d" ? ref.close : ref.open;
  const pct = (last.close - base) / base * 100;
  const label = timeframe === "1d" ? "1d" : "24h";

  el.chg.innerHTML =
    `${pct >= 0 ? "+" : ""}${pct.toFixed(2)}% <span class="dim">${label}</span>`;
  el.chg.className = "chg " + (pct >= 0 ? "up" : "down");
}

let inflight = 0;
// The bars currently on screen, kept so the websocket can update the last one
// in place instead of refetching the whole series.
let currentBars = [];
// fitContent() is for a chart the reader has not framed yet. Calling it on
// every refresh (as this used to) threw away their zoom and pan once a minute.
let needsFit = true;
// Which feed answered last, and how far back the series currently reaches.
// Paging older bars needs both: the same source that served the first page,
// and the timestamp to page backwards from.
let currentSource = "Binance";
let oldestTime = null;
let loadingHistory = false;
let historyExhausted = false;

function volumeBar(b){
  return {
    time: b.time, value: b.volume,
    color: b.close >= b.open ? css("--up") + "55" : css("--down") + "55",
  };
}

/* ---------- live stream ----------
   Binance publishes a kline stream that pushes the in-progress candle several
   times a second. Updating that one bar is what makes the price move on screen;
   the old 60-second full refetch could not, and reset the viewport besides.
   The REST poll below is kept as a fallback for when the socket cannot hold. */
let ws = null;
let wsRetry = 0;
let wsTimer = null;
let wsLastMessage = 0;

function closeStream(){
  clearTimeout(wsTimer);
  if(ws){
    // Drop the handlers first: an onclose that still fires would schedule a
    // reconnect for a stream nobody is watching any more.
    ws.onclose = ws.onerror = ws.onmessage = null;
    try{ ws.close(); }catch(e){}
    ws = null;
  }
  wsLastMessage = 0;
  setLive(false);
}

function setLive(on){
  el.live.hidden = !on;
}

function openStream(sym, tf, token){
  closeStream();
  let socket;
  try{
    socket = new WebSocket(
      `wss://stream.binance.com:9443/ws/${sym.toLowerCase()}usdt@kline_${tf}`);
  }catch(e){ return; }
  ws = socket;

  socket.onopen = () => {
    if(token !== inflight){ closeStream(); return; }
    wsRetry = 0;
    wsLastMessage = Date.now();
    setLive(true);
  };

  socket.onmessage = ev => {
    if(token !== inflight) return;
    let k;
    try{ k = JSON.parse(ev.data).k; }catch(e){ return; }
    if(!k) return;
    wsLastMessage = Date.now();

    const bar = {
      time: k.t / 1000,
      open:+k.o, high:+k.h, low:+k.l, close:+k.c, volume:+k.v,
    };
    candles.update(bar);
    volume.update(volumeBar(bar));

    // Keep currentBars in step so the stat strip and the moving averages read
    // the same series the chart is showing.
    const last = currentBars[currentBars.length - 1];
    if(last && last.time === bar.time) currentBars[currentBars.length - 1] = bar;
    else currentBars.push(bar);
    if(currentBars.length > MAX_BARS) currentBars.splice(0, currentBars.length - MAX_BARS);

    // Recompute the last point of every indicator through the same path the
    // initial load uses. The old code recomputed MA20/50 by hand right here,
    // which meant two copies of the same arithmetic that had to be kept in
    // step -- exactly the kind of pair that drifts.
    tickIndicators();
    renderQuote(currentBars);
    el.upd.textContent = new Date().toLocaleTimeString("vi-VN");
    scheduleDraw();
  };

  socket.onerror = () => { try{ socket.close(); }catch(e){} };

  socket.onclose = () => {
    if(socket !== ws || token !== inflight) return;
    ws = null;
    setLive(false);
    // Back off rather than hammering: a symbol Binance does not stream would
    // otherwise reconnect in a tight loop. The polling timer still refreshes
    // the chart meanwhile, so a failed socket degrades instead of breaking.
    if(wsRetry >= 5) return;
    const wait = Math.min(30000, 1000 * Math.pow(2, wsRetry++));
    wsTimer = setTimeout(() => {
      if(token === inflight) openStream(sym, tf, token);
    }, wait);
  };
}

async function load(){
  const token = ++inflight;
  el.msg.hidden = false;
  el.msg.innerHTML = "<strong>Đang tải dữ liệu…</strong>";

  let bars, source = "Binance";
  try{
    bars = await fromBinance(symbol, timeframe);
  }catch(primary){
    try{
      bars = await fromHyperliquid(symbol, timeframe);
      source = "Hyperliquid";
    }catch(fallback){
      if(token !== inflight) return;
      closeStream();
      el.msg.innerHTML =
        `<strong>Không tải được ${symbol}</strong>` +
        `<small>Cả Binance lẫn Hyperliquid đều không trả dữ liệu cho mã này. ` +
        `Kiểm tra lại ký hiệu (ví dụ BTC, ETH, SOL).</small>`;
      return;
    }
  }
  if(token !== inflight) return;

  currentBars = bars;
  currentSource = source;
  oldestTime = bars.length ? bars[0].time : null;
  // A refresh of the same symbol re-fetches only the newest page, so any older
  // pages are gone and the reader may page back through them again.
  historyExhausted = false;
  loadingHistory = false;
  candles.setData(bars);
  volume.setData(bars.map(volumeBar));
  applyMA(bars);
  if(needsFit){
    chart.timeScale().fitContent();
    needsFit = false;
  }
  scheduleDraw();

  // Live updates ride on top of the history just loaded; Hyperliquid has no
  // equivalent public candle stream, so that path stays on the polling timer.
  if(source === "Binance") openStream(symbol, timeframe, token);
  else closeStream();

  renderQuote(bars);
  el.src.textContent = source;
  el.upd.textContent = new Date().toLocaleTimeString("vi-VN");
  el.msg.hidden = true;

  const stats = await perpStats(symbol);
  if(token !== inflight) return;
  const premium = await coinbasePremium(symbol, stats.mark);
  if(token !== inflight) return;

  const last = bars[bars.length - 1];
  // On the daily chart a "24h range" would be a single candle, so widen the
  // window to a week and say so rather than showing one bar's own high and low.
  const isDaily = timeframe === "1d";
  const window = isDaily ? 7 : (BARS_PER_DAY[timeframe] || 24);
  const day = bars.slice(-window);
  const rangeLabel = isDaily ? "7 ngày" : "24h";
  renderStats([
    { label:`Cao ${rangeLabel}`, value: nf(Math.max(...day.map(b => b.high)), 2) },
    { label:`Thấp ${rangeLabel}`, value: nf(Math.min(...day.map(b => b.low)), 2) },
    { label:"KL nến", value: compact(last.volume), hint:"Khối lượng của nến gần nhất" },
    stats.funding == null ? {} : {
      label:"Funding", value: stats.funding.toFixed(4) + "%",
      tone: stats.funding >= 0 ? "up" : "down",
      hint:"Phí funding hợp đồng vĩnh cửu. Dương = phe mua trả phí cho phe bán.",
    },
    stats.oi == null ? {} : {
      label:"Open Interest", value: compact(stats.oi),
      hint:"Tổng hợp đồng đang mở. Tăng cùng giá = tiền mới vào.",
    },
    stats.lsr == null ? {} : {
      label:"Long/Short", value: stats.lsr.toFixed(2),
      tone: stats.lsr >= 1 ? "up" : "down",
      hint:"Tỉ lệ tài khoản long/short trên Binance futures.",
    },
    premium == null ? {} : {
      label:"Coinbase prem.", value: premium.toFixed(3) + "%",
      tone: premium >= 0 ? "up" : "down",
      hint:"Giá Coinbase so với giá mark. Dương = lực mua từ Mỹ.",
    },
  ]);
}

/* ---------- drawing overlay ----------
   Drawings are stored in market coordinates, never pixels. Lightweight Charts
   converts them again on every zoom/pan, so a line remains attached to the
   candle and price where the reader placed it. */
const drawCtx = el.drawing.getContext("2d");
const FIB_LEVELS = [0, .236, .382, .5, .618, .786, 1];
const FIB_EXT_LEVELS = [0, .382, .618, 1, 1.272, 1.618];

/* One table per tool instead of the same switch written out in the paint, the
   hit test, the click handler and the load validator. `need` is how many points
   the tool takes; everything else reads it rather than restating it. */
const TOOLS = {
  hline: {need:1, label:"—",  title:"Đường ngang — 1 điểm"},
  hray:  {need:2, label:"→",  title:"Tia ngang — 2 điểm, kéo dài sang phải"},
  trend: {need:2, label:"╱",  title:"Đường xu hướng — 2 điểm"},
  vline: {need:1, label:"│",  title:"Đường dọc — mốc thời gian"},
  rect:  {need:2, label:"▭",  title:"Hộp — 2 điểm"},
  fib:   {need:2, label:"Fib", title:"Fibonacci thoái lui — 2 điểm"},
  fibext:{need:3, label:"Fib+", title:"Fibonacci mở rộng — 3 điểm"},
  range: {need:2, label:"⇔",  title:"Đo khoảng — Δgiá, Δ%, số nến"},
  mark:  {need:1, label:"▲",  title:"Đánh dấu — 1 điểm"},
  text:  {need:1, label:"T",  title:"Ghi chú — 1 điểm"},
};
const TOOL_KEYS = Object.keys(TOOLS);

let drawMode = "pan";
let drawings = [];
let selectedDrawing = -1;
let pendingPoint = null;
let pendingPoints = [];   // tools that take three points collect them here
let previewPoint = null;
let dragging = null;
let drawFrame = 0;

function drawingKey(){ return "leon_draw_" + symbol.replace(/[^A-Z0-9_-]/g, ""); }

function validPoint(p){
  return p && Number.isFinite(+p.t) && Number.isFinite(+p.p);
}

function shapeOk(d){
  const tool = d && TOOLS[d.type];
  if(!tool || !validPoint(d.a)) return false;
  if(tool.need >= 2 && !validPoint(d.b)) return false;
  if(tool.need >= 3 && !validPoint(d.c)) return false;
  return true;
}

function loadDrawings(){
  drawings = [];
  try{
    const value = JSON.parse(localStorage.getItem(drawingKey()) || "[]");
    if(Array.isArray(value)) drawings = value.filter(shapeOk);
  }catch(e){}
  selectedDrawing = -1;
  pendingPoint = previewPoint = null;
  pendingPoints = [];
  undoStack = []; redoStack = [];
  updateDrawCount();
  scheduleDraw();
}

/* Undo/redo hold whole-array snapshots. The drawing list is small and the
   shapes are plain data, so a snapshot is cheaper to get right than a log of
   reversible edits. */
let undoStack = [], redoStack = [];
const UNDO_MAX = 30;

function pushUndo(){
  undoStack.push(JSON.stringify(drawings));
  if(undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack = [];
}

function restoreFrom(stack, other){
  if(!stack.length) return;
  other.push(JSON.stringify(drawings));
  try{ drawings = JSON.parse(stack.pop()).filter(shapeOk); }catch(e){ return; }
  selectedDrawing = -1;
  pendingPoint = previewPoint = null;
  pendingPoints = [];
  try{ localStorage.setItem(drawingKey(), JSON.stringify(drawings)); }catch(e){}
  updateDrawCount();
  scheduleDraw();
}

function saveDrawings(){
  try{ localStorage.setItem(drawingKey(), JSON.stringify(drawings)); }catch(e){}
  updateDrawCount();
}

function updateDrawCount(){ el.drawCount.textContent = String(drawings.length); }

/* Time and pixels convert both ways only inside the loaded data. Past the last
   bar -- the empty space on the right where a trendline is most often aimed --
   coordinateToTime returns null, and a click there used to be dropped in
   silence. Same in reverse: pan a shape off screen and timeToCoordinate stops
   answering, so the shape vanished instead of being clipped.

   Both are fixed by extrapolating along the bar spacing, which is uniform in
   coordinate space because the chart lays bars out by index, not by clock. */
function barStep(){
  const ts = chart.timeScale();
  const bars = currentBars;
  if(bars.length < 2) return null;
  const last = bars[bars.length - 1], prev = bars[bars.length - 2];
  const xLast = ts.timeToCoordinate(last.time), xPrev = ts.timeToCoordinate(prev.time);
  if(xLast == null || xPrev == null || xLast === xPrev) return null;
  const dt = last.time - prev.time;
  if(!dt) return null;
  return {xLast, tLast:last.time, pxPerSec:(xLast - xPrev) / dt};
}

function timeToX(t){
  const direct = chart.timeScale().timeToCoordinate(t);
  if(direct != null) return direct;
  const step = barStep();
  return step ? step.xLast + (t - step.tLast) * step.pxPerSec : null;
}

function xToTime(x){
  const direct = chart.timeScale().coordinateToTime(x);
  if(direct != null && Number.isFinite(+direct)) return +direct;
  const step = barStep();
  return step ? step.tLast + (x - step.xLast) / step.pxPerSec : null;
}

function pointFromEvent(e){
  const rect = el.drawing.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const t = xToTime(x);
  const p = candles.coordinateToPrice(y);
  if(t == null || p == null || !Number.isFinite(t) || !Number.isFinite(+p)) return null;
  return {t, p:+p, x, y};
}

function pixelPoint(p){
  if(!validPoint(p)) return null;
  const x = timeToX(+p.t);
  const y = candles.priceToCoordinate(+p.p);
  return x == null || y == null ? null : {x, y};
}

function line(ctx, x1, y1, x2, y2){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function paintDrawing(d, index, ctx, w){
  const tool = TOOLS[d.type];
  if(!tool) return;
  const a = pixelPoint(d.a), b = d.b ? pixelPoint(d.b) : null;
  if(!a || (tool.need >= 2 && !b)) return;
  const active = index === selectedDrawing;
  ctx.strokeStyle = active ? css("--accent") : css("--warn");
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = active ? 2 : 1.35;
  ctx.setLineDash(active ? [] : [5, 3]);

  const price = v => nf(v, v < 1 ? 6 : 2);
  const small = "10px -apple-system,Segoe UI,sans-serif";

  if(d.type === "hline"){
    line(ctx, 0, a.y, w, a.y);
    ctx.font = "11px -apple-system,Segoe UI,sans-serif";
    ctx.fillText(price(d.a.p), 8, Math.max(12, a.y - 5));
  }else if(d.type === "hray"){
    // Anchored at a, extended right at a's price: a level that only applies
    // from the moment it was set, unlike hline which claims all of history.
    line(ctx, a.x, a.y, w, a.y);
    ctx.font = small;
    ctx.fillText(price(d.a.p), Math.min(a.x + 6, w - 60), a.y - 4);
  }else if(d.type === "trend"){
    line(ctx, a.x, a.y, b.x, b.y);
  }else if(d.type === "vline"){
    line(ctx, a.x, 0, a.x, ctx.canvas.height);
  }else if(d.type === "rect"){
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const rw = Math.abs(b.x - a.x), rh = Math.abs(b.y - a.y);
    ctx.globalAlpha = 0.12; ctx.fillRect(x, y, rw, rh); ctx.globalAlpha = 1;
    ctx.strokeRect(x, y, rw, rh);
  }else if(d.type === "mark"){
    const up = d.dir !== "down", s = 7;
    ctx.beginPath();
    if(up){ ctx.moveTo(a.x, a.y - s); ctx.lineTo(a.x - s, a.y + s); ctx.lineTo(a.x + s, a.y + s); }
    else  { ctx.moveTo(a.x, a.y + s); ctx.lineTo(a.x - s, a.y - s); ctx.lineTo(a.x + s, a.y - s); }
    ctx.closePath(); ctx.fill();
  }else if(d.type === "text"){
    ctx.font = "12px -apple-system,Segoe UI,sans-serif";
    ctx.fillText(d.text || "", a.x + 4, a.y - 4);
  }else if(d.type === "range"){
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const rw = Math.abs(b.x - a.x), rh = Math.abs(b.y - a.y);
    ctx.globalAlpha = 0.1; ctx.fillRect(x, y, rw, rh); ctx.globalAlpha = 1;
    ctx.strokeRect(x, y, rw, rh);
    const dp = d.b.p - d.a.p;
    const pct = d.a.p ? (dp / d.a.p) * 100 : 0;
    // Bars, not clock time: on a chart with gaps the reader is counting
    // candles, and a weekend would otherwise inflate the answer.
    const step = currentBars.length > 1
      ? (currentBars[currentBars.length-1].time - currentBars[0].time) / (currentBars.length-1)
      : 0;
    const bars = step ? Math.round(Math.abs(d.b.t - d.a.t) / step) : 0;
    ctx.font = small;
    ctx.fillText(`${dp >= 0 ? "+" : ""}${price(dp)}  ${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%  ${bars} nến`,
      x + 4, y - 4);
  }else if(d.type === "fib" || d.type === "fibext"){
    ctx.font = small;
    const ext = d.type === "fibext";
    // Retracement measures a→b. Extension projects that leg forward from c,
    // which is what the third point is for.
    const base = ext ? d.c.p : d.a.p;
    const span = ext ? (d.b.p - d.a.p) : (d.b.p - d.a.p);
    const levels = ext ? FIB_EXT_LEVELS : FIB_LEVELS;
    const xs = [a.x, b.x].concat(ext && d.c ? [pixelPoint(d.c)?.x ?? a.x] : []);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    levels.forEach(level => {
      const y = candles.priceToCoordinate(base + span * level);
      if(y == null) return;
      line(ctx, x0, y, x1, y);
      ctx.fillText(`${(level * 100).toFixed(level % 1 === 0 ? 0 : 1)}%`, x0 + 4, y - 3);
    });
  }

  if(active){
    ctx.setLineDash([]);
    [a, b, d.c ? pixelPoint(d.c) : null].forEach(pt => {
      if(!pt) return;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = css("--bg"); ctx.fill(); ctx.stroke();
    });
  }
  ctx.setLineDash([]);
}

function redraw(){
  drawFrame = 0;
  const rect = el.drawing.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const pxW = Math.round(rect.width * dpr), pxH = Math.round(rect.height * dpr);
  if(el.drawing.width !== pxW || el.drawing.height !== pxH){
    el.drawing.width = pxW; el.drawing.height = pxH;
  }
  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCtx.clearRect(0, 0, rect.width, rect.height);
  drawings.forEach((d, i) => paintDrawing(d, i, drawCtx, rect.width));
  // Preview the shape mid-placement. Index -2 never matches selectedDrawing,
  // so it draws in the unselected style without claiming to be a real shape.
  if(pendingPoints.length && previewPoint){
    const pts = pendingPoints.concat([previewPoint]);
    const ghost = {type:drawMode, a:pts[0], b:pts[1] || previewPoint};
    if(pts[2]) ghost.c = pts[2];
    if(shapeOk(ghost)) paintDrawing(ghost, -2, drawCtx, rect.width);
  }
}

function scheduleDraw(){
  if(!drawFrame) drawFrame = requestAnimationFrame(redraw);
}

function segmentDistance(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  if(dx === 0 && dy === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  const t = Math.max(0, Math.min(1, ((p.x-a.x)*dx + (p.y-a.y)*dy) / (dx*dx + dy*dy)));
  return Math.hypot(p.x - (a.x+t*dx), p.y - (a.y+t*dy));
}

function hitDrawing(p){
  const near = 6;
  // Newest first: shapes drawn later sit on top, so they answer the click.
  for(let i = drawings.length - 1; i >= 0; i--){
    const d = drawings[i], a = pixelPoint(d.a), b = d.b ? pixelPoint(d.b) : null;
    if(!a) continue;
    const t = d.type;

    if(t === "hline" && Math.abs(p.y - a.y) <= near) return i;
    if(t === "hray" && Math.abs(p.y - a.y) <= near && p.x >= a.x - near) return i;
    if(t === "vline" && Math.abs(p.x - a.x) <= near) return i;
    if((t === "mark" || t === "text") &&
       Math.hypot(p.x - a.x, p.y - a.y) <= 10) return i;
    if(t === "trend" && b && segmentDistance(p, a, b) <= near) return i;

    if((t === "rect" || t === "range") && b){
      const x0 = Math.min(a.x,b.x)-near, x1 = Math.max(a.x,b.x)+near;
      const y0 = Math.min(a.y,b.y)-near, y1 = Math.max(a.y,b.y)+near;
      // Edges only, so a box does not swallow clicks meant for what it frames.
      if(p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1){
        const inner = p.x > x0+2*near && p.x < x1-2*near &&
                      p.y > y0+2*near && p.y < y1-2*near;
        if(!inner) return i;
      }
    }

    if((t === "fib" || t === "fibext") && b){
      const ext = t === "fibext";
      const cx = ext && d.c ? (pixelPoint(d.c)?.x ?? a.x) : a.x;
      const x0 = Math.min(a.x,b.x,cx)-near, x1 = Math.max(a.x,b.x,cx)+near;
      if(p.x < x0 || p.x > x1) continue;
      const base = ext ? d.c.p : d.a.p, span = d.b.p - d.a.p;
      const hit = (ext ? FIB_EXT_LEVELS : FIB_LEVELS).some(level => {
        const y = candles.priceToCoordinate(base + span*level);
        return y != null && Math.abs(p.y-y) <= near;
      });
      if(hit) return i;
    }
  }
  return -1;
}

function setDrawMode(mode){
  drawMode = mode;
  pendingPoint = previewPoint = null;
  dragging = null;
  [...el.drawTools.querySelectorAll("[data-tool]")].forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.tool === mode)));
  el.drawing.classList.toggle("active", mode !== "pan");
  el.drawing.classList.toggle("selecting", mode === "select");
  if(mode !== "select") selectedDrawing = -1;
  scheduleDraw();
}

// Insert the generated tool buttons before undo, so the row reads
// pan · select · [tools] · undo · redo · clear.
(function buildToolButtons(){
  const anchor = document.getElementById("draw-undo");
  TOOL_KEYS.forEach(key => {
    const t = TOOLS[key];
    const b = document.createElement("button");
    b.type = "button";
    b.dataset.tool = key;
    b.setAttribute("aria-pressed", "false");
    b.title = t.title;
    b.textContent = t.label;
    el.drawTools.insertBefore(b, anchor);
  });
})();

el.drawTools.addEventListener("click", e => {
  const button = e.target.closest("[data-tool]");
  if(button) setDrawMode(button.dataset.tool);
});

document.getElementById("draw-undo")
  .addEventListener("click", () => restoreFrom(undoStack, redoStack));
document.getElementById("draw-redo")
  .addEventListener("click", () => restoreFrom(redoStack, undoStack));

el.drawClear.addEventListener("click", () => {
  if(!drawings.length) return;
  pushUndo();
  drawings = [];
  selectedDrawing = -1;
  pendingPoint = previewPoint = null;
  pendingPoints = [];
  saveDrawings();
  scheduleDraw();
});

el.drawing.addEventListener("pointerdown", e => {
  const p = pointFromEvent(e);
  if(!p) return;
  el.drawing.focus({preventScroll:true});
  e.preventDefault();

  if(drawMode === "select"){
    selectedDrawing = hitDrawing(p);
    if(selectedDrawing >= 0){
      const original = drawings[selectedDrawing];
      dragging = {start:p, index:selectedDrawing, original:JSON.parse(JSON.stringify(original))};
      el.drawing.setPointerCapture(e.pointerId);
    }
    scheduleDraw();
    return;
  }
  const tool = TOOLS[drawMode];
  if(!tool) return;
  const here = {t:p.t, p:p.p};

  if(tool.need === 1){
    pushUndo();
    const shape = {type:drawMode, a:here};
    if(drawMode === "text"){
      const note = (prompt("Ghi chú:", "") || "").trim().slice(0, 80);
      if(!note){ undoStack.pop(); return; }
      shape.text = note;
    }
    if(drawMode === "mark"){
      // Above the click points down at the bar, below points up at it.
      const mid = candles.coordinateToPrice(el.drawing.clientHeight / 2);
      shape.dir = mid != null && p.p > +mid ? "down" : "up";
    }
    drawings.push(shape);
    saveDrawings(); scheduleDraw();
    return;
  }

  pendingPoints.push(here);
  previewPoint = here;
  pendingPoint = pendingPoints[0];
  if(pendingPoints.length >= tool.need){
    pushUndo();
    const shape = {type:drawMode, a:pendingPoints[0], b:pendingPoints[1]};
    if(tool.need >= 3) shape.c = pendingPoints[2];
    drawings.push(shape);
    pendingPoints = [];
    pendingPoint = previewPoint = null;
    saveDrawings();
  }
  scheduleDraw();
});

el.drawing.addEventListener("pointermove", e => {
  const p = pointFromEvent(e);
  if(!p) return;
  if(dragging && selectedDrawing === dragging.index){
    const dt = p.t - dragging.start.t, dp = p.p - dragging.start.p;
    const moved = JSON.parse(JSON.stringify(dragging.original));
    moved.a.t += dt; moved.a.p += dp;
    if(moved.b){ moved.b.t += dt; moved.b.p += dp; }
    if(moved.c){ moved.c.t += dt; moved.c.p += dp; }
    drawings[selectedDrawing] = moved;
    scheduleDraw();
  }else if(pendingPoints.length){
    previewPoint = {t:p.t, p:p.p};
    scheduleDraw();
  }else if(drawMode === "select"){
    el.drawing.style.cursor = hitDrawing(p) >= 0 ? "move" : "default";
  }
});

function finishDrag(e){
  if(!dragging) return;
  try{ el.drawing.releasePointerCapture(e.pointerId); }catch(err){}
  dragging = null;
  saveDrawings();
}
el.drawing.addEventListener("pointerup", finishDrag);
el.drawing.addEventListener("pointercancel", finishDrag);

el.drawing.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key.toLowerCase() === "z" && !e.shiftKey){
    restoreFrom(undoStack, redoStack); e.preventDefault();
  }else if(mod && (e.key.toLowerCase() === "y" ||
                   (e.shiftKey && e.key.toLowerCase() === "z"))){
    restoreFrom(redoStack, undoStack); e.preventDefault();
  }else if((e.key === "Delete" || e.key === "Backspace") && selectedDrawing >= 0){
    pushUndo();
    drawings.splice(selectedDrawing, 1);
    selectedDrawing = -1;
    saveDrawings(); scheduleDraw(); e.preventDefault();
  }else if(e.key === "Escape"){
    pendingPoint = previewPoint = null;
    pendingPoints = [];
    selectedDrawing = -1;
    scheduleDraw();
  }
});

/* ---------- paging older history ----------
   The first fetch is the most recent LIMIT bars, which on the 5m chart is under
   two days. Scrolling left used to simply run out. Now nearing the left edge
   pulls the previous page and prepends it, so the reader can keep going back
   until the exchange has nothing older. */
async function loadOlderHistory(){
  if(loadingHistory || historyExhausted || oldestTime == null) return;
  if(!currentBars.length) return;
  loadingHistory = true;
  const token = inflight;
  try{
    // endTime is inclusive, so step back one second to avoid refetching the
    // bar already held at the left edge.
    const endMs = (oldestTime - 1) * 1000;
    const older = currentSource === "Hyperliquid"
      ? await fromHyperliquid(symbol, timeframe, endMs)
      : await fromBinance(symbol, timeframe, endMs);

    if(token !== inflight) return;          // symbol or timeframe changed mid-flight
    const fresh = older.filter(b => b.time < oldestTime);
    if(!fresh.length){ historyExhausted = true; return; }

    currentBars = fresh.concat(currentBars);
    if(currentBars.length > MAX_BARS) currentBars = currentBars.slice(-MAX_BARS);
    oldestTime = currentBars[0].time;

    // setData, not update: prepending rewrites the start of the series, and
    // the viewport stays where the reader put it because no fitContent runs.
    candles.setData(currentBars);
    volume.setData(currentBars.map(volumeBar));
    applyMA(currentBars);
    scheduleDraw();
  }catch(e){
    // A failed page is not fatal; the reader keeps the bars already loaded.
    historyExhausted = true;
  }finally{
    loadingHistory = false;
  }
}

chart.timeScale().subscribeVisibleTimeRangeChange(scheduleDraw);
chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
  // `from` counts bars from the left edge of the data, going negative once the
  // viewport scrolls past it. Ten bars of slack starts the fetch before the
  // reader reaches actual blank space.
  if(range && range.from < 10) loadOlderHistory();
});
new ResizeObserver(scheduleDraw).observe(el.drawing.parentElement);

/* ---------- controls ---------- */
TIMEFRAMES.forEach(tf => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = tf;
  b.setAttribute("aria-pressed", String(tf === timeframe));
  b.addEventListener("click", () => {
    if(tf === timeframe) return;
    timeframe = tf;
    needsFit = true;
    [...el.tfs.children].forEach(c => c.setAttribute("aria-pressed", String(c.textContent === tf)));
    syncUrl();
    load();

});

/* ---------- indicator panel ---------- */
const indEl = {
  open:  document.getElementById("ind-open"),
  count: document.getElementById("ind-count"),
  panel: document.getElementById("ind-panel"),
  type:  document.getElementById("ind-type"),
  period:document.getElementById("ind-period"),
  add:   document.getElementById("ind-add"),
  close: document.getElementById("ind-close"),
  list:  document.getElementById("ind-list"),
};

INDICATOR_KEYS.forEach(key => {
  const o = document.createElement("option");
  o.value = key;
  o.textContent = INDICATORS[key].name;
  indEl.type.appendChild(o);
});

function indicatorLabel(inst){
  const def = INDICATORS[inst.type];
  // Show the parameter that distinguishes two instances of the same type;
  // "EMA" twice in the list would be unreadable, "EMA 20"/"EMA 200" is not.
  const p = inst.params.period ?? inst.params.fast ?? inst.params.tenkan;
  return p != null ? `${def.name} ${p}` : def.name;
}

function indicatorColor(inst){
  const def = INDICATORS[inst.type];
  if(inst.color) return inst.color;
  try{ return (def.build(currentBars.slice(0, 1), inst.params)[0] || {}).color || "#8b98a5"; }
  catch(e){ return "#8b98a5"; }
}

function renderIndicatorList(){
  indEl.count.textContent = String(indicators.length);
  if(!indicators.length){
    indEl.list.innerHTML = '<li class="empty">Chưa có chỉ báo nào</li>';
    return;
  }
  indEl.list.innerHTML = indicators.map(inst =>
    `<li data-id="${inst.id}">` +
    `<i class="dot" style="background:${indicatorColor(inst)}"></i>` +
    `${indicatorLabel(inst)}` +
    `<button class="rm" type="button" data-id="${inst.id}" ` +
    `title="Bỏ ${indicatorLabel(inst)}" aria-label="Bỏ ${indicatorLabel(inst)}">×</button></li>`
  ).join("");
}

function syncPeriodPlaceholder(){
  const def = INDICATORS[indEl.type.value];
  const p = def && (def.params.period ?? def.params.fast ?? def.params.tenkan);
  indEl.period.placeholder = p != null ? String(p) : "—";
  indEl.period.disabled = p == null;
  indEl.period.value = "";
}

indEl.open.addEventListener("click", () => {
  indEl.panel.hidden = !indEl.panel.hidden;
  if(!indEl.panel.hidden){ renderIndicatorList(); syncPeriodPlaceholder(); }
});
indEl.close.addEventListener("click", () => { indEl.panel.hidden = true; });
indEl.type.addEventListener("change", syncPeriodPlaceholder);

indEl.add.addEventListener("click", () => {
  const type = indEl.type.value;
  const def = INDICATORS[type];
  if(!def) return;
  const params = Object.assign({}, def.params);
  const raw = parseInt(indEl.period.value, 10);
  if(Number.isFinite(raw) && raw > 0){
    if("period" in params) params.period = raw;
    else if("fast" in params) params.fast = raw;
    else if("tenkan" in params) params.tenkan = raw;
  }
  const inst = {id: indicatorSeq++, type, color:null, params};
  indicators.push(inst);
  buildIndicator(inst, currentBars);
  saveIndicators();
  renderIndicatorList();
});

indEl.list.addEventListener("click", e => {
  const btn = e.target.closest(".rm");
  if(!btn) return;
  const id = Number(btn.dataset.id);
  const i = indicators.findIndex(x => x.id === id);
  if(i < 0) return;
  disposeIndicator(indicators[i]);
  indicators.splice(i, 1);
  saveIndicators();
  renderIndicatorList();
});

function syncUrl(){
  const p = new URLSearchParams(location.search);
  p.set("sym", symbol);
  p.set("tf", timeframe);
  history.replaceState(null, "", "?" + p.toString());
}

let symTimer;
el.sym.addEventListener("input", () => {
  clearTimeout(symTimer);
  symTimer = setTimeout(() => {
    const next = el.sym.value.trim().toUpperCase();
    if(next && next !== symbol){
      symbol = next;
      needsFit = true;
      loadDrawings();
      syncUrl();
      load();
    }
  }, 500);
});
el.sym.addEventListener("keydown", e => { if(e.key === "Enter") el.sym.blur(); });

// Follow the hub's theme switch without a reload.
new MutationObserver(() => {
  chart.applyOptions(chartTheme());
  candles.applyOptions({
    upColor:css("--up"), downColor:css("--down"),
    borderUpColor:css("--up"), borderDownColor:css("--down"),
    wickUpColor:css("--up"), wickDownColor:css("--down"),
  });
  // Histogram colors live on each data point, so applyOptions alone cannot
  // recolor bars that are already mounted.
  volume.setData(currentBars.map(volumeBar));
  scheduleDraw();
}).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

// REST is the safety net, not a second live feed. Poll only when the socket is
// absent or has stopped delivering; a healthy Binance stream never refetches
// all 500 bars and never churns its own connection once a minute.
setInterval(() => {
  const healthy = ws && ws.readyState === WebSocket.OPEN && Date.now() - wsLastMessage < 90000;
  if(!document.hidden && !healthy) load();
}, 60000);

loadCoinList();
loadDrawings();
loadIndicators();
renderIndicatorList();
load();
</script>
</body>
</html>
